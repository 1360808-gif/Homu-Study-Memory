<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者分析・設定（Admin）</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { background: white; max-width: 1000px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e8ed; border-radius: 15px; background: #fff; text-align: left; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #d35400; border-left: 5px solid #d35400; padding-left: 10px; margin-bottom: 15px; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .summary-card { background: #fff; border: 2px solid #3498db; border-radius: 15px; padding: 15px; text-align: center; }
        .summary-card.goal { border-color: #e67e22; }
        .summary-label { font-size: 13px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
        .summary-value { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .progress-mini-bg { background: #eee; border-radius: 10px; height: 12px; margin-top: 10px; overflow: hidden; }
        .progress-mini-bar { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; transition: width 0.5s; }
        .progress-mini-bar.achieved { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); background-size: 200% 100%; animation: rainbow 2s linear infinite; }
        @keyframes rainbow { 0% { background-position: 200% 0; } 100% { background-position: 0 0; } }

        .filter-panel { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .filter-row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-label { font-weight: bold; min-width: 90px; color: #495057; font-size: 14px; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-group label { cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; background: #fff; padding: 5px 10px; border-radius: 5px; border: 1px solid #ddd; transition: 0.2s; }
        input[type="radio"]:checked + span { color: #d35400; font-weight: bold; }

        .ai-analysis-box { background: linear-gradient(135deg, #e3f2fd, #ffffff); border: 2px solid #2196f3; border-radius: 15px; padding: 18px; margin-bottom: 20px; }
        .ai-title { font-weight: bold; color: #1976d2; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .ai-report { font-size: 14px; line-height: 1.6; color: #34495e; white-space: pre-wrap; }

        .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f1f3f5; color: #495057; position: sticky; top: 0; padding: 12px; z-index: 10; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        .badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        .badge-school { background: #e3f2fd; color: #1976d2; }
        .badge-self { background: #fff3e0; color: #e65100; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-save { background: #27ae60; }
        .btn-add { background: #3498db; }
        .btn-danger { background: #e74c3c; font-size: 12px; padding: 8px; }
        .btn-reset { background: #95a5a6; font-size: 10px; padding: 5px 8px; }
        .btn-log { background: #f39c12; font-size: 10px; padding: 5px 8px; }

        /* モーダル用スタイル */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 90%; max-width: 700px; border-radius: 20px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #7f8c8d; }
        .log-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-bottom: 1px solid #eee; }
        .log-item:hover { background: #fdfdfd; }
        .log-inputs { display: flex; gap: 10px; align-items: center; }
        .log-inputs input { width: 50px; text-align: center; padding: 5px; border: 1px solid #ddd; border-radius: 4px; }

        .danger-zone { background: #fff5f5; border: 2px solid #feb2b2; padding: 15px; border-radius: 10px; margin-top: 20px; }
        input[type="number"], input[type="text"], select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🏫 管理者総合分析・設定</h1>

    <div class="summary-grid">
        <div class="summary-card goal">
            <div class="summary-label">今月の学年合計</div>
            <div class="summary-value" id="sm-total-time">0分</div>
            <div class="progress-mini-bg"><div class="progress-mini-bar" id="sm-progress-bar" style="width: 0%;"></div></div>
            <div style="font-size:11px; margin-top:5px; color:#e67e22;" id="sm-percent">達成率: 0%</div>
        </div>
        <div class="summary-card">
            <div class="summary-label" id="remain-label">目標まであと</div>
            <div class="summary-value" id="sm-remain-time">---</div>
            <div style="font-size:11px; margin-top:5px; color:#7f8c8d;" id="target-label">目標：分析中...</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">今月の着地予測</div>
            <div class="summary-value" id="sm-prediction">分析中...</div>
            <div style="font-size:11px; margin-top:5px; color:#7f8c8d;" id="sm-pace">平均：---</div>
        </div>
    </div>

    <div class="section">
        <h2>🤖 AI学級分析レポート</h2>
        <div class="ai-analysis-box">
            <div class="ai-title" id="ai-title">🔍 分析中...</div>
            <div id="ai-report" class="ai-report">データを読み込んでいます...</div>
        </div>
    </div>

    <div class="section">
        <h2>📊 児童別学習データ一覧</h2>
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-label">表示クラス:</div>
                <div class="filter-group">
                    <label><input type="radio" name="class-filter" value="all" checked onchange="renderStatsTable()"><span>全学年</span></label>
                    <label><input type="radio" name="class-filter" value="1" onchange="renderStatsTable()"><span>1組</span></label>
                    <label><input type="radio" name="class-filter" value="2" onchange="renderStatsTable()"><span>2組</span></label>
                    <label><input type="radio" name="class-filter" value="3" onchange="renderStatsTable()"><span>3組</span></label>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-label">並び替え:</div>
                <div class="filter-group">
                    <select id="sort-key" onchange="renderStatsTable()">
                        <option value="no">出席番号</option>
                        <option value="total">総合計時間</option>
                    </select>
                    <select id="sort-order" onchange="renderStatsTable()">
                        <option value="asc">昇順</option>
                        <option value="desc" selected>降順</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>番号</th><th>名前</th><th>期間合計</th><th>学校内</th><th>じぶん</th><th>最終記録</th><th>操作</th></tr>
                </thead>
                <tbody id="student-stats-body"></tbody>
            </table>
        </div>
    </div>

    <div id="logModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLogModal()">&times;</span>
            <h2 id="modal-title" style="color:#2c3e50; font-size:18px; margin-bottom:15px;">学習履歴の確認・修正</h2>
            <div id="log-list-container"></div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="section">
            <h2>👥 名簿登録</h2>
            <div style="margin-bottom: 10px;">
                <label><input type="radio" name="input-mode" value="single" checked onclick="toggleInputMode()"> 個別</label>
                <label style="margin-left: 10px;"><input type="radio" name="input-mode" value="bulk" onclick="toggleInputMode()"> 一括(Excel等)</label>
            </div>
            <div id="single-input-area" style="display:flex; gap:5px; flex-wrap:wrap;">
                <input type="number" id="st-class" placeholder="組" style="width:40px">
                <input type="number" id="st-no" placeholder="番" style="width:40px">
                <input type="text" id="st-name" placeholder="名前" style="flex:1;">
                <button class="btn btn-add" onclick="addStudent()">追加</button>
            </div>
            <div id="bulk-input-area" style="display:none; flex-direction:column; gap:10px;">
                <select id="bulk-class-select"><option value="">組を選択</option><option value="1">1組</option><option value="2">2組</option><option value="3">3組</option></select>
                <textarea id="bulk-input" rows="5" placeholder="1 佐藤 太郎&#10;2 田中 花子"></textarea>
                <button class="btn btn-add" onclick="addStudentsBulk()">一括登録実行</button>
            </div>
        </div>
        <div class="section">
            <h2>⚙️ システム設定</h2>
            <p style="font-size:12px; color:gray;">各クラスの人数（分母）を設定します</p>
            1組:<input type="number" id="denom-1" style="width:45px"> 
            2組:<input type="number" id="denom-2" style="width:45px"> 
            3組:<input type="number" id="denom-3" style="width:45px">
            <button class="btn btn-save" onclick="saveClassSizes()" style="margin-top:10px; width:100%;">設定保存</button>
        </div>
    </div>

    <div class="section danger-zone">
        <h2>⚠️ データの初期化（取り消し不可）</h2>
        <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
            <label><input type="checkbox" id="check-log"> ログのみ</label>
            <button class="btn btn-danger" onclick="bulkDelete('learning_logs')">ログ削除</button>
            <label style="margin-left:auto;"><input type="checkbox" id="check-all"> <b>パスワード含む全データ</b></label>
            <button class="btn btn-danger" onclick="bulkDelete('all')">完全初期化</button>
        </div>
    </div>
    
    <button style="width:100%; padding:20px; background:none; border:none; color:gray; text-decoration:underline; cursor:pointer;" onclick="location.href='index.html'">ログイン画面へ戻る</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, updateDoc, deleteField, query, where } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allStudents = [];
    let allLogs = [];

    async function init() {
        const studentSnap = await getDocs(collection(db, "students"));
        allStudents = []; studentSnap.forEach(d => allStudents.push({id: d.id, ...d.data()}));
        const logSnap = await getDocs(collection(db, "learning_logs"));
        allLogs = []; logSnap.forEach(d => allLogs.push({id: d.id, ...d.data()}));

        const sizes = await getDoc(doc(db, "settings", "class_sizes"));
        if(sizes.exists()){
            const d = sizes.data();
            document.getElementById('denom-1').value = d["1"]||30;
            document.getElementById('denom-2').value = d["2"]||30;
            document.getElementById('denom-3').value = d["3"]||30;
        }
        renderStatsTable();
    }

    window.renderStatsTable = function() {
        const classF = document.querySelector('input[name="class-filter"]:checked').value;
        const sortK = document.getElementById('sort-key').value;
        const sortO = document.getElementById('sort-order').value;
        
        let stats = {};
        allStudents.forEach(s => stats[`${s.class}_${s.name}`] = { name:s.name, class:s.class, no:s.no, school:0, self:0, total:0, lastDate:"-" });
        
        const now = new Date();
        const thisM = now.getMonth();
        const thisY = now.getFullYear();
        let gradeThisMonthTotal = 0;

        allLogs.forEach(l => {
            const d = new Date(l.date);
            const total = (l.school || 0) + (l.self || 0);
            if (d.getMonth() === thisM && d.getFullYear() === thisY) gradeThisMonthTotal += total;

            const key = `${l.class}_${l.name}`;
            if(stats[key]) {
                stats[key].school += (l.school || 0);
                stats[key].self += (l.self || 0);
                stats[key].total += total;
                if(stats[key].lastDate < l.date) stats[key].lastDate = l.date;
            }
        });

        updateSummary(gradeThisMonthTotal);

        let list = Object.values(stats).filter(item => classF === "all" || item.class == classF);
        list.sort((a, b) => sortO === 'asc' ? a[sortK] - b[sortK] : b[sortK] - a[sortK]);

        const tbody = document.getElementById('student-stats-body');
        tbody.innerHTML = list.map(item => `
            <tr>
                <td>${item.class}-${String(item.no).padStart(2,'0')}</td>
                <td><strong>${item.name}</strong></td>
                <td>${item.total}分</td>
                <td><span class="badge badge-school">${item.school}</span></td>
                <td><span class="badge badge-self">${item.self}</span></td>
                <td>${item.lastDate}</td>
                <td style="display:flex; gap:5px;">
                    <button class="btn btn-log" onclick="openLogModal('${item.class}', '${item.name}')">📝履歴</button>
                    <button class="btn btn-reset" onclick="resetPassword('${item.class}', '${item.no}', '${item.name}')">🔑パス忘</button>
                </td>
            </tr>`).join('');
    };

    // 履歴モーダルを開く
    window.openLogModal = async (cls, name) => {
        const container = document.getElementById('log-list-container');
        document.getElementById('modal-title').innerText = `${cls}組 ${name} さんの履歴`;
        container.innerHTML = "読み込み中...";
        document.getElementById('logModal').style.display = 'block';

        // 特定の生徒のログのみ抽出
        const studentLogs = allLogs.filter(l => l.class == cls && l.name == name);
        studentLogs.sort((a, b) => b.date.localeCompare(a.date)); // 新しい順

        if(studentLogs.length === 0) {
            container.innerHTML = "<p>記録がまだありません。</p>";
            return;
        }

        container.innerHTML = studentLogs.map(log => `
            <div class="log-item">
                <div style="font-weight:bold; color:#7f8c8d; font-size:13px;">${log.date}</div>
                <div class="log-inputs">
                    学:<input type="number" id="edit-school-${log.id}" value="${log.school || 0}">
                    自:<input type="number" id="edit-self-${log.id}" value="${log.self || 0}">
                    <button class="btn btn-save" style="padding:5px 8px; font-size:10px;" onclick="updateSingleLog('${log.id}')">保存</button>
                    <button class="btn btn-danger" style="padding:5px 8px; font-size:10px;" onclick="deleteSingleLog('${log.id}')">削除</button>
                </div>
            </div>
        `).join('');
    };

    // 個別ログ修正
    window.updateSingleLog = async (logId) => {
        const sch = Number(document.getElementById(`edit-school-${logId}`).value);
        const slf = Number(document.getElementById(`edit-self-${logId}`).value);
        try {
            await updateDoc(doc(db, "learning_logs", logId), { school: sch, self: slf });
            alert("修正しました。反映のため再読み込みします。");
            location.reload();
        } catch(e) { alert("エラーが発生しました"); }
    };

    // 個別ログ削除
    window.deleteSingleLog = async (logId) => {
        if(!confirm("この1件の記録を削除しますか？")) return;
        try {
            await deleteDoc(doc(db, "learning_logs", logId));
            alert("削除しました。");
            location.reload();
        } catch(e) { alert("エラーが発生しました"); }
    };

    window.closeLogModal = () => {
        document.getElementById('logModal').style.display = 'none';
    };

    window.resetPassword = async (cls, no, name) => {
        if (!confirm(`${name} さんのパスワードをリセットしますか？`)) return;
        try {
            await updateDoc(doc(db, "students", `s_${cls}_${no}`), { pin: deleteField() });
            alert("リセットしました。");
            location.reload();
        } catch (e) { alert("失敗しました。"); }
    };

    // その他既存の関数 (updateSummary, addStudentsBulk, bulkDelete, toggleInputMode, saveClassSizes)
    function updateSummary(thisMonthTotal) {
        const targetMin = 30000;
        const percent = Math.min(100, Math.round((thisMonthTotal / targetMin) * 100));
        document.getElementById('sm-total-time').innerText = thisMonthTotal + "分";
        document.getElementById('sm-progress-bar').style.width = percent + '%';
        document.getElementById('sm-percent').innerText = `達成率: ${percent}%`;
        document.getElementById('ai-report').innerText = `今月の合計学習時間は ${thisMonthTotal} 分です。`;
        document.getElementById('ai-title').innerText = "✅ システム稼働中";
    }

    window.addStudentsBulk = async () => {
        const classVal = document.getElementById('bulk-class-select').value;
        const rawInput = document.getElementById('bulk-input').value.trim();
        if (!classVal || !rawInput) return alert("入力不足です");
        const lines = rawInput.split(/\r?\n/);
        for (let line of lines) {
            const match = line.trim().match(/^(\d+)[\t\s]+(.+)$/);
            if (match) {
                const no = Number(match[1]);
                const name = match[2].trim();
                await setDoc(doc(db, "students", `s_${classVal}_${no}`), { class: Number(classVal), no: no, name: name });
            }
        }
        alert("登録完了！"); location.reload();
    };

    window.bulkDelete = async (m) => {
        const id = m === 'all' ? 'check-all' : 'check-log';
        if(!document.getElementById(id).checked) return alert("チェックを入れてください");
        if(!confirm("本当に実行しますか？")) return;
        const s1 = await getDocs(collection(db, "learning_logs"));
        for(const d of s1.docs) await deleteDoc(doc(db, "learning_logs", d.id));
        if(m === 'all') {
            const s2 = await getDocs(collection(db, "students"));
            for(const d of s2.docs) await deleteDoc(doc(db, "students", d.id));
        }
        location.reload();
    };

    window.toggleInputMode = () => {
        const mode = document.querySelector('input[name="input-mode"]:checked').value;
        document.getElementById('single-input-area').style.display = (mode === 'single' ? 'flex' : 'none');
        document.getElementById('bulk-input-area').style.display = (mode === 'bulk' ? 'flex' : 'none');
    };

    window.saveClassSizes = async () => {
        const d = { "1":Number(document.getElementById('denom-1').value), "2":Number(document.getElementById('denom-2').value), "3":Number(document.getElementById('denom-3').value) };
        await setDoc(doc(db, "settings", "class_sizes"), d); alert("保存しました");
    };

    init();
</script>
</body>
</html>
