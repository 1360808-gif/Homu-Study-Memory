<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者画面</title>
<style>
  body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
  .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .section { border-bottom: 1px solid #eee; padding: 20px 0; }
  h2 { color: #2c3e50; font-size: 18px; }
  input[type="number"] { width: 50px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
  .btn-save { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  .btn-back { display: block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <h1>⚙️ 管理者設定</h1>

  <div class="section">
    <h2>👥 クラス人数の設定</h2>
    <p style="font-size: 12px; color: #666;">ダッシュボードの平均計算に使われます</p>
    1組: <input type="number" id="denom-1" value="30">人<br><br>
    2組: <input type="number" id="denom-2" value="30">人<br><br>
    3組: <input type="number" id="denom-3" value="30">人<br>
    <button class="btn-save" onclick="saveClassSizes()">設定を保存して反映</button>
  </div>

  <a href="index.html" class="btn-back">ログアウト画面へ</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 初期値の読み込み
  async function loadSettings() {
    const docSnap = await getDoc(doc(db, "settings", "class_sizes"));
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById('denom-1').value = data["1"];
      document.getElementById('denom-2').value = data["2"];
      document.getElementById('denom-3').value = data["3"];
    }
  }
  loadSettings();

  // 保存処理
  window.saveClassSizes = async function() {
    const settings = {
      "1": Number(document.getElementById('denom-1').value) || 1,
      "2": Number(document.getElementById('denom-2').value) || 1,
      "3": Number(document.getElementById('denom-3').value) || 1
    };
    try {
      await setDoc(doc(db, "settings", "class_sizes"), settings);
      alert("全児童のダッシュボードに反映しました！");
    } catch (e) {
      alert("保存エラー: " + e);
    }
  };
</script>
</body>
</html>
