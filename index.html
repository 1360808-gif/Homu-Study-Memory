<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - がんばりダッシュボード</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff; /* 他の画面と同じ背景色 */
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center; /* 画面の中央に配置 */
    height: 100vh; /* 画面いっぱいの高さ */
    margin: 0;
  }
  .login-container {
    background: #fff;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 40px 30px;
    text-align: center;
  }
  h1 { font-size: 24px; color: #2c3e50; margin-bottom: 5px; }
  p.subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }

  .input-group {
    margin-bottom: 20px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #34495e;
    margin-bottom: 8px;
  }
  /* 入力フォームのデザイン */
  .input-group select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ecf0f1;
    border-radius: 10px;
    font-size: 16px;
    box-sizing: border-box;
    cursor: pointer;
    transition: border-color 0.3s;
    background-color: #fafafa;
  }
  .input-group select:focus {
    border-color: #3498db;
    outline: none;
    background-color: #fff;
  }

  /* ログインボタン */
  button.login-btn {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background-color: #f39c12; /* ダッシュボードの目標色と統一 */
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
  }
  button.login-btn:hover { background-color: #e67e22; }

  /* 先生用リンク */
  .teacher-login {
    margin-top: 25px;
    font-size: 13px;
    color: #95a5a6;
  }
  .teacher-login a {
    color: #3498db;
    text-decoration: none;
    font-weight: bold;
  }
  .teacher-login a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-container">
  <h1>🌟 学習アプリ</h1>
  <p class="subtitle">じぶんのクラスとなまえをえらんでね</p>

  <div class="input-group">
    <label>🏫 クラス</label>
    <select id="class-select">
      <option value="1">1組</option>
      <option value="2">2組</option>
      <option value="3">3組</option>
    </select>
  </div>

  <div class="input-group">
    <label>👤 なまえ</label>
    <select id="name-select">
      <option value="aoki">青木 太郎</option>
      <option value="sato">佐藤 花子</option>
      <option value="suzuki">鈴木 一郎</option>
      <option value="guest">ゲスト（おためし）</option>
    </select>
  </div>

  <button class="login-btn" onclick="login()">はじめる！</button>

  <div class="teacher-login">
    👨‍🏫 先生ですか？ <a href="#" onclick="teacherLogin()">先生用ログイン</a>
  </div>
</div>

<script>
  function login() {
    // 選択された名前などを取得して、ローカルストレージに保存するなどの処理も可能ですが、
    // 今回はシンプルにダッシュボード画面へページ移動させます。
    location.href = 'dashboard.html';
  }

  function teacherLogin() {
    alert('先生モードでログインします。');
    location.href = 'dashboard.html';
  }
</script>
</body>
</html>
