<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 600px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  .title-badge { background: #6c5ce7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; display: inline-block; margin-top: 10px; }
  .ai-message-area { background: linear-gradient(135deg, #e0f7fa, #ffffff); border: 2px solid #4fc3f7; border-radius: 15px; padding: 15px; margin: 15px 0 10px 0; display: flex; align-items: center; gap: 15px; text-align: left; }
  .ai-icon { font-size: 40px; }
  .ai-text { font-size: 14px; font-weight: bold; color: #0277bd; line-height: 1.4; }
  .ai-stats { font-size: 11px; color: #546e7a; margin-top: 5px; }
  .button-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0 25px 0; }
  .btn-record { width: 100%; padding: 18px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #f39c12, #e67e22); border: none; border-radius: 15px; cursor: pointer; }
  .section { background-color: #fdfdfd; border: 1px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  .progress-bg { background-color: #ecf0f1; border-radius: 10px; height: 30px; position: relative; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, #f1c40f, #f39c12); height: 100%; width: 0%; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; transition: width 0.5s ease; }
  .chart-container { position: relative; height: 250px; width: 100%; }
</style>
</head>
<body>

<div class="app-container">
  <span id="user-title" class="title-badge">かけだしの学習者</span>
  <h1>🏠 <span id="user-name-display">ゲスト</span></h1>

  <div class="ai-message-area">
    <div class="ai-icon" id="ai-icon">🤖</div>
    <div class="ai-content">
        <div class="ai-text" id="ai-comment">データをよみこみ中...</div>
        <div class="ai-stats" id="ai-stats"></div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn-record" onclick="goToInput()">✏️ がんばりをきろくする</button>
  </div>

  <div class="section">
    <h2>🤝 みんなの合計（学年目標）</h2>
    <p id="goal-text" style="font-weight:bold; color:#e67e22; margin-bottom:10px;">目標: 30,000分</p>
    <div class="progress-bg"><div class="progress-bar" id="progress-bar">0%</div></div>
  </div>

  <div class="section">
    <h2>🔥 クラス平均（1人あたり）</h2>
    <div class="chart-container"><canvas id="classChart"></canvas></div>
  </div>

  <div class="section">
    <h2>👤 あなたの履歴（直近10件）</h2>
    <div class="chart-container"><canvas id="personalChart"></canvas></div>
  </div>

  <button style="width:100%; padding:15px; background:#95a5a6; color:white; border:none; border-radius:10px; cursor:pointer;" onclick="location.href='index.html'">🚪 ログアウト</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト", myClass = params.get('class') || "1";
  document.getElementById('user-name-display').innerText = `${myClass}組 ${myName} さん`;

  let cachedLogs = [];
  let denoms = { "1": 30, "2": 30, "3": 30 }; // admin設定読み込み前の初期値

  // 1. adminからの人数設定をリアルタイム受信
  onSnapshot(doc(db, "settings", "class_sizes"), (docSnap) => {
    if (docSnap.exists()) {
      denoms = docSnap.data();
      render();
    }
  });

  // 2. 学習ログの読み込み
  onSnapshot(query(collection(db, "learning_logs"), orderBy("date", "asc")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  const classCtx = document.getElementById('classChart').getContext('2d');
  let classChart = new Chart(classCtx, {
    type: 'bar',
    data: { labels: ['1組', '2組', '3組'], datasets: [{ label: '学校', data:[0,0,0], backgroundColor:'#2980b9'}, {label:'自分', data:[0,0,0], backgroundColor:'#c0392b'}]},
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
  });

  const personalCtx = document.getElementById('personalChart').getContext('2d');
  let personalChart = new Chart(personalCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: '学校', data:[], borderColor:'#2980b9', fill:false}, {label:'自分', data:[], borderColor:'#c0392b', fill:false}]},
    options: { responsive: true, maintainAspectRatio: false }
  });

  function render() {
    let classTotals = { "1": {s:0, f:0}, "2": {s:0, f:0}, "3": {s:0, f:0} };
    let myData = { labels: [], s: [], f: [] };
    let grandTotal = 0;

    cachedLogs.forEach(log => {
      const isMine = log.name === myName;
      if (isMine) {
        myData.labels.push(log.date);
        myData.s.push(log.school);
        myData.f.push(log.self);
      }
      if (classTotals[log.class]) {
        classTotals[log.class].s += log.school;
        classTotals[log.class].f += log.self;
      }
      grandTotal += (log.school + log.self);
    });

    const target = 30000;
    const percent = Math.min(100, Math.round((grandTotal / target) * 100));
    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('progress-bar').innerText = percent + '%';
    document.getElementById('goal-text').innerText = `学年合計: ${grandTotal}分 (目標まであと ${Math.max(0, target - grandTotal)}分)`;

    classChart.data.datasets[0].data = [classTotals["1"].s/denoms["1"], classTotals["2"].s/denoms["2"], classTotals["3"].s/denoms["3"]];
    classChart.data.datasets[1].data = [classTotals["1"].f/denoms["1"], classTotals["2"].f/denoms["2"], classTotals["3"].f/denoms["3"]];
    classChart.update();

    personalChart.data.labels = myData.labels.slice(-10);
    personalChart.data.datasets[0].data = myData.s.slice(-10);
    personalChart.data.datasets[1].data = myData.f.slice(-10);
    personalChart.update();

    document.getElementById('ai-comment').innerText = "きみの頑張りをしっかり見守っているよ！";
  }

  window.goToInput = () => location.href = `input.html${window.location.search}`;
</script>
</body>
</html>
