<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習きろくアプリ（プロトタイプ）</title>
<style>
  /* ＝ タブレット向けの全体デザイン ＝ */
  body {
    f<div class="app-container">
  <h1>✏️ クラス学習きろく</h1>

  <div id="step-name" class="step active">
    <p>自分の名前をえらんでね</p>
    <select id="user-select">
      <option value="">-- なまえをえらぶ --</option>
      <option value="1">1番: 青木 太郎</option>
      <option value="2">2番: 伊藤 花子</option>
      <option value="3">3番: 宇田川 健太</option>
    </select>
    <button onclick="goToPassword()">つぎへ</button>
  </div>

  <div id="step-password" class="step">
    <p id="password-message">パスワード（4ケタのすうじ）</p>
    <input type="password" id="password-input" placeholder="****" maxlength="4" inputmode="numeric">
    <button onclick="checkPassword()">OK</button>
    <button class="back-btn" onclick="showStep('step-name')">もどる</button>
  </div>

  <div id="step-input" class="step">
    <p>今週のがんばりを記録しよう！</p>
    
    <div style="background-color: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
      <p style="font-size: 14px; color: #666; text-align: left; margin: 0 0 10px 0;">📅 いつから？</p>
      <input type="date" id="date-input" style="margin-bottom: 0;">
    </div>
    
    <div style="background-color: #e8f4f8; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
      <p style="font-size: 16px; font-weight: bold; color: #2980b9; text-align: left; margin: 0 0 10px 0;">① がっこうの勉強（宿題・ふくしゅう）</p>
      <div class="time-input-container" style="margin-bottom: 0;">
        <input type="number" id="school-hour-input" min="0" placeholder="0"> <span>時間</span>
        <input type="number" id="school-minute-input" min="0" max="59" placeholder="0"> <span>分</span>
      </div>
    </div>

    <div style="background-color: #fff0f5; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
      <p style="font-size: 16px; font-weight: bold; color: #c0392b; text-align: left; margin: 0 0 10px 0;">② じぶんの学習（読書・プログラミング等）</p>
      <div class="time-input-container" style="margin-bottom: 0;">
        <input type="number" id="self-hour-input" min="0" placeholder="0"> <span>時間</span>
        <input type="number" id="self-minute-input" min="0" max="59" placeholder="0"> <span>分</span>
      </div>
    </div>

    <button onclick="submitData()" style="background-color: #2ecc71;">記録する！</button>
    <button class="back-btn" onclick="showStep('step-name')">はじめから</button>
  </div>

  <div id="step-complete" class="step">
    <h2>🎉 記録完了！</h2>
    <p>よくがんばりました！<br>みんなのグラフを見てみよう。</p>
    <button onclick="showStep('step-name')">最初の画面にもどる</button>
  </div>

</div>

<script>
  const mockDatabase = {}; 
  let selectedUser = "";

  function showStep(stepId) {
    document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
    
    if(stepId === 'step-name') {
      document.getElementById('password-input').value = "";
      document.getElementById('school-hour-input').value = "";
      document.getElementById('school-minute-input').value = "";
      document.getElementById('self-hour-input').value = "";
      document.getElementById('self-minute-input').value = "";
    }
  }

  function goToPassword() {
    selectedUser = document.getElementById('user-select').value;
    if (selectedUser === "") {
      alert("なまえをえらんでね！");
      return;
    }
    const msg = document.getElementById('password-message');
    if (mockDatabase[selectedUser]) {
      msg.innerHTML = "パスワードを入れてね<br>（4ケタのすうじ）";
    } else {
      msg.innerHTML = "<b>【はじめてのログイン】</b><br>自分だけのパスワード（4ケタ）を決めて入力してね。";
    }
    showStep('step-password');
  }

  function checkPassword() {
    const passInput = document.getElementById('password-input').value;
    if (passInput.length !== 4) {
      alert("パスワードは4ケタのすうじにしてね！");
      return;
    }
    if (mockDatabase[selectedUser]) {
      if (mockDatabase[selectedUser] === passInput) {
        showStep('step-input'); 
      } else {
        alert("パスワードがちがいます。");
      }
    } else {
      mockDatabase[selectedUser] = passInput;
      alert("パスワードを登録しました！わすれないようにね。");
      showStep('step-input');
    }
  }

  function submitData() {
    const date = document.getElementById('date-input').value;
    
    // 学業に関わる時間
    const schoolHour = document.getElementById('school-hour-input').value || 0;
    const schoolMinute = document.getElementById('school-minute-input').value || 0;
    const schoolTotalMinutes = parseInt(schoolHour) * 60 + parseInt(schoolMinute);

    // それ以外の自主学習
    const selfHour = document.getElementById('self-hour-input').value || 0;
    const selfMinute = document.getElementById('self-minute-input').value || 0;
    const selfTotalMinutes = parseInt(selfHour) * 60 + parseInt(selfMinute);

    if (!date) {
      alert("日付をえらんでね！");
      return;
    }
    // どちらも0分だった場合のエラーチェック
    if (schoolTotalMinutes === 0 && selfTotalMinutes === 0) {
      alert("どちらかの時間を入力してね！");
      return;
    }

    console.log("送信データ:", {
      user: selectedUser,
      date: date,
      schoolStudyTime: schoolTotalMinutes,
      selfStudyTime: selfTotalMinutes
    });

    showStep('step-complete');
  }
</script>

</body>
</html>
