<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者分析ダッシュボード</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { background: white; max-width: 950px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e8ed; border-radius: 15px; background: #fff; text-align: left; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        h2 { font-size: 18px; color: #d35400; border-left: 5px solid #d35400; padding-left: 10px; margin-bottom: 15px; }
        
        /* フィルタエリア */
        .filter-panel { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .filter-row { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-label { font-weight: bold; min-width: 80px; color: #495057; }
        .filter-group { display: flex; gap: 15px; }
        .filter-group label { cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 14px; }

        /* AI分析エリア */
        .ai-analysis-box { background: linear-gradient(135deg, #e3f2fd, #ffffff); border: 2px solid #2196f3; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .ai-title { font-weight: bold; color: #1976d2; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .ai-report { font-size: 14px; line-height: 1.6; color: #34495e; white-space: pre-wrap; }

        /* テーブルスタイル */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f1f3f5; color: #495057; position: sticky; top: 0; }
        .stats-badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 12px; }
        .badge-school { background: #e3f2fd; color: #1976d2; }
        .badge-self { background: #fff3e0; color: #e65100; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .btn-save { background: #27ae60; }
        .btn-add { background: #3498db; }
        .btn-danger { background: #e74c3c; width: 100%; margin-top: 10px; }
        .danger-zone { background: #fff5f5; border: 2px solid #feb2b2; padding: 15px; border-radius: 10px; }
        input[type="number"], input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🏫 学級管理者分析ダッシュボード</h1>

    <div class="section">
        <h2>🤖 AI学級分析レポート</h2>
        <div class="ai-analysis-box">
            <div class="ai-title" id="ai-title"><span>🔍</span> データ分析中...</div>
            <div class="ai-report" id="ai-report">読み込み中...</div>
        </div>
    </div>

    <div class="section">
        <h2>📊 児童別・学習状況スコア</h2>
        
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-label">表示クラス:</div>
                <div class="filter-group">
                    <label><input type="radio" name="class-filter" value="all" checked onchange="renderStatsTable()"> 学年全体</label>
                    <label><input type="radio" name="class-filter" value="1" onchange="renderStatsTable()"> 1組</label>
                    <label><input type="radio" name="class-filter" value="2" onchange="renderStatsTable()"> 2組</label>
                    <label><input type="radio" name="class-filter" value="3" onchange="renderStatsTable()"> 3組</label>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-label">集計期間:</div>
                <div class="filter-group">
                    <label><input type="radio" name="period-filter" value="all" checked onchange="renderStatsTable()"> 全期間</label>
                    <label><input type="radio" name="period-filter" value="week" onchange="renderStatsTable()"> 直近1週間</label>
                    <label><input type="radio" name="period-filter" value="month" onchange="renderStatsTable()"> 直近1ヶ月</label>
                    <label><input type="radio" name="period-filter" value="term" onchange="renderStatsTable()"> 今学期</label>
                </div>
            </div>
        </div>

        <div style="max-height: 500px; overflow-y: auto;">
            <table id="student-stats-table">
                <thead>
                    <tr>
                        <th style="width:70px;">出席番号</th>
                        <th>名前</th>
                        <th>期間合計</th>
                        <th>学校内</th>
                        <th>じぶん学習</th>
                        <th>最終記録日</th>
                    </tr>
                </thead>
                <tbody id="student-stats-body"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h2>👥 設定と管理</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
            <div>
                <h3>クラス人数設定</h3>
                1組:<input type="number" id="denom-1" style="width:40px"> 
                2組:<input type="number" id="denom-2" style="width:40px"> 
                3組:<input type="number" id="denom-3" style="width:40px">
                <button class="btn btn-save" onclick="saveClassSizes()" style="margin-top:10px; width:100%;">保存</button>
            </div>
            <div>
                <h3>名簿追加</h3>
                <input type="number" id="st-class" placeholder="組" style="width:40px">
                <input type="number" id="st-no" placeholder="番" style="width:40px">
                <input type="text" id="st-name" placeholder="名前" style="width:100px">
                <button class="btn btn-add" onclick="addStudent()" style="margin-top:10px; width:100%;">追加</button>
            </div>
        </div>
    </div>

    <div class="section danger-zone">
        <h2>⚠️ データの初期化</h2>
        <div style="display:flex; gap:10px;">
            <label style="flex:1;"><input type="checkbox" id="check-log"> 学習ログ全削除</label>
            <button class="btn btn-danger" onclick="bulkDelete('learning_logs')" style="width:100px; padding:5px;">実行</button>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <label style="flex:1;"><input type="checkbox" id="check-all"> 完全リセット(名簿含)</label>
            <button class="btn btn-danger" onclick="bulkDelete('all')" style="width:100px; padding:5px;">実行</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allStudents = [];
    let allLogs = [];

    async function initAdmin() {
        allStudents = await fetchColl("students");
        allLogs = await fetchColl("learning_logs");
        const sizes = await getDoc(doc(db, "settings", "class_sizes"));
        if(sizes.exists()){
            const d = sizes.data();
            document.getElementById('denom-1').value = d["1"]||30;
            document.getElementById('denom-2').value = d["2"]||30;
            document.getElementById('denom-3').value = d["3"]||30;
        }
        renderStatsTable();
    }

    async function fetchColl(name) {
        const snap = await getDocs(collection(db, name));
        let arr = [];
        snap.forEach(d => arr.push({id: d.id, ...d.data()}));
        return arr;
    }

    window.renderStatsTable = function() {
        const classF = document.querySelector('input[name="class-filter"]:checked').value;
        const periodF = document.querySelector('input[name="period-filter"]:checked').value;
        const tbody = document.getElementById('student-stats-body');
        tbody.innerHTML = "";

        // 期間の計算
        const now = new Date();
        let startDate = new Date(0); // デフォルト全期間

        if(periodF === 'week') startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        else if(periodF === 'month') startDate = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
        else if(periodF === 'term') {
            const month = now.getMonth() + 1; // 1-12
            if(month >= 4 && month <= 8) startDate = new Date(now.getFullYear(), 3, 1); // 4/1
            else if(month >= 9 && month <= 12) startDate = new Date(now.getFullYear(), 8, 1); // 9/1
            else startDate = new Date(now.getFullYear() - (month < 4 ? 1 : 0), 0, 1); // 1/1
        }

        // 集計
        let stats = {};
        allStudents.forEach(s => {
            stats[s.name] = { class: s.class, no: s.no, school: 0, self: 0, lastDate: "-" };
        });

        allLogs.forEach(l => {
            const logDate = new Date(l.date);
            if(logDate >= startDate && stats[l.name]) {
                stats[l.name].school += l.school;
                stats[l.name].self += l.self;
                if(stats[l.name].lastDate < l.date) stats[l.name].lastDate = l.date;
            }
        });

        // 出席番号順にソート
        let sortedNames = Object.keys(stats).sort((a, b) => {
            if (stats[a].class !== stats[b].class) return stats[a].class - stats[b].class;
            return stats[a].no - stats[b].no;
        });

        let tSelf = 0, tSchool = 0, active = 0;
        sortedNames.forEach(name => {
            const s = stats[name];
            if (classF !== "all" && s.class != classF) return;

            tSelf += s.self; tSchool += s.school;
            if(s.school + s.self > 0) active++;

            tbody.innerHTML += `
                <tr>
                    <td>${s.class}-${String(s.no).padStart(2,'0')}</td>
                    <td><strong>${name}</strong></td>
                    <td>${s.school + s.self}分</td>
                    <td><span class="stats-badge badge-school">${s.school}</span></td>
                    <td><span class="stats-badge badge-self">${s.self}</span></td>
                    <td>${s.lastDate}</td>
                </tr>
            `;
        });

        updateAI(tSelf, tSchool, active, periodF);
    };

    function updateAI(tself, tschool, active, period) {
        const report = document.getElementById('ai-report');
        const periodText = {all:"全期間", week:"今週", month:"今月", term:"今学期"}[period];
        const selfRate = Math.round((tself / (tself + tschool || 1)) * 100);
        
        report.innerText = `【${periodText}の分析】\n記録者は ${active}名、自学率は ${selfRate}% です。\n${selfRate > 40 ? "自主性が高い期間です。" : "もう少し家庭学習の動機づけが必要かもしれません。"}`;
        document.getElementById('ai-title').innerText = "✅ 分析完了";
    }

    // --- 各種操作 ---
    window.saveClassSizes = async () => {
        const d = { "1": Number(document.getElementById('denom-1').value), "2": Number(document.getElementById('denom-2').value), "3": Number(document.getElementById('denom-3').value) };
        await setDoc(doc(db, "settings", "class_sizes"), d); alert("保存しました");
    };

    window.addStudent = async () => {
        const c = document.getElementById('st-class').value, n = document.getElementById('st-no').value, nm = document.getElementById('st-name').value;
        if(!c || !n || !nm) return;
        await setDoc(doc(db, "students", `s_${c}_${n}`), { class:Number(c), no:Number(n), name:nm });
        location.reload();
    };

    window.bulkDelete = async (mode) => {
        const checkId = mode === 'all' ? 'check-all' : 'check-log';
        if(!document.getElementById(checkId).checked) return alert("同意チェックを入れてください");
        if(!confirm("本当に実行しますか？")) return;
        const snap = await getDocs(collection(db, "learning_logs"));
        for(const d of snap.docs) await deleteDoc(doc(db, "learning_logs", d.id));
        if(mode==='all') {
            const snap2 = await getDocs(collection(db, "students"));
            for(const d of snap2.docs) await deleteDoc(doc(db, "students", d.id));
        }
        alert("削除完了"); location.reload();
    };

    initAdmin();
</script>
</body>
</html>
