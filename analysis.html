<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みんなの分析 - 学習アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: sans-serif; background-color: #fdfaf0; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 600px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  .filter-area { background-color: #ffeaa7; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #fdcb6e; }
  .section { background: white; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
  th { background-color: #f8f9fa; color: #666; font-size: 13px; }
  .rank-1 { background-color: #fff7d1; font-weight: bold; color: #d35400; }
  
  .chart-container { position: relative; height: 300px; width: 100%; }
  button.nav-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background-color: #3498db; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
  <h1>📊 みんなの分析</h1>

  <div class="filter-area">
    <span>📅 きかん：</span>
    <select id="period-select" style="padding:8px; border-radius:5px;">
        <option value="total">これまでぜんぶ</option>
        <option value="this-week">こんしゅう</option>
        <option value="last-week">せんしゅう</option>
        <option value="this-month">こんげつ</option>
        <option value="term-1">4月〜8月（1学期）</option>
        <option value="term-2">9月〜12月（2学期）</option>
        <option value="term-3">1月〜3月（3学期）</option>
    </select>
  </div>

  <div class="section">
    <h2>🏆 学習時間ランキング</h2>
    <table id="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>名前</th>
          <th>クラス</th>
          <th>合計時間</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <div class="section">
    <h2>📈 クラスごとの割合</h2>
    <div class="chart-container"><canvas id="pieChart"></canvas></div>
  </div>

  <button class="nav-btn" onclick="history.back()">🏠 ダッシュボードにもどる</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let cachedLogs = [];

  const pieCtx = document.getElementById('pieChart').getContext('2d');
  let pieChart = new Chart(pieCtx, {
    type: 'doughnut',
    data: { labels: ['1組', '2組', '3組'], datasets: [{ data: [0,0,0], backgroundColor: ['#ff6384', '#36a2eb', '#ffce56'] }]},
    options: { responsive: true, maintainAspectRatio: false }
  });

  onSnapshot(query(collection(db, "learning_logs")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  function render() {
    const period = document.getElementById('period-select').value;
    const now = new Date();

    const isTarget = (dateStr) => {
      const d = new Date(dateStr);
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (period === 'this-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
        return d >= sun;
      }
      if (period === 'last-week') {
        const lastSun = new Date(now); lastSun.setDate(now.getDate() - now.getDay() - 7); lastSun.setHours(0,0,0,0);
        const thisSun = new Date(now); thisSun.setDate(now.getDate() - now.getDay()); thisSun.setHours(0,0,0,0);
        return d >= lastSun && d < thisSun;
      }
      const m = d.getMonth() + 1;
      if (period === 'term-1') return m >= 4 && m <= 8;
      if (period === 'term-2') return m >= 9 && m <= 12;
      if (period === 'term-3') return m >= 1 && m <= 3;
      return true;
    };

    let userAgg = {}; // 個人集計
    let classAgg = { "1": 0, "2": 0, "3": 0 }; // クラス集計

    cachedLogs.forEach(log => {
      if (!isTarget(log.date)) return;
      const total = log.school + log.self;
      // 個人
      if (!userAgg[log.name]) userAgg[log.name] = { name: log.name, class: log.class, total: 0 };
      userAgg[log.name].total += total;
      // クラス
      if (classAgg[log.class] !== undefined) classAgg[log.class] += total;
    });

    // ランキング作成（上位10名）
    const ranking = Object.values(userAgg).sort((a, b) => b.total - a.total).slice(0, 10);
    const tbody = document.querySelector('#ranking-table tbody');
    tbody.innerHTML = "";
    ranking.forEach((u, i) => {
      const row = `<tr class="${i===0?'rank-1':''}"><td>${i+1}位</td><td>${u.name}</td><td>${u.class}組</td><td>${u.total}分</td></tr>`;
      tbody.innerHTML += row;
    });

    // 円グラフ更新
    pieChart.data.datasets[0].data = [classAgg["1"], classAgg["2"], classAgg["3"]];
    pieChart.update();
  }

  document.getElementById('period-select').addEventListener('change', render);
</script>
</body>
</html>
