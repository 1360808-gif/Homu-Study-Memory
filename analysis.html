<script type="module">
  // Firebase設定などはそのまま維持（中略）

  function render() {
    const displayMode = document.querySelector('input[name="displayMode"]:checked').value;
    const viewType = document.querySelector('input[name="viewType"]:checked').value;
    const period = document.getElementById('period-select').value;
    const now = new Date();

    const isTarget = (dateStr) => {
      const d = new Date(dateStr);
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth();
      if (period === 'this-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
        return d >= sun;
      }
      if (period === 'last-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay());
        const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
        return d >= lastSun && d < sun;
      }
      return true;
    };

    // 1. 集計
    let userAgg = {};
    cachedLogs.forEach(log => {
      if (!isTarget(log.date)) return;
      if (!userAgg[log.name]) userAgg[log.name] = { name: log.name, school: 0, self: 0 };
      userAgg[log.name].school += (log.school || 0);
      userAgg[log.name].self += (log.self || 0);
    });

    // 2. ソートと順位付け
    const allUsers = Object.values(userAgg).map(u => ({
      ...u,
      total: (viewType === 'all' ? (u.school + u.self) : (viewType === 'school' ? u.school : u.self))
    })).sort((a, b) => b.total - a.total);
    
    allUsers.forEach((u, i) => u.rank = i + 1);

    // 3. 表示データの抽出（ここが今回のキモです）
    let displayData = [];
    const myIndex = allUsers.findIndex(u => u.name === myName);
    const myData = allUsers[myIndex];

    if (displayMode === 'top20') {
      document.getElementById('chart-title').innerText = "🏆 TOP20とあなたの比較";
      
      if (myIndex !== -1) {
        // 自分のデータを一番左に。残りのTOP20（自分以外）を繋げる
        const others = allUsers.filter(u => u.name !== myName).slice(0, 19);
        displayData = [myData, ...others];
      } else {
        // 自分がデータにない場合は通常のTOP20
        displayData = allUsers.slice(0, 20);
      }
    } else {
      document.getElementById('chart-title').innerText = "🤝 自分のまわり（前後3名）";
      if (myIndex !== -1) {
        // 自分の前後3人を抽出（自分が中央）
        const start = Math.max(0, myIndex - 3);
        const end = Math.min(allUsers.length, myIndex + 4);
        displayData = allUsers.slice(start, end);
      } else {
        displayData = allUsers.slice(0, 7);
      }
    }

    // 4. 名前表示とグラフ更新
    analysisChart.data.labels = displayData.map(u => {
      const isMe = (u.name === myName);
      if (isMe) return `⭐️${u.name}(${u.rank}位)`;
      
      // 名前表示の制限（上位20人、または自分の前後は表示）
      const isTop = (u.rank <= 20);
      const isNearMe = (myIndex !== -1 && Math.abs(u.rank - (myIndex + 1)) <= 3);
      
      return (isTop || isNearMe) ? `${u.rank}位:${u.name}` : `${u.rank}位:(匿名)`;
    });

    analysisChart.data.datasets[0].data = displayData.map(u => u.school);
    analysisChart.data.datasets[1].data = displayData.map(u => u.self);
    
    // 色：自分は強調色、他はブルー系
    analysisChart.data.datasets[0].backgroundColor = displayData.map(u => u.name === myName ? '#e67e22' : '#2980b9');
    analysisChart.data.datasets[1].backgroundColor = displayData.map(u => u.name === myName ? '#f39c12' : '#3498db');
    
    analysisChart.update();
  }
  // 以下イベントリスナー等は変更なし
</script>
