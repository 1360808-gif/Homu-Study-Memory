<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 600px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  
  /* 二つ名バッジ */
  .title-badge { background: #6c5ce7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 5px; }

  /* AIアドバイスのデザイン */
  .ai-message-area { 
    background: linear-gradient(135deg, #e0f7fa, #ffffff); 
    border: 2px solid #4fc3f7; 
    border-radius: 15px; 
    padding: 15px; 
    margin: 10px 0 20px 0; 
    display: flex; 
    align-items: center; 
    gap: 15px;
    text-align: left;
  }
  .ai-icon { font-size: 40px; }
  .ai-content { flex: 1; }
  .ai-text { font-size: 14px; font-weight: bold; color: #0277bd; line-height: 1.4; }
  .comparison-stats { font-size: 11px; color: #546e7a; margin-top: 5px; background: rgba(255,255,255,0.5); padding: 5px; border-radius: 5px; }

  .top-action { margin: 15px 0 25px 0; }
  .btn-record { width: 100%; padding: 20px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #f39c12, #e67e22); border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3); transition: transform 0.2s; }
  .section { background-color: #fdfdfd; border: 1px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  .filter-area { background-color: #ffeaa7; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 2px solid #fdcb6e; }
  .filter-row { display: flex; justify-content: space-around; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .progress-bg { background-color: #ecf0f1; border-radius: 10px; height: 30px; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, #f1c40f, #f39c12); height: 100%; width: 0%; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; transition: width 0.5s ease; }
  .chart-container { position: relative; height: 250px; width: 100%; }
  button.nav-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background-color: #3498db; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px;}
</style>
</head>
<body>

<div class="app-container">
  <div style="margin-top:20px;">
    <span id="user-title" class="title-badge">かけだしの学習者</span><br>
    <h1>🏠 <span id="user-name-display"></span> のダッシュボード</h1>
  </div>

  <div class="ai-message-area">
    <div class="ai-icon" id="ai-icon">🤖</div>
    <div class="ai-content">
        <div class="ai-text" id="ai-comment">読み込み中...</div>
        <div class="comparison-stats" id="ai-stats"></div>
    </div>
  </div>

  <div class="top-action">
    <button class="btn-record" onclick="goToInput()">✏️ 学習時間をきろくする</button>
  </div>

  <div class="filter-area">
    <div class="filter-row">
      <label><input type="radio" name="viewType" value="all" checked> ぜんぶ</label>
      <label><input type="radio" name="viewType" value="school"> がっこう</label>
      <label><input type="radio" name="viewType" value="self"> じぶん</label>
    </div>
    <div class="filter-row">
      <span>📅 きかん：</span>
      <select id="period-select">
        <option value="total">これまでぜんぶ</option>
        <option value="this-week">こんしゅう</option>
        <option value="last-week">せんしゅう</option>
        <option value="this-month">こんげつ</option>
        <option value="term-1">4月〜8月</option>
        <option value="term-2">9月〜12月</option>
        <option value="term-3">1月〜3月</option>
      </select>
    </div>
  </div>

  <div class="section">
    <h2 id="goal-title">🤝 みんなで目標達成！</h2>
    <p id="goal-text">読み込み中...</p>
    <div class="progress-bg"><div class="progress-bar" id="progress-bar">0%</div></div>
  </div>

  <div class="section">
    <h2>👤 あなたの履歴</h2>
    <div class="chart-container"><canvas id="personalChart"></canvas></div>
  </div>

  <button class="nav-btn" onclick="goToInput()">✏️ 学習時間を入力する</button>
  <button class="nav-btn" style="background:#95a5a6" onclick="location.href='index.html'">🚪 ログアウト</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト", myClass = params.get('class') || "1";
  document.getElementById('user-name-display').innerText = myName;

  let cachedLogs = [];
  const personalCtx = document.getElementById('personalChart').getContext('2d');
  let personalChart = new Chart(personalCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'がっこう', data:[], borderColor:'#2980b9', fill:false}, {label:'じぶん', data:[], borderColor:'#c0392b', fill:false}]},
    options: { responsive: true, maintainAspectRatio: false }
  });

  onSnapshot(query(collection(db, "learning_logs"), orderBy("date", "asc")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    updateAnalysis();
    render();
  });

  function updateAnalysis() {
    const now = new Date();
    const myLogs = cachedLogs.filter(l => l.name === myName);
    
    // --- 1. 二つ名判定 ---
    let title = "かけだしの学習者";
    let schoolTotal = 0, selfTotal = 0;
    myLogs.forEach(l => { schoolTotal += l.school; selfTotal += l.self; });
    
    if(myLogs.length >= 10) title = "きろくの達人";
    if(selfTotal > schoolTotal * 1.5) title = "じしゅうの鬼";
    if(schoolTotal > selfTotal * 1.5) title = "学校LOVE";
    if(myLogs.length > 3 && myLogs.slice(-3).every(l => (l.school+l.self) > 120)) title = "努力の天才";
    
    document.getElementById('user-title').innerText = title;

    // --- 2. 比較ロジック（週と月） ---
    // 今週・先週
    const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
    const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
    // 今月・先月
    const thisMonth = now.getMonth();
    const lastMonth = (thisMonth === 0) ? 11 : thisMonth - 1;

    let stats = { tw:0, lw:0, tm:0, lm:0 };
    myLogs.forEach(log => {
      const d = new Date(log.date);
      if (d >= sun) stats.tw += (log.school + log.self);
      else if (d >= lastSun && d < sun) stats.lw += (log.school + log.self);
      
      if (d.getMonth() === thisMonth && d.getFullYear() === now.getFullYear()) stats.tm += (log.school + log.self);
      else if (d.getMonth() === lastMonth) stats.lm += (log.school + log.self);
    });

    const aiText = document.getElementById('ai-comment');
    const aiStats = document.getElementById('ai-stats');
    const aiIcon = document.getElementById('ai-icon');

    // メッセージ生成
    if (stats.tw > stats.lw && stats.lw > 0) {
        aiText.innerText = "すごい！先週よりもペースが上がっているよ！";
        aiIcon.innerText = "🔥";
    } else if (stats.tm < stats.lm && stats.tm > 0) {
        aiText.innerText = "先月より少しのんびりペースかな？ここから取り戻そう！";
        aiIcon.innerText = "🐢";
    } else {
        aiText.innerText = "きみのがんばりをしっかり見守っているよ！";
        aiIcon.innerText = "🤖";
    }

    aiStats.innerHTML = `今週: ${stats.tw}分 (先週: ${stats.lw}分)<br>今月: ${stats.tm}分 (先月: ${stats.lm}分)`;
  }

  function render() {
    const filter = document.querySelector('input[name="viewType"]:checked').value;
    const period = document.getElementById('period-select').value;
    const now = new Date();
    
    const isTargetPeriod = (dateStr) => {
      const d = new Date(dateStr);
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth();
      if (period === 'this-week') {
        const sunday = new Date(now); sunday.setDate(now.getDate() - now.getDay()); sunday.setHours(0,0,0,0);
        return d >= sunday;
      }
      return true;
    };

    let myData = { labels: [], s: [], f: [] };
    let grandTotal = 0;

    cachedLogs.forEach(log => {
      if (!isTargetPeriod(log.date)) return;
      if (log.name === myName) { myData.labels.push(log.date); myData.s.push(log.school); myData.f.push(log.self); }
      grandTotal += (log.school + log.self);
    });

    document.getElementById('goal-text').innerText = `期間中の合計: ${grandTotal}分`;
    personalChart.data.labels = myData.labels;
    personalChart.data.datasets[0].data = myData.s;
    personalChart.data.datasets[1].data = myData.f;
    personalChart.update();
  }

  document.getElementById('period-select').addEventListener('change', render);
  document.querySelectorAll('input').forEach(el => el.addEventListener('change', render));
  window.goToInput = () => location.href = `input.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
</script>
</body>
</html>
