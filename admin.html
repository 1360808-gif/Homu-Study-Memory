<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>学級管理センター - 管理者専用</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f4f8; color: #333; line-height: 1.6; }
  .admin-container { max-width: 800px; margin: auto; }
  .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  h2 { color: #2c3e50; border-left: 5px solid #27ae60; padding-left: 10px; margin-top: 0; }
  h3 { font-size: 16px; color: #7f8c8d; }
  
  /* 設定セクション */
  .config-row { display: flex; gap: 20px; align-items: center; margin-bottom: 10px; }
  .config-row input { width: 50px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  
  /* 入力エリア */
  textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin: 10px 0; }
  
  /* ボタン類 */
  button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .btn-save { background: #27ae60; color: white; width: 100%; }
  .btn-config { background: #3498db; color: white; }
  .btn-danger { background: #e74c3c; color: white; }
  button:hover { opacity: 0.8; }
  button:disabled { background: #ccc; }

  /* リスト */
  .scroll-list { max-height: 250px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 8px; }
  .student-item { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid #eee; padding: 8px 0; }
  
  .warning-box { border: 2px solid #e74c3c; padding: 15px; border-radius: 8px; background: #fff5f5; }
</style>
</head>
<body>

<div class="admin-container">
  <h1>⚙️ 学級管理センター</h1>

  <div class="card">
    <h2>👥 クラス人数設定 (平均計算用)</h2>
    <p class="help" style="font-size: 12px; color: #666;">ダッシュボードの平均表示に反映されます。</p>
    <div id="class-configs">
      <div class="config-row">
        <span>1組: <input type="number" id="count-1" value="30"> 人</span>
        <span>2組: <input type="number" id="count-2" value="30"> 人</span>
        <span>3組: <input type="number" id="count-3" value="30"> 人</span>
        <button class="btn-config" id="save-config-btn">設定を保存</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>👨‍🏫 児童の一括登録</h2>
    <div class="config-row">
      <label>対象クラス：<input type="number" id="reg-class" value="1"></label> 組
    </div>
    <textarea id="bulk-input" placeholder="出席番号 [スペース] 名前 (ExcelからコピペOK)"></textarea>
    <button class="btn-save" id="add-btn">名簿をFirestoreに保存する</button>
  </div>

  <div class="card">
    <h2>📋 登録児童一覧</h2>
    <div class="scroll-list" id="list-items">読み込み中...</div>
  </div>

  <div class="card warning-box">
    <h2 style="border-color: #e74c3c; color: #e74c3c;">⚠️ 危険な操作</h2>
    <p style="font-size: 13px;">これまでの<strong>すべての学習記録（ログ）</strong>を削除します。年度末のリセットなどに使用してください。</p>
    <button class="btn-danger" id="delete-logs-btn">学習記録をすべて削除する</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc, writeBatch, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- 1. クラス設定の読み込みと保存 ---
  async function loadConfigs() {
    const snap = await getDocs(collection(db, "settings"));
    snap.forEach(d => {
      const data = d.data();
      if(d.id === "class_counts") {
        document.getElementById('count-1').value = data["1"] || 30;
        document.getElementById('count-2').value = data["2"] || 30;
        document.getElementById('count-3').value = data["3"] || 30;
      }
    });
  }

  document.getElementById('save-config-btn').addEventListener('click', async () => {
    try {
      await setDoc(doc(db, "settings", "class_counts"), {
        "1": Number(document.getElementById('count-1').value),
        "2": Number(document.getElementById('count-2').value),
        "3": Number(document.getElementById('count-3').value)
      });
      alert("人数設定を保存しました。ダッシュボードに反映されます。");
    } catch (e) { alert("保存失敗: " + e); }
  });

  // --- 2. 児童の一括登録 ---
  document.getElementById('add-btn').addEventListener('click', async () => {
    const cls = document.getElementById('reg-class').value;
    const rawData = document.getElementById('bulk-input').value.trim();
    if(!rawData) return;

    const lines = rawData.split(/\n/);
    const batch = writeBatch(db);
    lines.forEach(line => {
      const parts = line.split(/[\s\t]+/);
      if (parts.length >= 2) {
        const no = parseInt(parts[0]);
        const name = parts.slice(1).join(" ");
        const newRef = doc(collection(db, "students"));
        batch.set(newRef, { class: cls, no: isNaN(no)?99:no, name: name });
      }
    });
    await batch.commit();
    alert("登録しました");
    loadStudents();
  });

  // --- 3. 閲覧・分析（リスト表示） ---
  async function loadStudents() {
    const list = document.getElementById('list-items');
    const q = query(collection(db, "students"), orderBy("class"), orderBy("no"));
    const snap = await getDocs(q);
    list.innerHTML = "";
    snap.forEach(d => {
      const s = d.data();
      list.innerHTML += `<div class="student-item"><span>${s.class}組 ${s.no}番</span> <span>${s.name}</span></div>`;
    });
  }

  // --- 4. データの全リセット ---
  document.getElementById('delete-logs-btn').addEventListener('click', async () => {
    if(!confirm("本当にすべての【学習記録】を消去しますか？（児童名簿は消えません）")) return;
    
    const btn = document.getElementById('delete-logs-btn');
    btn.disabled = true;
    btn.innerText = "削除中...";

    try {
      const snap = await getDocs(collection(db, "learning_logs"));
      const batch = writeBatch(db);
      snap.forEach(d => batch.delete(d.ref));
      await batch.commit();
      alert("すべての学習記録を削除しました。");
    } catch (e) { alert("エラー: " + e); }
    btn.disabled = false;
    btn.innerText = "学習記録をすべて削除する";
  });

  loadConfigs();
  loadStudents();
</script>
</body>
</html>
