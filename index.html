<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 600px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 15px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  
  .section {
    background-color: #fdfdfd;
    border: 1px solid #ecf0f1;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 25px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }

  /* 🌟 全体フィルターのデザイン */
  .global-filter {
    display: flex;
    justify-content: space-around;
    background-color: #ffeaa7; /* 目立つように少し色を変えています */
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 25px;
    border: 2px solid #fdcb6e;
  }
  .global-filter label {
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* 学年全体ゲージのデザイン */
  .goal-text { font-size: 16px; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
  .progress-bg { background-color: #ecf0f1; border-radius: 10px; height: 30px; width: 100%; position: relative; overflow: hidden; }
  .progress-bar {
    background: linear-gradient(90deg, #f1c40f, #f39c12);
    height: 100%; width: 0%; /* JSで動かします */
    display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; border-radius: 10px 0 0 10px; transition: width 0.5s ease;
  }
  
  .chart-container { position: relative; height: 250px; width: 100%; }

  /* 先生用設定 */
  .teacher-section { background-color: #eee; border: 2px dashed #bdc3c7; border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: left; }
  .teacher-section h3 { margin: 0 0 10px 0; font-size: 14px; color: #7f8c8d; }
  .class-setting { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 14px; }
  .class-setting input { width: 50px; padding: 2px; text-align: center; }

  button.main-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff; background-color: #95a5a6; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
  <h1>🌟 〇年生 がんばりダッシュボード</h1>

  <div class="global-filter">
    <label><input type="radio" name="viewType" value="all" checked onchange="updateDashboard()"> ぜんぶ</label>
    <label><input type="radio" name="viewType" value="school" onchange="updateDashboard()"> がっこう</label>
    <label><input type="radio" name="viewType" value="self" onchange="updateDashboard()"> じぶん</label>
  </div>

  <div class="teacher-section">
    <h3>👨‍🏫 先生用：分母調整（平均グラフ用）</h3>
    <div class="class-setting">1組: 除外 <input type="number" id="exclude-1" min="0" value="0" onchange="updateDashboard()"> 名</div>
    <div class="class-setting">2組: 除外 <input type="number" id="exclude-2" min="0" value="0" onchange="updateDashboard()"> 名</div>
    <div class="class-setting">3組: 除外 <input type="number" id="exclude-3" min="0" value="0" onchange="updateDashboard()"> 名</div>
  </div>

  <div class="section">
    <h2 id="goal-title">🤝 みんなで達成しよう！（ぜんぶ）</h2>
    <p class="goal-text" id="goal-text">計算中...</p>
    <div class="progress-bg">
      <div class="progress-bar" id="progress-bar">0%</div>
    </div>
  </div>

  <div class="section">
    <h2>🔥 クラス対抗！ 1人あたりの平均時間</h2>
    <div class="chart-container">
      <canvas id="classChart"></canvas>
    </div>
  </div>

  <div class="section">
    <h2>👤 あなたのがんばり（青木 太郎 さん）</h2>
    <div class="chart-container">
      <canvas id="personalChart"></canvas>
    </div>
  </div>

  <button class="main-btn" onclick="alert('入力画面にもどります')">最初の画面にもどる</button>

</div>

<script>
  // ＝ データの準備 ＝
  // クラスごとの「がっこう」と「じぶん」の合計時間を分けて持ちます
  const classData = {
    "1組": { schoolTime: 4200, selfTime: 2100, baseStudents: 30 },
    "2組": { schoolTime: 4900, selfTime: 2450, baseStudents: 30 },
    "3組": { schoolTime: 3800, selfTime: 1900, baseStudents: 30 }
  };

  // 学年全体の目標設定
  const goalSettings = {
    all: { title: "（ぜんぶ）", target: 30000, color: "linear-gradient(90deg, #f1c40f, #f39c12)" },
    school: { title: "（がっこうの勉強）", target: 18000, color: "linear-gradient(90deg, #3498db, #2980b9)" },
    self: { title: "（じぶんの学習）", target: 12000, color: "linear-gradient(90deg, #e74c3c, #c0392b)" }
  };

  // ＝ グラフの初期設定 ＝

  // ② クラス対抗グラフ（積み上げ式に変更）
  const classCtx = document.getElementById('classChart').getContext('2d');
  let classChart = new Chart(classCtx, {
    type: 'bar',
    data: {
      labels: ['1組', '2組', '3組'],
      datasets: [
        { label: 'がっこう', data: [0,0,0], backgroundColor: '#2980b9' }, // Index 0
        { label: 'じぶん', data: [0,0,0], backgroundColor: '#c0392b' }  // Index 1
      ]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true, title: { display: true, text: '平均時間（分）' } }, y: { stacked: true } }
    }
  });

  // ③ 個人の記録グラフ
  const personalCtx = document.getElementById('personalChart').getContext('2d');
  let personalChart = new Chart(personalCtx, {
    type: 'bar',
    data: {
      labels: ['1週目', '2週目', '3週目', '今週'],
      datasets: [
        { label: 'がっこう', data: [120, 150, 130, 90], backgroundColor: '#2980b9' }, // Index 0
        { label: 'じぶん', data: [60, 40, 80, 120], backgroundColor: '#c0392b' }  // Index 1
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: '時間（分）' } } }
    }
  });

  // ＝ ✨ すべてを連動して更新するメイン関数 ＝
  function updateDashboard() {
    // 1. 選択されているフィルターを取得
    const filter = document.querySelector('input[name="viewType"]:checked').value;
    
    // 2. 先生の設定（除外人数）を取得し、計算用人数を出す
    const ex1 = parseInt(document.getElementById('exclude-1').value) || 0;
    const ex2 = parseInt(document.getElementById('exclude-2').value) || 0;
    const ex3 = parseInt(document.getElementById('exclude-3').value) || 0;
    const active1 = Math.max(1, classData["1組"].baseStudents - ex1);
    const active2 = Math.max(1, classData["2組"].baseStudents - ex2);
    const active3 = Math.max(1, classData["3組"].baseStudents - ex3);

    // --- ① 学年全体の更新 ---
    let currentTotal = 0;
    if (filter === 'all' || filter === 'school') {
      currentTotal += classData["1組"].schoolTime + classData["2組"].schoolTime + classData["3組"].schoolTime;
    }
    if (filter === 'all' || filter === 'self') {
      currentTotal += classData["1組"].selfTime + classData["2組"].selfTime + classData["3組"].selfTime;
    }
    
    const goal = goalSettings[filter];
    const percentage = Math.min(100, Math.round((currentTotal / goal.target) * 100));
    const remaining = Math.max(0, goal.target - currentTotal);

    document.getElementById('goal-title').innerText = `🤝 みんなで達成しよう！${goal.title}`;
    document.getElementById('goal-text').innerText = `目標 ${goal.target.toLocaleString()}分 まで、あと ${remaining.toLocaleString()}分！`;
    
    const bar = document.getElementById('progress-bar');
    bar.style.width = percentage + '%';
    bar.style.background = goal.color;
    bar.innerText = `${currentTotal.toLocaleString()}分 (${percentage}%)`;

    // --- ② クラス対抗グラフの更新 ---
    // データの再計算
    classChart.data.datasets[0].data = [
      Math.round(classData["1組"].schoolTime / active1),
      Math.round(classData["2組"].schoolTime / active2),
      Math.round(classData["3組"].schoolTime / active3)
    ];
    classChart.data.datasets[1].data = [
      Math.round(classData["1組"].selfTime / active1),
      Math.round(classData["2組"].selfTime / active2),
      Math.round(classData["3組"].selfTime / active3)
    ];

    // 表示・非表示の切り替え
    classChart.setDatasetVisibility(0, filter === 'all' || filter === 'school');
    classChart.setDatasetVisibility(1, filter === 'all' || filter === 'self');
    classChart.update();

    // --- ③ 個人の記録グラフの更新 ---
    personalChart.setDatasetVisibility(0, filter === 'all' || filter === 'school');
    personalChart.setDatasetVisibility(1, filter === 'all' || filter === 'self');
    personalChart.update();
  }

  // 画面を開いたときに一度実行する
  updateDashboard();
</script>

</body>
</html>
