<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比較・分析ページ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 800px; /* グラフが見やすいように少し広めに設定 */
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 15px; }
  
  .controls {
    background-color: #e8f4f8;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .controls select {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #bdc3c7;
    background-color: #fff;
    cursor: pointer;
  }
  
  .note {
    font-size: 12px;
    color: #7f8c8d;
    margin-bottom: 15px;
    text-align: left;
  }

  .chart-container {
    position: relative;
    height: 400px; /* 棒グラフをたくさん並べるため高めに設定 */
    width: 100%;
    margin-bottom: 20px;
  }

  button.main-btn {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff;
    background-color: #95a5a6; border: none; border-radius: 10px; cursor: pointer;
    transition: background-color 0.2s;
  }
  button.main-btn:active { background-color: #7f8c8d; }
</style>
</head>
<body>

<div class="app-container">
  <h1>🔍 じぶんとみんなの「がんばり分析」</h1>

  <div class="controls">
    <label style="font-weight: bold; color: #2980b9;">どんな順番でくらべる？</label>
    <select id="sort-mode" onchange="updateChart()">
      <option value="total-desc">🏆 全体：長い順（トップ層をみる）</option>
      <option value="total-asc">🌱 全体：短い順</option>
      <option value="week-desc">🔥 今週：長い順（今週のがんばり屋）</option>
      <option value="month-desc">📅 今月：長い順</option>
      <option value="close-to-me" selected>🤝 自分と近い人（前後約10人）</option>
    </select>
  </div>

  <p class="note">※ プライバシーのため、他の人はイニシャルで表示されています。一番左の赤いグラフが「あなた」です。</p>

  <div class="chart-container">
    <canvas id="analysisChart"></canvas>
  </div>

  <button class="main-btn" onclick="alert('ダッシュボードにもどります')">ダッシュボードにもどる</button>

</div>

<script>
  // ＝ 疑似データ（15人分） ＝
  // 実際のシステムではデータベースから取得します
  const myId = "user_me";
  const allData = [
    { id: "user_me", name: "自分 (青木)", total: 12500, month: 3200, week: 800 },
    { id: "u1", name: "A.S さん", total: 15000, month: 4000, week: 1000 },
    { id: "u2", name: "B.K さん", total: 14200, month: 3800, week: 950 },
    { id: "u3", name: "C.Y さん", total: 13800, month: 3600, week: 900 },
    { id: "u4", name: "D.M さん", total: 13100, month: 3500, week: 850 },
    { id: "u5", name: "E.T さん", total: 12800, month: 3300, week: 820 },
    { id: "u6", name: "F.N さん", total: 12400, month: 3100, week: 780 },
    { id: "u7", name: "G.R さん", total: 12100, month: 3000, week: 750 },
    { id: "u8", name: "H.W さん", total: 11800, month: 2900, week: 700 },
    { id: "u9", name: "I.O さん", total: 11200, month: 2800, week: 680 },
    { id: "u10", name: "J.H さん", total: 10500, month: 2500, week: 600 },
    { id: "u11", name: "K.I さん", total: 9800, month: 2200, week: 550 },
    { id: "u12", name: "L.A さん", total: 8500, month: 2000, week: 500 },
    { id: "u13", name: "M.S さん", total: 7200, month: 1800, week: 450 },
    { id: "u14", name: "N.E さん", total: 6000, month: 1500, week: 400 }
  ];

  // グラフの設定用変数
  let analysisChart;
  const ctx = document.getElementById('analysisChart').getContext('2d');

  function initChart() {
    analysisChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: [], // 名前が入ります
        datasets: [{
          label: '学習時間（分）',
          data: [], // 時間が入ります
          backgroundColor: [], // 色（自分だけ変えます）
          borderRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) { return context.raw + ' 分'; }
            }
          }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: '時間（分）' } }
        }
      }
    });
  }

  // データの並び替えとグラフの更新処理
  function updateChart() {
    const mode = document.getElementById('sort-mode').value;
    
    // 自分のデータを取得
    const me = allData.find(d => d.id === myId);
    let others = allData.filter(d => d.id !== myId);
    let displayData = [];
    let dataKey = 'total'; // グラフに表示する数値の種類

    // 並び替えのロジック
    if (mode === 'total-desc') {
      dataKey = 'total';
      others.sort((a, b) => b.total - a.total);
      displayData = others;
    } 
    else if (mode === 'total-asc') {
      dataKey = 'total';
      others.sort((a, b) => a.total - b.total);
      displayData = others;
    } 
    else if (mode === 'week-desc') {
      dataKey = 'week';
      others.sort((a, b) => b.week - a.week);
      displayData = others;
    } 
    else if (mode === 'month-desc') {
      dataKey = 'month';
      others.sort((a, b) => b.month - a.month);
      displayData = others;
    } 
    else if (mode === 'close-to-me') {
      dataKey = 'total';
      // 一旦全員をトータルで降順に並べる
      const sortedAll = [...allData].sort((a, b) => b.total - a.total);
      const myIndex = sortedAll.findIndex(d => d.id === myId);
      
      // 自分の前後5人（合計最大10人）を切り出す
      const start = Math.max(0, myIndex - 5);
      const end = Math.min(sortedAll.length, myIndex + 6);
      
      // 切り出したリストから自分を抜き取る（後で先頭にくっつけるため）
      displayData = sortedAll.slice(start, end).filter(d => d.id !== myId);
    }

    // ★重要★ 必ず「自分」を配列の1番最初（index 0）に固定する
    const finalArray = [me, ...displayData];

    // Chart.js用の配列を作成
    const labels = finalArray.map(d => d.name);
    const dataValues = finalArray.map(d => d[dataKey]);
    
    // 自分の棒グラフは赤系、他の人は青系で視覚的に区別する
    const colors = finalArray.map(d => d.id === myId ? '#e74c3c' : '#3498db');

    // グラフにデータをセットして更新
    analysisChart.data.labels = labels;
    analysisChart.data.datasets[0].data = dataValues;
    analysisChart.data.datasets[0].backgroundColor = colors;
    
    // 縦軸のタイトルも切り替える
    let axisLabel = '総合時間（分）';
    if(dataKey === 'week') axisLabel = '今週の時間（分）';
    if(dataKey === 'month') axisLabel = '今月の時間（分）';
    analysisChart.options.scales.y.title.text = axisLabel;

    analysisChart.update();
  }

  // 画面を開いた時の初期化
  initChart();
  updateChart();

</script>
</body>
</html>
