<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 600px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  
  .section {
    background-color: #fdfdfd;
    border: 1px solid #ecf0f1;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 25px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }

  /* ＝ 学年全体ゲージのデザイン ＝ */
  .goal-text { font-size: 16px; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
  .progress-bg {
    background-color: #ecf0f1;
    border-radius: 10px;
    height: 30px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, #f1c40f, #f39c12);
    height: 100%;
    width: 65%; /* ここでゲージの長さを変えます（例: 65%） */
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    color: white;
    font-weight: bold;
    border-radius: 10px 0 0 10px;
    transition: width 1s ease-in-out;
  }
  
  .chart-container {
    position: relative;
    height: 250px;
    width: 100%;
  }

  button {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff;
    background-color: #95a5a6; border: none; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🌟 〇年生 がんばりダッシュボード</h1>

  <div class="section">
    <h2>🤝 みんなで達成しよう！（学年合計）</h2>
    <p class="goal-text">目標 10,000時間 まで、あと 3,500時間！</p>
    <div class="progress-bg">
      <div class="progress-bar">6,500時間 (65%)</div>
    </div>
    <p style="font-size: 12px; color: #7f8c8d; margin-top: 10px;">みんなの記録が合わさって、どんどん伸びていくよ！</p>
  </div>

  <div class="section">
    <h2>🔥 クラス対抗！ 今週の【1人あたり】平均時間</h2>
    <div class="chart-container">
      <canvas id="classChart"></canvas>
    </div>
    <p style="font-size: 12px; color: #7f8c8d; text-align: left; margin-top: 10px;">
      ※人数が違っても公平になるように、「1人あたりの平均」で比べています。
    </p>
  </div>

  <div class="section">
    <h2>👤 あなたのがんばり（青木 太郎 さん）</h2>
    <div class="chart-container">
      <canvas id="personalChart"></canvas>
    </div>
  </div>

  <button onclick="alert('入力画面にもどります（プロトタイプ）')">最初の画面にもどる</button>

</div>

<script>
  // ＝ ② クラス対抗グラフ（横向き棒グラフ）の設定 ＝
  const classCtx = document.getElementById('classChart').getContext('2d');
  new Chart(classCtx, {
    type: 'bar',
    data: {
      labels: ['1組', '2組', '3組'],
      datasets: [{
        label: '1人あたりの平均時間（分）',
        data: [210, 245, 190], // ダミーデータ
        backgroundColor: [
          'rgba(52, 152, 219, 0.7)', // 1組: 青
          'rgba(231, 76, 60, 0.7)',  // 2組: 赤
          'rgba(46, 204, 113, 0.7)'  // 3組: 緑
        ],
        borderColor: [
          'rgba(52, 152, 219, 1)',
          'rgba(231, 76, 60, 1)',
          'rgba(46, 204, 113, 1)'
        ],
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y', // 横向きにする設定
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { beginAtZero: true, title: { display: true, text: '平均時間（分）' } }
      },
      plugins: {
        legend: { display: false } // ラベルを隠す
      }
    }
  });

  // ＝ ③ 個人の記録グラフ（積み上げ棒グラフ）の設定 ＝
  const personalCtx = document.getElementById('personalChart').getContext('2d');
  new Chart(personalCtx, {
    type: 'bar',
    data: {
      labels: ['1週目', '2週目', '3週目', '今週'],
      datasets: [
        {
          label: 'がっこうの勉強',
          data: [120, 150, 130, 90], // ダミーデータ
          backgroundColor: '#2980b9' // 薄い青
        },
        {
          label: 'じぶんの学習',
          data: [60, 40, 80, 120], // ダミーデータ
          backgroundColor: '#c0392b' // 薄い赤
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true }, // 横軸を積み上げにする
        y: { 
          stacked: true,      // 縦軸を積み上げにする
          beginAtZero: true,
          title: { display: true, text: '時間（分）' }
        }
      }
    }
  });
</script>

</body>
</html>
