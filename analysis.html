<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>がんばり分析 - 学習アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 850px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  .filter-area { background-color: #ffeaa7; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #fdcb6e; }
  .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; background: #fff; padding: 10px; border-radius: 10px; flex-wrap: wrap; }
  .mode-selector label { font-weight: bold; cursor: pointer; color: #2c3e50; font-size: 14px; display: flex; align-items: center; gap: 5px; }
  .section { background: white; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  h2 { font-size: 18px; color: #2c3e50; border-left: 5px solid #3498db; padding-left: 10px; text-align: left; margin-bottom: 15px; }
  .chart-wrapper { width: 100%; overflow-x: auto; margin-bottom: 10px; border-radius: 8px; background: #fdfdfd; }
  .chart-container { position: relative; height: 420px; min-width: 750px; padding: 10px; }
  .note { font-size: 12px; color: #666; background: #e8f4f8; padding: 10px; border-radius: 8px; text-align: left; margin-top: 10px; line-height: 1.5; min-height: 1.5em; }
  button.nav-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background-color: #3498db; border: none; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
  <h1>📊 じぶんとみんなのがんばり分析</h1>

  <div class="filter-area">
    <div class="mode-selector">
        <label><input type="radio" name="displayMode" value="top20" checked> 🏆 TOP20と自分をくらべる</label>
        <label><input type="radio" name="displayMode" value="nearMe"> 🤝 自分のまわりとくらべる</label>
    </div>

    <div style="margin-bottom: 15px; font-size: 14px; background: #fff; padding: 8px; border-radius: 8px; display: inline-block;">
        どの時間でならべる？：
        <label><input type="radio" name="viewType" value="all" checked> ぜんぶ</label>
        <label><input type="radio" name="viewType" value="school"> がっこう</label>
        <label><input type="radio" name="viewType" value="self"> じぶん</label>
    </div>
    
    <div>
        <span style="font-size: 14px;">📅 きかん：</span>
        <select id="period-select" style="padding:5px; border-radius:5px; font-size: 14px;">
            <option value="total">これまでぜんぶ</option>
            <option value="this-week">こんしゅう</option>
            <option value="last-week">せんしゅう</option>
            <option value="this-month">こんげつ</option>
            <option value="term-1">🎒 1学期（4月〜8月）</option>
            <option value="term-2">🎄 2学期（9月〜12月）</option>
            <option value="term-3">🌸 3学期（1月〜3月）</option>
        </select>
    </div>
  </div>

  <div class="section">
    <h2 id="chart-title">グラフ読み込み中...</h2>
    <div class="chart-wrapper">
      <div class="chart-container">
        <canvas id="analysisChart"></canvas>
      </div>
    </div>
    <div class="note" id="note-text">
        読み込み中...
    </div>
  </div>

  <button class="nav-btn" onclick="history.back()">🏠 ダッシュボードにもどる</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト";

  let cachedLogs = [];
  const ctx = document.getElementById('analysisChart').getContext('2d');
  
  let analysisChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: [], datasets: [
      { label: '学校', data: [], backgroundColor: [], borderRadius: 4 },
      { label: 'じぶん', data: [], backgroundColor: [], borderRadius: 4 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { 
        x: { stacked: true, ticks: { font: { size: 10, weight: 'bold' }, lineHeight: 1.4 } }, 
        y: { stacked: true, beginAtZero: true } 
      },
      plugins: { 
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y}分` } }
      }
    }
  });

  onSnapshot(query(collection(db, "learning_logs")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  function render() {
    const displayMode = document.querySelector('input[name="displayMode"]:checked').value;
    const viewType = document.querySelector('input[name="viewType"]:checked').value;
    const period = document.getElementById('period-select').value;
    const noteEl = document.getElementById('note-text');
    const now = new Date();

    const isTarget = (dateStr) => {
      const d = new Date(dateStr);
      const m = d.getMonth() + 1;
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (period === 'this-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
        return d >= sun;
      }
      if (period === 'last-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay());
        const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
        return d >= lastSun && d < sun;
      }
      if (period === 'term-1') return m >= 4 && m <= 8;
      if (period === 'term-2') return m >= 9 && m <= 12;
      if (period === 'term-3') return m >= 1 && m <= 3;
      return true;
    };

    let userAgg = {};
    cachedLogs.forEach(log => {
      if (!isTarget(log.date)) return;
      if (!userAgg[log.name]) userAgg[log.name] = { name: log.name, school: 0, self: 0 };
      userAgg[log.name].school += (log.school || 0);
      userAgg[log.name].self += (log.self || 0);
    });

    const allUsers = Object.values(userAgg).map(u => {
      let sortVal = 0;
      if (viewType === 'all') sortVal = u.school + u.self;
      else if (viewType === 'school') sortVal = u.school;
      else if (viewType === 'self') sortVal = u.self;
      return { ...u, currentTotal: sortVal };
    }).sort((a, b) => b.currentTotal - a.currentTotal);
    
    allUsers.forEach((u, i) => u.rank = i + 1);

    let displayData = [];
    const myIndex = allUsers.findIndex(u => u.name === myName);
    const myData = allUsers[myIndex];

    if (displayMode === 'top20') {
      document.getElementById('chart-title').innerText = "🏆 TOP20とあなたの比較";
      noteEl.innerHTML = "💡 <strong>⭐️があなたです。</strong> 学年のTOP20と自分の位置をくらべてみよう！";
      
      if (myIndex !== -1) {
        const others = allUsers.filter(u => u.name !== myName).slice(0, 19);
        displayData = [myData, ...others];
      } else {
        displayData = allUsers.slice(0, 20);
      }
    } else {
      document.getElementById('chart-title').innerText = "🤝 じぶんのまわり（前後3名）";
      noteEl.innerHTML = "💡 <strong>⭐️があなたです。</strong> 自分の前後にいる3人ずつの友達と、はげまし合ってがんばろう！";
      
      if (myIndex !== -1) {
        const start = Math.max(0, myIndex - 3);
        const end = Math.min(allUsers.length, myIndex + 4);
        displayData = allUsers.slice(start, end);
      } else {
        displayData = allUsers.slice(0, 7);
      }
    }

    analysisChart.data.labels = displayData.map(u => {
      const isMe = (u.name === myName);
      const h = Math.floor(u.currentTotal / 60);
      const m = u.currentTotal % 60;
      const timeStr = h > 0 ? `${h}時間${m}分` : `${m}分`;
      const isTop = (u.rank <= 20);
      const isNear = (myIndex !== -1 && Math.abs(u.rank - (myIndex + 1)) <= 3);
      let nameLabel = isMe ? `⭐️${u.name}(${u.rank}位)` : (isTop || isNear ? `${u.rank}位:${u.name}` : `${u.rank}位:(匿名)`);
      return [nameLabel, timeStr];
    });

    if (viewType === 'all') {
      analysisChart.data.datasets[0].data = displayData.map(u => u.school);
      analysisChart.data.datasets[1].data = displayData.map(u => u.self);
      analysisChart.data.datasets[0].hidden = false; analysisChart.data.datasets[1].hidden = false;
      analysisChart.data.datasets[0].backgroundColor = displayData.map(u => u.name === myName ? '#e67e22' : '#2980b9');
      analysisChart.data.datasets[1].backgroundColor = displayData.map(u => u.name === myName ? '#f39c12' : '#3498db');
    } else if (viewType === 'school') {
      analysisChart.data.datasets[0].data = displayData.map(u => u.school);
      analysisChart.data.datasets[1].data = displayData.map(u => 0);
      analysisChart.data.datasets[0].hidden = false; analysisChart.data.datasets[1].hidden = true;
      analysisChart.data.datasets[0].backgroundColor = displayData.map(u => u.name === myName ? '#e67e22' : '#2980b9');
    } else {
      analysisChart.data.datasets[0].data = displayData.map(u => 0);
      analysisChart.data.datasets[1].data = displayData.map(u => u.self);
      analysisChart.data.datasets[0].hidden = true; analysisChart.data.datasets[1].hidden = false;
      analysisChart.data.datasets[1].backgroundColor = displayData.map(u => u.name === myName ? '#f39c12' : '#3498db');
    }

    analysisChart.update();
  }

  document.getElementById('period-select').addEventListener('change', render);
  document.querySelectorAll('input').forEach(el => el.addEventListener('change', render));
</script>
</body>
</html>
