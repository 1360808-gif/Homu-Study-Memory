<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 600px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  
  .title-badge { background: #6c5ce7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; display: inline-block; margin-top: 10px; }
  
  .ai-message-area { background: linear-gradient(135deg, #e0f7fa, #ffffff); border: 2px solid #4fc3f7; border-radius: 15px; padding: 15px; margin: 15px 0 10px 0; display: flex; align-items: center; gap: 15px; text-align: left; }
  .ai-icon { font-size: 40px; }
  .ai-text { font-size: 14px; font-weight: bold; color: #0277bd; line-height: 1.4; }
  .ai-stats { font-size: 11px; color: #546e7a; margin-top: 5px; }

  .button-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0 25px 0; }
  .btn-record { width: 100%; padding: 18px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #f39c12, #e67e22); border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3); }
  .btn-analysis { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #3498db, #2980b9); border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3); }

  .section { background-color: #fdfdfd; border: 1px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  .progress-bg { background-color: #ecf0f1; border-radius: 10px; height: 30px; position: relative; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, #f1c40f, #f39c12); height: 100%; width: 0%; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; transition: width 0.5s ease; }
  .chart-container { position: relative; height: 250px; width: 100%; }

  .grade-ai-box { margin-top: 12px; padding: 10px; background: #fff9e6; border-radius: 10px; border-left: 4px solid #f39c12; text-align: left; font-size: 13px; color: #5d4037; line-height: 1.4; }
  .grade-ai-label { font-size: 11px; color: #e67e22; font-weight: bold; display: block; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="app-container">
  <span id="user-title" class="title-badge">かけだしの学習者</span>
  <h1>🏠 <span id="user-name-display">ゲスト</span></h1>

  <div class="ai-message-area">
    <div class="ai-icon" id="ai-icon">🤖</div>
    <div class="ai-content">
        <div class="ai-text" id="ai-comment">じゅんび中...</div>
        <div class="ai-stats" id="ai-stats"></div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn-record" onclick="goToInput()">✏️ 学習時間をきろくする</button>
    <button class="btn-analysis" onclick="goToAnalysis()">📊 みんなの分析・順位をみる</button>
  </div>

  <div class="section">
    <h2>🤝 みんなの合計（学年目標）</h2>
    <p id="goal-text" style="font-weight:bold; color:#e67e22; margin-bottom:10px;">目標: 集計中...</p>
    <div class="progress-bg"><div class="progress-bar" id="progress-bar">0%</div></div>
    <div class="grade-ai-box">
      <span class="grade-ai-label">🤖 学年分析アドバイス</span>
      <div id="grade-ai-comment">データをみているよ...</div>
    </div>
  </div>

  <div class="section">
    <h2>🔥 クラス平均（1人あたり）</h2>
    <div class="chart-container"><canvas id="classChart"></canvas></div>
  </div>

  <div class="section">
    <h2>👤 あなたの履歴（週ごとの合計）</h2>
    <div class="chart-container"><canvas id="personalChart"></canvas></div>
  </div>

  <div class="button-group" style="margin-top: 20px;">
    <button class="btn-record" onclick="goToInput()">✏️ 学習時間をきろくする</button>
    <button class="btn-analysis" onclick="goToAnalysis()">📊 分析・ランキング画面へ</button>
  </div>

  <button style="width:100%; padding:15px; background:#95a5a6; color:white; border:none; border-radius:10px; cursor:pointer; margin-top:10px;" onclick="location.href='index.html'">🚪 ログアウト</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト", myClass = params.get('class') || "1";
  document.getElementById('user-name-display').innerText = `${myClass}組 ${myName} さん`;

  let cachedLogs = [];
  let denoms = { "1": 30, "2": 30, "3": 30 };

  onSnapshot(doc(db, "settings", "class_sizes"), (docSnap) => {
    if (docSnap.exists()) { denoms = docSnap.data(); render(); }
  });

  onSnapshot(query(collection(db, "learning_logs"), orderBy("date", "asc")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  function formatMinutes(totalMin) {
    if (totalMin === 0) return "0分";
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h > 0) return m > 0 ? `${h}時間${m}分` : `${h}時間`;
    return `${m}分`;
  }

  const classCtx = document.getElementById('classChart').getContext('2d');
  let classChart = new Chart(classCtx, {
    type: 'bar',
    data: { labels: ['1組', '2組', '3組'], datasets: [{ label: '学校', data:[0,0,0], backgroundColor:'#2980b9'}, {label:'自分', data:[0,0,0], backgroundColor:'#c0392b'}]},
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
  });

  const personalCtx = document.getElementById('personalChart').getContext('2d');
  let personalChart = new Chart(personalCtx, {
    type: 'bar',
    data: { labels: [], datasets: [{ label: '学校', data:[], backgroundColor:'#2980b9'}, {label:'自分', data:[], backgroundColor:'#c0392b'}]},
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
  });

  function render() {
    let classTotals = { "1": {s:0, f:0}, "2": {s:0, f:0}, "3": {s:0, f:0} };
    let weeklyGroups = {}; 
    let grandTotal = 0;
    let gradeThisMonthTotal = 0;

    const now = new Date();
    const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
    const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
    const twoWeeksSun = new Date(lastSun); twoWeeksSun.setDate(lastSun.getDate() - 7);

    const thisM = now.getMonth(), lastM = (thisM === 0) ? 11 : thisM - 1;
    let stats = { tw:0, lw:0, llw:0, tm:0, lm:0 };

    cachedLogs.forEach(log => {
      const isMine = log.name === myName;
      const logDate = new Date(log.date);
      const totalTime = (log.school + log.self);

      if (logDate.getMonth() === now.getMonth() && logDate.getFullYear() === now.getFullYear()) {
        gradeThisMonthTotal += totalTime;
      }

      if (isMine) {
        if (logDate >= sun) stats.tw += totalTime;
        else if (logDate >= lastSun && logDate < sun) stats.lw += totalTime;
        else if (logDate >= twoWeeksSun && logDate < lastSun) stats.llw += totalTime;

        if (logDate.getMonth() === thisM && logDate.getFullYear() === now.getFullYear()) stats.tm += totalTime;
        else if (logDate.getMonth() === lastM) stats.lm += totalTime;

        const d = new Date(log.date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
        const mon = new Date(d.setDate(diff));
        const sdy = new Date(mon); sdy.setDate(mon.getDate() + 6);
        const label = `${mon.getMonth()+1}/${mon.getDate()} - ${sdy.getMonth()+1}/${sdy.getDate()}`;

        if(!weeklyGroups[label]) weeklyGroups[label] = { s: 0, f: 0, sortKey: mon.getTime() };
        weeklyGroups[label].s += log.school;
        weeklyGroups[label].f += log.self;
      }

      if (classTotals[log.class]) {
        classTotals[log.class].s += log.school;
        classTotals[log.class].f += log.self;
      }
      grandTotal += totalTime;
    });

    const currentMonth = now.getMonth() + 1;
    let percent, goalLabel, gradeAiText;

    if (currentMonth === 4) {
      const maxView = 30000;
      percent = Math.min(100, Math.round((gradeThisMonthTotal / maxView) * 100));
      goalLabel = `4月の学年合計: ${formatMinutes(gradeThisMonthTotal)}`;
      document.getElementById('progress-bar').innerText = "蓄積中";
      gradeAiText = "今はみんなの学習パワーを貯めている期間だよ！4月の最後にみんなの実績を集計して、5月の目標が決まるよ。";
    } else {
      const dynamicTarget = gradeThisMonthTotal > 0 ? Math.round(gradeThisMonthTotal * 1.1) : 30000;
      percent = Math.min(100, Math.round((gradeThisMonthTotal / dynamicTarget) * 100));
      goalLabel = `今月の学年合計: ${formatMinutes(gradeThisMonthTotal)} / 目標: ${formatMinutes(dynamicTarget)}`;
      document.getElementById('progress-bar').innerText = percent + '%';
      
      if (percent >= 100) gradeAiText = "目標達成おめでとう！みんなの力が合わさって、最高の結果になったね！";
      else if (percent >= 70) gradeAiText = "目標まであと少し！みんなの「ちょっとした頑張り」が集まれば必ず届くよ！";
      else gradeAiText = "今月もみんなでコツコツ積み上げているね。ぼくも一緒に応援しているよ！";
    }

    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('goal-text').innerText = goalLabel;
    document.getElementById('grade-ai-comment').innerText = gradeAiText;

    classChart.data.datasets[0].data = [classTotals["1"].s/denoms["1"], classTotals["2"].s/denoms["2"], classTotals["3"].s/denoms["3"]];
    classChart.data.datasets[1].data = [classTotals["1"].f/denoms["1"], classTotals["2"].f/denoms["2"], classTotals["3"].f/denoms["3"]];
    classChart.update();

    const sortedWeekLabels = Object.keys(weeklyGroups).sort((a,b) => weeklyGroups[a].sortKey - weeklyGroups[b].sortKey);
    const displayWeeks = sortedWeekLabels.slice(-5);
    personalChart.data.labels = displayWeeks;
    personalChart.data.datasets[0].data = displayWeeks.map(w => weeklyGroups[w].s);
    personalChart.data.datasets[1].data = displayWeeks.map(w => weeklyGroups[w].f);
    personalChart.update();

    updateAIAdvice(stats, cachedLogs.filter(l => l.name === myName));
  }

  function updateAIAdvice(stats, myLogs) {
    const aiText = document.getElementById('ai-comment');
    const aiStats = document.getElementById('ai-stats');
    const aiIcon = document.getElementById('ai-icon');
    const userTitle = document.getElementById('user-title');

    let title = "かけだしの学習者";
    if (myLogs.length > 10) title = "きろくの達人";
    const totalS = myLogs.reduce((a,b)=>a+b.school,0), totalF = myLogs.reduce((a,b)=>a+b.self,0);
    if (totalF > totalS * 1.5) title = "じしゅうの鬼";
    userTitle.innerText = title;

    let compA, compB, labelA, labelB;
    if (stats.tw > 0) {
      compA = stats.tw; labelA = "今週";
      compB = stats.lw; labelB = "先週";
    } else {
      compA = stats.lw; labelA = "先週";
      compB = stats.llw; labelB = "先々週";
    }

    let personalMsg = "";
    if (compA > compB && compB > 0) {
      personalMsg = `ぼくが見たところ、${labelA}は${labelB}よりペースが上がっているよ！その調子！`; aiIcon.innerText = "🔥";
    } else if (compA < compB && compA > 0) {
      personalMsg = `${labelA}は${labelB}よりのんびりペースかな？ぼくも応援しているから、ここから取り返そう！`; aiIcon.innerText = "🐢";
    } else {
      personalMsg = "ぼくは、きみの頑張りをしっかり見守っているよ！"; aiIcon.innerText = "🤖";
    }

    const now = new Date();
    if (now.getMonth() + 1 === 4) {
      personalMsg += "\n5月からは学年の目標もぼくが分析して教えるから、楽しみにしていてね！";
    }

    aiText.innerText = personalMsg;
    aiStats.innerHTML = `${labelA}:${formatMinutes(compA)} (${labelB}:${formatMinutes(compB)}) / 今月合計:${formatMinutes(stats.tm)}`;
  }

  window.goToInput = () => location.href = `input.html${window.location.search}`;
  window.goToAnalysis = () => location.href = `analysis.html${window.location.search}`;
</script>
</body>
</html>
