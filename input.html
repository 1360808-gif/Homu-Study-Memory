<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習入力 - 学習アプリ</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #fffbe6; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
        .input-container { background: #fff; width: 95%; max-width: 500px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
        h1 { font-size: 20px; color: #d35400; margin-bottom: 15px; }
        .user-info { background: #fef9e7; padding: 8px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; font-size: 14px; }
        
        /* タブ切り替え */
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: none; transition: 0.3s; }
        .tab-btn.active { background: #fff; color: #d35400; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .date-row { margin-bottom: 15px; text-align: left; background: #fdfaf0; padding: 10px; border-radius: 10px; border: 1px solid #f9ebea; }
        .date-row label { font-weight: bold; font-size: 14px; margin-right: 10px; }
        input[type="date"] { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }

        .input-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: left; }
        .day-label { font-weight: bold; color: #e67e22; border-left: 4px solid #e67e22; padding-left: 8px; margin-bottom: 10px; }
        
        .time-row { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        .time-row span { font-size: 13px; width: 60px; font-weight: bold; }
        .inputs { display: flex; align-items: center; gap: 5px; }
        input[type="number"] { width: 55px; padding: 8px; border: 1px solid #f39c12; border-radius: 6px; text-align: center; font-size: 16px; }
        .unit { font-size: 12px; color: #666; }

        .btn-submit { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { background: #ccc; }
        .btn-back { background: none; border: none; color: #7f8c8d; text-decoration: underline; margin-top: 15px; cursor: pointer; font-size: 13px; }
        
        #week-inputs { display: none; } /* 初期は1週間用は非表示 */
    </style>
</head>
<body>

<div class="input-container">
    <h1>✏️ がんばった時間をいれる</h1>
    <div id="user-display" class="user-info">読み込み中...</div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchMode('day')">1日分</button>
        <button class="tab-btn" onclick="switchMode('week')">1週間分</button>
    </div>

    <div id="day-inputs">
        <div class="date-row">
            <label>📅 日付:</label>
            <input type="date" id="single-date">
        </div>
        <div class="input-card">
            <div class="time-row">
                <span>🏫 学校</span>
                <div class="inputs">
                    <input type="number" id="s-h" placeholder="0" min="0">時間
                    <input type="number" id="s-m" placeholder="0" min="0">分
                </div>
            </div>
            <div class="time-row">
                <span>🏠 自分</span>
                <div class="inputs">
                    <input type="number" id="f-h" placeholder="0" min="0">時間
                    <input type="number" id="f-m" placeholder="0" min="0">分
                </div>
            </div>
        </div>
    </div>

    <div id="week-inputs">
        <div class="date-row">
            <label>📅 開始日:</label>
            <input type="date" id="week-start-date" onchange="updateWeekLabels()">
            <div style="font-size:11px; color:#666; margin-top:5px;">※選んだ日から7日分を入力できます</div>
        </div>
        <div id="week-list">
            </div>
    </div>

    <button id="submit-btn" class="btn-submit">送信する！</button>
    <button class="btn-back" onclick="history.back()">もどる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, writeBatch, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name');
    const myClass = params.get('class');
    document.getElementById('user-display').innerText = `${myClass}組：${myName} さん`;

    // 初期日付セット（今日）
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('single-date').value = today;
    document.getElementById('week-start-date').value = today;

    // モード切り替え
    let mode = 'day';
    window.switchMode = (m) => {
        mode = m;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(m === 'day' ? '1日' : '1週間')));
        document.getElementById('day-inputs').style.display = m === 'day' ? 'block' : 'none';
        document.getElementById('week-inputs').style.display = m === 'week' ? 'block' : 'none';
    };

    // 1週間分の入力枠生成
    const weekList = document.getElementById('week-list');
    for (let i = 0; i < 7; i++) {
        weekList.innerHTML += `
            <div class="input-card">
                <div class="day-label" id="day-label-${i}">日付未定</div>
                <div class="time-row">
                    <span>🏫 学校</span>
                    <div class="inputs">
                        <input type="number" id="w-s-h-${i}" placeholder="0">時
                        <input type="number" id="w-s-m-${i}" placeholder="0">分
                    </div>
                </div>
                <div class="time-row">
                    <span>🏠 自分</span>
                    <div class="inputs">
                        <input type="number" id="w-f-h-${i}" placeholder="0">時
                        <input type="number" id="w-f-m-${i}" placeholder="0">分
                    </div>
                </div>
            </div>`;
    }

    window.updateWeekLabels = () => {
        const start = new Date(document.getElementById('week-start-date').value);
        for (let i = 0; i < 7; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            document.getElementById(`day-label-${i}`).innerText = d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' });
        }
    };
    updateWeekLabels();

    // 送信処理
    document.getElementById('submit-btn').onclick = async () => {
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        const batch = writeBatch(db);
        let hasData = false;

        if (mode === 'day') {
            const sh = parseInt(document.getElementById('s-h').value) || 0;
            const sm = parseInt(document.getElementById('s-m').value) || 0;
            const fh = parseInt(document.getElementById('f-h').value) || 0;
            const fm = parseInt(document.getElementById('f-m').value) || 0;
            const date = document.getElementById('single-date').value;
            if (sh+sm+fh+fm > 0) {
                const ref = doc(collection(db, "learning_logs"));
                batch.set(ref, { name: myName, class: myClass, school: sh * 60 + sm, self: fh * 60 + fm, date: date, timestamp: serverTimestamp() });
                hasData = true;
            }
        } else {
            const start = new Date(document.getElementById('week-start-date').value);
            for (let i = 0; i < 7; i++) {
                const sh = parseInt(document.getElementById(`w-s-h-${i}`).value) || 0;
                const sm = parseInt(document.getElementById(`w-s-m-${i}`).value) || 0;
                const fh = parseInt(document.getElementById(`w-f-h-${i}`).value) || 0;
                const fm = parseInt(document.getElementById(`w-f-m-${i}`).value) || 0;
                if (sh+sm+fh+fm > 0) {
                    const d = new Date(start); d.setDate(start.getDate() + i);
                    const ref = doc(collection(db, "learning_logs"));
                    batch.set(ref, { name: myName, class: myClass, school: sh * 60 + sm, self: fh * 60 + fm, date: d.toISOString().split('T')[0], timestamp: serverTimestamp() });
                    hasData = true;
                }
            }
        }

        if (!hasData) { alert("時間を入力してね！"); btn.disabled = false; return; }

        try {
            await batch.commit();
            alert("送信しました！");
            location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
        } catch (e) {
            alert("エラー: " + e.message);
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
