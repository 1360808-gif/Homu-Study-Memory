<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード＆分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 1000px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 15px; }

  /* モード切り替えタブ */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #ecf0f1;
    color: #7f8c8d;
    transition: 0.2s;
  }
  .tab-btn.active {
    background-color: #3498db;
    color: #fff;
    box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
  }
  
  /* 先生用 管理パネル */
  .admin-panel {
    background-color: #2c3e50;
    color: #fff;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: left;
  }
  .admin-panel summary { font-weight: bold; cursor: pointer; padding: 5px; outline: none; }
  .admin-controls { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; max-height: 120px; overflow-y: auto; background: #34495e; padding: 10px; border-radius: 5px;}
  .admin-controls label { font-size: 13px; display: flex; align-items: center; gap: 5px; background: #fff; color: #333; padding: 4px 8px; border-radius: 4px; cursor: pointer;}
  
  .target-setting {
    margin-top: 15px;
    padding: 10px;
    background: #e74c3c;
    border-radius: 5px;
    display: inline-block;
    font-weight: bold;
  }
  .target-setting input { width: 60px; padding: 5px; border-radius: 4px; border: none; font-size: 14px; text-align: center;}

  /* フィルター群 */
  .controls-group {
    background-color: #e8f4f8;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: center;
  }
  
  /* グラフのラッパー（縦スクロール対応） */
  .chart-wrapper { 
    width: 100%; 
    max-height: 600px; /* 分析モード時の最大高さ */
    overflow-y: auto;  /* 縦スクロール */
    overflow-x: hidden; 
    margin-bottom: 20px; 
    border: 1px solid #eee; 
    border-radius: 8px;
  }
  .chart-container { 
    position: relative; 
    width: 100%; 
    padding: 10px 20px 10px 0; /* 右側に少し余白 */
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🔍 学習アプリ</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tab-dashboard" onclick="switchMode('dashboard')">🏠 自分のダッシュボード</button>
    <button class="tab-btn" id="tab-analysis" onclick="switchMode('analysis')">📊 クラスの分析（ランキング）</button>
  </div>

  <details class="admin-panel">
    <summary>⚙️ 先生用設定（目標時間・プライバシー・参加管理）</summary>
    
    <div class="target-setting">
      🎯 ダッシュボードの目標時間: <input type="number" id="targetHoursInput" value="50" min="1" step="1" onchange="updateView()"> 時間
    </div>

    <div style="margin-top:15px;">
      <label style="margin-right: 15px;"><input type="radio" name="viewMode" value="student" checked onchange="updateView()"> 👦👧 生徒モード（プライバシー保護あり）</label>
      <label><input type="radio" name="viewMode" value="teacher" onchange="updateView()"> 🧑‍🏫 先生モード（全員を実名表示）</label>
    </div>

    <div class="admin-controls" id="student-toggles">
      </div>
  </details>

  <div class="controls-group">
    <div style="font-weight: bold; color: #2980b9;">グラフの表示:</div>
    <label><input type="radio" name="viewType" value="all" checked onchange="updateView()"> ぜんぶ（割合）</label>
    <label><input type="radio" name="viewType" value="school" onchange="updateView()"> がっこう</label>
    <label><input type="radio" name="viewType" value="self" onchange="updateView()"> じぶん</label>
    
    <div style="font-weight: bold; color: #2980b9; margin-left: 10px;" id="sort-controls">並び替え: 
      <select id="sort-mode" onchange="updateView()">
        <option value="total-all">🏆 累計：クラス全員</option>
        <option value="total-close" selected>🤝 累計：自分と近い人（前後3人）</option>
      </select>
    </div>
  </div>

  <div class="chart-wrapper" id="scroll-wrapper">
    <div class="chart-container" id="chart-box">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

</div>

<script>
  let currentMode = 'dashboard'; 

  const allData = [];
  const names = ["佐藤", "鈴木", "高橋", "田中", "伊藤", "渡辺", "山本", "中村", "小林", "加藤", "吉田", "山田", "佐々木", "山口"];
  
  allData.push({
    id: "user_me", realName: "青木 太郎 (自分)", initial: "青木 太郎 (自分)", isActive: true,
    times: { total: { school: 1600, self: 1200 } }
  });

  for(let i = 1; i <= 40; i++) {
    const lastName = names[i % names.length];
    let baseTotalS = Math.floor(Math.random() * 3000) + 500;
    let baseTotalM = Math.floor(Math.random() * 2000) + 200;
    allData.push({
      id: "u" + i, realName: `${lastName} ${i}号`, initial: `${lastName.charAt(0)}. 匿名`, isActive: true,
      times: { total: { school: baseTotalS, self: baseTotalM } }
    });
  }

  const togglesContainer = document.getElementById('student-toggles');
  allData.forEach(u => {
    if(u.id === 'user_me') return;
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" checked onchange="toggleStudent('${u.id}', this.checked)"> ${u.realName}`;
    togglesContainer.appendChild(label);
  });

  function toggleStudent(id, isChecked) {
    const student = allData.find(u => u.id === id);
    if(student) { student.isActive = isChecked; updateView(); }
  }

  function formatTime(minutes) {
    if (minutes === 0) return "0分";
    if (minutes < 60) return minutes + "分";
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return m > 0 ? `${h}時間${m}分` : `${h}時間`;
  }

  // 🎯 横グラフ用の縦ライン描画プラグイン
  const targetLinePlugin = {
    id: 'targetLine',
    beforeDraw: chart => {
      const viewType = document.querySelector('input[name="viewType"]:checked').value;
      if (currentMode !== 'dashboard' || viewType !== 'all') return;

      const targetHours = parseInt(document.getElementById('targetHoursInput').value, 10) || 0;
      const targetMinutes = targetHours * 60;
      if (targetMinutes <= 0) return;

      const ctx = chart.ctx;
      const xAxis = chart.scales.x; // 時間軸がX軸に変わった
      const yAxis = chart.scales.y;
      const x = xAxis.getPixelForValue(targetMinutes);

      if (x >= xAxis.left && x <= xAxis.right) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, yAxis.top);
        ctx.lineTo(x, yAxis.bottom);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.8)';
        ctx.setLineDash([5, 5]);
        ctx.stroke();

        ctx.fillStyle = '#c0392b';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`🎯 目標: ${formatTime(targetMinutes)}`, x + 8, yAxis.top + 15);
        ctx.restore();
      }
    }
  };

  let mainChart;
  const ctx = document.getElementById('mainChart').getContext('2d');

  function initChart() {
    mainChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ label: 'がっこう', data: [], backgroundColor: [] }, { label: 'じぶん', data: [], backgroundColor: [], borderRadius: 4 }] },
      options: {
        indexAxis: 'y', // ★ここが横グラフ（水平バー）にする設定
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { 
          legend: { display: true, position: 'top' },
          tooltip: {
            callbacks: {
              label: function(context) { return `${context.dataset.label}: ${formatTime(context.parsed.x)}`; }
            }
          }
        },
        scales: { 
          x: { // X軸が時間
            stacked: true, beginAtZero: true, 
            ticks: { callback: function(value) { return formatTime(value); } }
          }, 
          y: { // Y軸が名前
            stacked: true 
          } 
        }
      },
      plugins: [targetLinePlugin]
    });
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tab-dashboard').classList.toggle('active', mode === 'dashboard');
    document.getElementById('tab-analysis').classList.toggle('active', mode === 'analysis');
    document.getElementById('sort-controls').style.display = mode === 'analysis' ? 'inline-block' : 'none';
    
    // モード切替時にスクロールを上に戻す
    document.getElementById('scroll-wrapper').scrollTop = 0;
    
    updateView();
  }

  function updateView() {
    const viewType = document.querySelector('input[name="viewType"]:checked').value;
    const sortMode = document.getElementById('sort-mode').value;
    const viewMode = document.querySelector('input[name="viewMode"]:checked').value;
    
    const getVal = (user) => {
      const t = user.times.total;
      if (viewType === 'school') return t.school;
      if (viewType === 'self') return t.self;
      return t.school + t.self;
    };

    let activeData = allData.filter(u => u.isActive);
    activeData.sort((a, b) => getVal(b) - getVal(a));
    activeData.forEach((user, index) => { user.currentRank = index + 1; });

    const me = activeData.find(u => u.id === 'user_me');
    let displayArray = [];

    if (currentMode === 'dashboard') {
      if (me) {
        me.displayLabel = `あなた (${me.currentRank}位)`;
        me.colorSchool = '#c0392b'; me.colorSelf = '#e74c3c';
        displayArray = [me];
      }
      
      const targetMins = parseInt(document.getElementById('targetHoursInput').value, 10) * 60;
      const myMins = me ? getVal(me) : 0;
      mainChart.options.scales.x.max = Math.max(targetMins, myMins) * 1.2; 
      
      // ダッシュボードは1人分なので高さを低く固定
      document.getElementById('chart-box').style.height = '150px'; 

    } else {
      mainChart.options.scales.x.max = undefined; 
      
      activeData.forEach(u => {
        const isMe = u.id === 'user_me';
        const isTop20 = u.currentRank <= 20;
        const isNeighbor = me && Math.abs(u.currentRank - me.currentRank) <= 3;

        if (viewMode === 'teacher') {
          u.displayLabel = isMe ? `⭐️ ${u.realName}` : `${u.currentRank}位: ${u.realName}`;
          u.colorSchool = isMe ? '#c0392b' : '#7f8c8d';
          u.colorSelf   = isMe ? '#e74c3c' : '#95a5a6';
        } else {
          if (isMe) {
            u.displayLabel = `⭐️ ${u.realName} (${u.currentRank}位)`;
            u.colorSchool = '#c0392b'; u.colorSelf = '#e74c3c';
          } else if (isTop20) {
            u.displayLabel = `${u.currentRank}位: ${u.realName}`;
            u.colorSchool = '#2980b9'; u.colorSelf = '#3498db'; // トップ20はブルー系
          } else if (isNeighbor) {
            u.displayLabel = `${u.currentRank}位: ${u.realName}`;
            u.colorSchool = '#27ae60'; u.colorSelf = '#2ecc71'; // 前後3人はグリーン系
          } else {
            u.displayLabel = `${u.currentRank}位: ${u.initial}`;
            u.colorSchool = '#7f8c8d'; u.colorSelf = '#95a5a6'; // 匿名層はグレー系
          }
        }
      });

      if (sortMode.includes('all')) {
        displayArray = me ? [me, ...activeData.filter(u => u.id !== 'user_me')] : activeData;
      } else {
        const neighbors = activeData.filter(u => u.id !== 'user_me' && Math.abs(u.currentRank - me.currentRank) <= 3);
        displayArray = me ? [me, ...neighbors] : neighbors;
      }
      
      // 分析モード時は人数に合わせてグラフエリアの「高さ」を動的に伸ばす
      document.getElementById('chart-box').style.height = Math.max(300, displayArray.length * 40) + 'px';
    }

    mainChart.data.labels = displayArray.map(u => u.displayLabel);
    mainChart.data.datasets[0].data = displayArray.map(u => u.times.total.school);
    mainChart.data.datasets[0].backgroundColor = displayArray.map(u => u.colorSchool);
    mainChart.data.datasets[1].data = displayArray.map(u => u.times.total.self);
    mainChart.data.datasets[1].backgroundColor = displayArray.map(u => u.colorSelf);
    
    mainChart.setDatasetVisibility(0, viewType === 'all' || viewType === 'school');
    mainChart.setDatasetVisibility(1, viewType === 'all' || viewType === 'self');
    
    mainChart.update();
  }

  initChart();
  switchMode('dashboard');

</script>
</body>
</html>
