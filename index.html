<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比較・分析ページ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 900px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 15px; }
  
  .global-filter {
    display: flex;
    justify-content: space-around;
    background-color: #ffeaa7;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    border: 2px solid #fdcb6e;
  }
  .global-filter label { font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }

  .controls {
    background-color: #e8f4f8;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .controls select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #bdc3c7; cursor: pointer; }
  
  .note { font-size: 13px; color: #e74c3c; margin-bottom: 15px; text-align: left; font-weight: bold; background: #fdf2e9; padding: 10px; border-radius: 5px;}

  .chart-wrapper { width: 100%; overflow-x: auto; margin-bottom: 20px; }
  .chart-container { position: relative; height: 400px; min-width: 800px; }

  button.main-btn {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff;
    background-color: #95a5a6; border: none; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🔍 じぶんとみんなの「がんばり分析」</h1>

  <div class="global-filter">
    <label><input type="radio" name="viewType" value="all" checked onchange="updateChart()"> ぜんぶ（割合も表示）</label>
    <label><input type="radio" name="viewType" value="school" onchange="updateChart()"> がっこう</label>
    <label><input type="radio" name="viewType" value="self" onchange="updateChart()"> じぶん</label>
  </div>

  <div class="controls">
    <label style="font-weight: bold; color: #2980b9;">どんな順番でくらべる？</label>
    <select id="sort-mode" onchange="updateChart()">
      <option value="total-desc">🏆 全体：長い順（歴代トップ層）</option>
      <option value="total-asc">🌱 全体：短い順</option>
      <option value="month-desc">📅 今月：長い順</option>
      <option value="week-desc">🔥 今週：長い順（今週のがんばり屋）</option>
      <option value="close-to-me" selected>🤝 自分と近い人（前後10人）</option>
    </select>
  </div>

  <p class="note">👑 トップ30名にランクインすると名前（殿堂入り）が表示されます！ 下の濃い色が「がっこう」、上の明るい色が「じぶん」の学習です。</p>

  <div class="chart-wrapper">
    <div class="chart-container" id="chart-box">
      <canvas id="analysisChart"></canvas>
    </div>
  </div>

  <button class="main-btn" onclick="alert('ダッシュボードにもどります')">ダッシュボードにもどる</button>
</div>

<script>
  // ＝ データの準備 ＝
  const allData = [];
  const names = ["佐藤", "鈴木", "高橋", "田中", "伊藤", "渡辺", "山本", "中村", "小林", "加藤", "吉田", "山田", "佐々木", "山口", "松本"];
  
  // 1. 自分のデータ
  allData.push({
    id: "user_me",
    realName: "青木 太郎 (自分)",
    initial: "青木 太郎 (自分)",
    times: {
      total: { school: 9500, self: 6000 },
      month: { school: 2400, self: 1800 },
      week:  { school: 600, self: 400 }
    }
  });

  // 2. クラスメイト40人分のダミーデータ
  for(let i = 1; i <= 40; i++) {
    const lastName = names[i % names.length];
    const baseTotalS = 3000 + Math.floor(Math.random() * 8000);
    const baseTotalM = 2000 + Math.floor(Math.random() * 6000);
    allData.push({
      id: "u" + i,
      realName: `${lastName} ${i}号`,
      initial: `${lastName.charAt(0)}. 匿名`,
      times: {
        total: { school: baseTotalS, self: baseTotalM },
        month: { school: Math.floor(baseTotalS * 0.25), self: Math.floor(baseTotalM * 0.25) },
        week:  { school: Math.floor(baseTotalS * 0.06), self: Math.floor(baseTotalM * 0.06) }
      }
    });
  }

  // ＝ グラフの初期設定（積み上げ設定） ＝
  let analysisChart;
  const ctx = document.getElementById('analysisChart').getContext('2d');

  function initChart() {
    analysisChart = new Chart(ctx, {
      type: 'bar',
      data: { 
        labels: [], 
        datasets: [
          { label: 'がっこう', data: [], backgroundColor: [], borderRadius: 0 },
          { label: 'じぶん', data: [], backgroundColor: [], borderRadius: 4 } // 上に積む方だけ角を丸く
        ] 
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false }, // マウスを乗せた時に2つのデータを同時に表示
        plugins: { legend: { display: false } },
        scales: { 
          x: { stacked: true }, // 積み上げを有効化
          y: { stacked: true, beginAtZero: true, title: { display: true, text: '時間（分）' } } 
        }
      }
    });
  }

  // ＝ グラフの更新処理 ＝
  function updateChart() {
    const viewType = document.querySelector('input[name="viewType"]:checked').value;
    const sortMode = document.getElementById('sort-mode').value;

    const getVal = (user, period) => {
      const t = user.times[period];
      if (viewType === 'school') return t.school;
      if (viewType === 'self') return t.self;
      return t.school + t.self;
    };

    let period = 'total';
    if(sortMode.includes('week')) period = 'week';
    if(sortMode.includes('month')) period = 'month';

    // 全員をソートして順位確定
    let rankedData = [...allData].sort((a, b) => getVal(b, period) - getVal(a, period));
    rankedData.forEach((user, index) => { user.currentRank = index + 1; });

    // 自分の確保と表示用配列の作成
    const me = rankedData.find(u => u.id === 'user_me');
    let displayOthers = [];

    if (sortMode.includes('desc')) {
      displayOthers = rankedData.filter(u => u.id !== 'user_me');
    } else if (sortMode.includes('asc')) {
      displayOthers = rankedData.filter(u => u.id !== 'user_me').reverse();
    } else if (sortMode === 'close-to-me') {
      const myIndex = rankedData.findIndex(u => u.id === 'user_me');
      const start = Math.max(0, myIndex - 5);
      const end = Math.min(rankedData.length, myIndex + 6);
      displayOthers = rankedData.slice(start, end).filter(u => u.id !== 'user_me');
    }

    const finalArray = [me, ...displayOthers];

    document.getElementById('chart-box').style.width = Math.max(800, finalArray.length * 40) + 'px';

    // グラフ用データの構築
    const labels = [];
    const schoolData = [];
    const selfData = [];
    const schoolColors = [];
    const selfColors = [];

    finalArray.forEach(u => {
      // ラベルと色の割り当て（濃淡で2色表現）
      if (u.id === 'user_me') {
        labels.push(`⭐️ ${u.realName}`);
        schoolColors.push('#c0392b'); // 自分・がっこう（濃い赤）
        selfColors.push('#e74c3c');   // 自分・じぶん（明るい赤）
      } else if (u.currentRank <= 30) {
        labels.push(`${u.currentRank}位: ${u.realName}`);
        schoolColors.push('#d35400'); // Top30・がっこう（濃いオレンジ）
        selfColors.push('#f1c40f');   // Top30・じぶん（明るいゴールド）
      } else {
        labels.push(`${u.currentRank}位: ${u.initial}`);
        schoolColors.push('#2980b9'); // その他・がっこう（濃い青）
        selfColors.push('#3498db');   // その他・じぶん（明るい青）
      }

      schoolData.push(u.times[period].school);
      selfData.push(u.times[period].self);
    });

    // データのセット
    analysisChart.data.labels = labels;
    analysisChart.data.datasets[0].data = schoolData;
    analysisChart.data.datasets[0].backgroundColor = schoolColors;
    analysisChart.data.datasets[1].data = selfData;
    analysisChart.data.datasets[1].backgroundColor = selfColors;
    
    // フィルターに応じた表示/非表示の切り替え
    if (viewType === 'all') {
      analysisChart.setDatasetVisibility(0, true);
      analysisChart.setDatasetVisibility(1, true);
      analysisChart.options.scales.y.title.text = '総合時間（分）';
    } else if (viewType === 'school') {
      analysisChart.setDatasetVisibility(0, true);
      analysisChart.setDatasetVisibility(1, false);
      analysisChart.options.scales.y.title.text = 'がっこうの時間（分）';
    } else if (viewType === 'self') {
      analysisChart.setDatasetVisibility(0, false);
      analysisChart.setDatasetVisibility(1, true);
      analysisChart.options.scales.y.title.text = 'じぶんの学習（分）';
    }

    analysisChart.update();
  }

  initChart();
  updateChart();

</script>
</body>
</html>
