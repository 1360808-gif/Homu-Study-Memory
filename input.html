<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>がんばり入力 - 学習アプリ</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #fffbe6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .input-container { background: #fff; width: 95%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 30px; text-align: center; box-sizing: border-box;}
        h1 { font-size: 20px; color: #d35400; margin-bottom: 20px; }
        .user-info { background: #fef9e7; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; color: #7f8c8d; }
        
        .input-section { background: #fdfaf0; border: 1px solid #f9ebea; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .input-section h3 { font-size: 16px; margin: 0 0 10px 0; color: #2c3e50; text-align: left; }
        
        .time-inputs { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .time-field { display: flex; align-items: center; gap: 5px; }
        input[type="number"] { width: 80px; padding: 12px; border: 2px solid #f39c12; border-radius: 10px; font-size: 20px; text-align: center; }
        .label-unit { font-weight: bold; color: #7f8c8d; font-size: 16px; }

        .btn-submit { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.98); background-color: #d35400; }
        .btn-submit:disabled { background-color: #bdc3c7; }
        .btn-back { background: none; border: none; color: #7f8c8d; text-decoration: underline; margin-top: 20px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="input-container">
    <h1>✏️ がんばった時間をいれる</h1>
    <div id="user-display" class="user-info">読み込み中...</div>

    <div class="input-section">
        <h3>🏫 がっこうの勉強</h3>
        <div class="time-inputs">
            <div class="time-field">
                <input type="number" id="s-hour" placeholder="0" min="0" inputmode="numeric">
                <span class="label-unit">時間</span>
            </div>
            <div class="time-field">
                <input type="number" id="s-min" placeholder="0" min="0" inputmode="numeric">
                <span class="label-unit">分</span>
            </div>
        </div>
    </div>

    <div class="input-section">
        <h3>🏠 じぶんの学習</h3>
        <div class="time-inputs">
            <div class="time-field">
                <input type="number" id="f-hour" placeholder="0" min="0" inputmode="numeric">
                <span class="label-unit">時間</span>
            </div>
            <div class="time-field">
                <input type="number" id="f-min" placeholder="0" min="0" inputmode="numeric">
                <span class="label-unit">分</span>
            </div>
        </div>
    </div>

    <button id="submit-btn" class="btn-submit">送信する！</button>
    <button class="btn-back" id="back-btn">もどる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name');
    const myClass = params.get('class');

    if (!myName || !myClass) {
        alert("名前とクラスがわかりません。ログインしなおしてください。");
        location.href = "index.html";
    }
    document.getElementById('user-display').innerText = `${myClass}組：${myName} さん`;

    document.getElementById('submit-btn').onclick = async () => {
        // 学校の計算
        const sH = parseInt(document.getElementById('s-hour').value) || 0;
        const sM = parseInt(document.getElementById('s-min').value) || 0;
        const totalSchool = (sH * 60) + sM;

        // 自分の計算
        const fH = parseInt(document.getElementById('f-hour').value) || 0;
        const fM = parseInt(document.getElementById('f-min').value) || 0;
        const totalSelf = (fH * 60) + fM;

        if (totalSchool === 0 && totalSelf === 0) {
            alert("時間を入力してね！");
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = "送信中...";

        try {
            await addDoc(collection(db, "learning_logs"), {
                name: myName,
                class: myClass,
                school: totalSchool,
                self: totalSelf,
                date: new Date().toLocaleDateString('ja-JP'),
                timestamp: serverTimestamp()
            });

            alert("送信しました！");
            location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;

        } catch (e) {
            console.error(e);
            alert("エラーが起きました。");
            btn.disabled = false;
            btn.innerText = "送信する！";
        }
    };

    document.getElementById('back-btn').onclick = () => {
        location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
    };
</script>
</body>
</html>
