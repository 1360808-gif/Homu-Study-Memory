<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者分析ダッシュボード</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { background: white; max-width: 1000px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e8ed; border-radius: 15px; background: #fff; text-align: left; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #d35400; border-left: 5px solid #d35400; padding-left: 10px; margin-bottom: 15px; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .summary-card { background: #fff; border: 2px solid #3498db; border-radius: 15px; padding: 15px; text-align: center; }
        .summary-card.goal { border-color: #e67e22; }
        .summary-label { font-size: 13px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
        .summary-value { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .progress-mini-bg { background: #eee; border-radius: 10px; height: 12px; margin-top: 10px; overflow: hidden; }
        .progress-mini-bar { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; transition: width 0.5s; }

        .progress-mini-bar.achieved { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); background-size: 200% 100%; animation: rainbow 2s linear infinite; }
        @keyframes rainbow { 0% { background-position: 200% 0; } 100% { background-position: 0 0; } }

        .filter-panel { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dee2e6; }
        .filter-row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-label { font-weight: bold; min-width: 90px; color: #495057; font-size: 14px; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-group label { cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; background: #fff; padding: 5px 10px; border-radius: 5px; border: 1px solid #ddd; transition: 0.2s; }
        input[type="radio"]:checked + span { color: #d35400; font-weight: bold; }

        .ai-analysis-box { background: linear-gradient(135deg, #e3f2fd, #ffffff); border: 2px solid #2196f3; border-radius: 15px; padding: 18px; margin-bottom: 20px; }
        .ai-title { font-weight: bold; color: #1976d2; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .ai-report { font-size: 14px; line-height: 1.6; color: #34495e; white-space: pre-wrap; }

        .table-container { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f1f3f5; color: #495057; position: sticky; top: 0; padding: 12px; z-index: 10; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
        .badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 11px; }
        .badge-school { background: #e3f2fd; color: #1976d2; }
        .badge-self { background: #fff3e0; color: #e65100; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-save { background: #27ae60; }
        .btn-add { background: #3498db; }
        .btn-danger { background: #e74c3c; font-size: 12px; padding: 8px; }
        .danger-zone { background: #fff5f5; border: 2px solid #feb2b2; padding: 15px; border-radius: 10px; }
        input[type="number"], input[type="text"], select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🏫 管理者総合分析ダッシュボード</h1>

    <div class="summary-grid">
        <div class="summary-card goal">
            <div class="summary-label">今月の学年合計</div>
            <div class="summary-value" id="sm-total-time">0分</div>
            <div class="progress-mini-bg"><div class="progress-mini-bar" id="sm-progress-bar" style="width: 0%;"></div></div>
            <div style="font-size:11px; margin-top:5px; color:#e67e22;" id="sm-percent">達成率: 0%</div>
        </div>
        <div class="summary-card">
            <div class="summary-label" id="remain-label">目標まであと</div>
            <div class="summary-value" id="sm-remain-time">---</div>
            <div style="font-size:11px; margin-top:5px; color:#7f8c8d;" id="target-label">目標：分析中...</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">今月の着地予測</div>
            <div class="summary-value" id="sm-prediction">分析中...</div>
            <div style="font-size:11px; margin-top:5px; color:#7f8c8d;" id="sm-pace">平均：---</div>
        </div>
    </div>

    <div class="section">
        <h2>🤖 AI学級分析・レコメンド</h2>
        <div class="ai-analysis-box">
            <div class="ai-title" id="ai-title">🔍 分析中...</div>
            <div id="ai-report" class="ai-report">データを読み込んでいます...</div>
        </div>
    </div>

    <div class="section">
        <h2>📊 児童別学習データ一覧</h2>
        <div class="filter-panel">
            <div class="filter-row">
                <div class="filter-label">表示クラス:</div>
                <div class="filter-group">
                    <label><input type="radio" name="class-filter" value="all" checked onchange="renderStatsTable()"><span>全学年</span></label>
                    <label><input type="radio" name="class-filter" value="1" onchange="renderStatsTable()"><span>1組</span></label>
                    <label><input type="radio" name="class-filter" value="2" onchange="renderStatsTable()"><span>2組</span></label>
                    <label><input type="radio" name="class-filter" value="3" onchange="renderStatsTable()"><span>3組</span></label>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-label">集計期間:</div>
                <div class="filter-group">
                    <label><input type="radio" name="period-filter" value="all" checked onchange="renderStatsTable()"><span>全期間</span></label>
                    <label><input type="radio" name="period-filter" value="week" onchange="renderStatsTable()"><span>1週間</span></label>
                    <label><input type="radio" name="period-filter" value="month" onchange="renderStatsTable()"><span>今月のみ</span></label>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-label">並び替え:</div>
                <div class="filter-group">
                    <select id="sort-key" onchange="renderStatsTable()">
                        <option value="no">出席番号</option>
                        <option value="total">総合計時間</option>
                        <option value="school">学校内学習</option>
                        <option value="self">じぶん学習</option>
                    </select>
                    <select id="sort-order" onchange="renderStatsTable()">
                        <option value="asc">昇順</option>
                        <option value="desc" selected>降順</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:80px;">番号</th>
                        <th>名前</th>
                        <th>期間合計</th>
                        <th>学校内</th>
                        <th>じぶん</th>
                        <th>最終記録</th>
                    </tr>
                </thead>
                <tbody id="student-stats-body"></tbody>
            </table>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="section">
            <h2>👥 名簿登録</h2>
            <div style="margin-bottom: 10px;">
                <label><input type="radio" name="input-mode" value="single" checked onclick="toggleInputMode()"> 個別追加</label>
                <label style="margin-left: 10px;"><input type="radio" name="input-mode" value="bulk" onclick="toggleInputMode()"> 一括登録(Excelコピペ)</label>
            </div>

            <div id="single-input-area" style="display:flex; gap:5px; flex-wrap:wrap;">
                <input type="number" id="st-class" placeholder="組" style="width:40px">
                <input type="number" id="st-no" placeholder="番" style="width:40px">
                <input type="text" id="st-name" placeholder="名前" style="flex:1; min-width:80px;">
                <button class="btn btn-add" onclick="addStudent()">追加</button>
            </div>

            <div id="bulk-input-area" style="display:none; flex-direction:column; gap:10px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <select id="bulk-class-select" style="width: 100px;">
                        <option value="">組を選択</option>
                        <option value="1">1組</option>
                        <option value="2">2組</option>
                        <option value="3">3組</option>
                    </select>
                    <span style="font-size:11px; color:gray;">「番号」「フルネーム」の2列をコピペ</span>
                </div>
                <textarea id="bulk-input" rows="5" placeholder="例：&#10;1 佐藤 太郎&#10;2 田中 花子" style="width:100%;"></textarea>
                <button class="btn btn-add" onclick="addStudentsBulk()">一括追加を実行</button>
            </div>
        </div>
        <div class="section">
            <h2>分母設定</h2>
            <div style="display:flex; gap:5px; align-items:center;">
                1組:<input type="number" id="denom-1" style="width:40px">
                2組:<input type="number" id="denom-2" style="width:40px">
                3組:<input type="number" id="denom-3" style="width:40px">
                <button class="btn btn-save" onclick="saveClassSizes()">保存</button>
            </div>
        </div>
    </div>

    <div class="section danger-zone">
        <h2>⚠️ データの初期化</h2>
        <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
            <label><input type="checkbox" id="check-log"> ログ削除</label>
            <button class="btn btn-danger" onclick="bulkDelete('learning_logs')">ログのみ削除実行</button>
            <label style="margin-left:auto;"><input type="checkbox" id="check-all"> 完全削除</label>
            <button class="btn btn-danger" onclick="bulkDelete('all')">全データ削除実行</button>
        </div>
    </div>
    
    <button style="width:100%; padding:10px; background:none; border:none; color:gray; text-decoration:underline; cursor:pointer;" onclick="location.href='index.html'">ログイン画面へ戻る</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allStudents = [];
    let allLogs = [];

    function formatMin(m) {
        if (m === 0) return "0分";
        const h = Math.floor(m / 60);
        const min = m % 60;
        return h > 0 ? `${h}時間${min}分` : `${min}分`;
    }

    async function init() {
        allStudents = await fetchColl("students");
        allLogs = await fetchColl("learning_logs");
        const sizes = await getDoc(doc(db, "settings", "class_sizes"));
        if(sizes.exists()){
            const d = sizes.data();
            document.getElementById('denom-1').value = d["1"]||30;
            document.getElementById('denom-2').value = d["2"]||30;
            document.getElementById('denom-3').value = d["3"]||30;
        }
        renderStatsTable();
    }

    async function fetchColl(n) {
        const s = await getDocs(collection(db, n));
        let a = []; s.forEach(d => a.push(d.data())); return a;
    }

    window.renderStatsTable = function() {
        const classF = document.querySelector('input[name="class-filter"]:checked').value;
        const periodF = document.querySelector('input[name="period-filter"]:checked').value;
        const sortK = document.getElementById('sort-key').value;
        const sortO = document.getElementById('sort-order').value;
        
        const now = new Date();
        const thisM = now.getMonth();
        const thisY = now.getFullYear();
        const lastM = (thisM === 0) ? 11 : thisM - 1;
        const lastMYear = (thisM === 0) ? thisY - 1 : thisY;

        let start = new Date(0);
        if(periodF === 'week') start = new Date(now - 7*24*60*60*1000);
        else if(periodF === 'month') start = new Date(thisY, thisM, 1);

        let stats = {};
        allStudents.forEach(s => stats[nameMapKey(s.name, s.class)] = { name:s.name, class:s.class, no:s.no, school:0, self:0, total:0, lastDate:"-" });
        
        let gradeThisMonthTotal = 0;
        let gradeLastMonthTotal = 0;

        allLogs.forEach(l => {
            const d = new Date(l.date);
            const total = (l.school || 0) + (l.self || 0);

            if (d.getMonth() === thisM && d.getFullYear() === thisY) gradeThisMonthTotal += total;
            if (d.getMonth() === lastM && d.getFullYear() === lastMYear) gradeLastMonthTotal += total;

            const key = nameMapKey(l.name, l.class);
            if(d >= start && stats[key]) {
                stats[key].school += (l.school || 0);
                stats[key].self += (l.self || 0);
                stats[key].total += total;
                if(stats[key].lastDate < l.date) stats[key].lastDate = l.date;
            }
        });

        const summaryData = updateSummary(gradeThisMonthTotal, gradeLastMonthTotal);

        let list = Object.values(stats);
        list = list.filter(item => classF === "all" || item.class == classF);

        list.sort((a, b) => {
            if(sortK === 'no') {
                if(a.class !== b.class) return a.class - b.class;
                return sortO === 'asc' ? a.no - b.no : b.no - a.no;
            }
            return sortO === 'asc' ? a[sortK] - b[sortK] : b[sortK] - a[sortK];
        });

        const tbody = document.getElementById('student-stats-body');
        tbody.innerHTML = "";
        list.forEach(item => {
            tbody.innerHTML += `<tr>
                <td>${item.class}-${String(item.no).padStart(2,'0')}</td>
                <td><strong>${item.name}</strong></td>
                <td>${formatMin(item.total)}</td>
                <td><span class="badge badge-school">${item.school}</span></td>
                <td><span class="badge badge-self">${item.self}</span></td>
                <td>${item.lastDate}</td>
            </tr>`;
        });
        updateAI(list, periodF, summaryData);
    };

    function nameMapKey(name, cls) { return `${cls}_${name}`; }

    function updateSummary(thisMonthTotal, lastMonthTotal) {
        const now = new Date();
        const currentDate = now.getDate();
        const baseForTarget = (currentDate <= 10 && lastMonthTotal > 0) ? lastMonthTotal : thisMonthTotal;
        const targetMin = baseForTarget > 0 ? Math.round(baseForTarget * 1.1) : 30000;
        const percent = Math.min(100, Math.round((thisMonthTotal / targetMin) * 100));
        const progressBar = document.getElementById('sm-progress-bar');
        
        document.getElementById('sm-total-time').innerText = formatMin(thisMonthTotal);
        progressBar.style.width = percent + '%';
        document.getElementById('sm-percent').innerText = `今月の達成率: ${percent}%`;
        document.getElementById('sm-remain-time').innerText = formatMin(Math.max(0, targetMin - thisMonthTotal));
        document.getElementById('target-label').innerText = `目標：${formatMin(targetMin)} (前月比1.1倍)`;

        if(percent >= 100) progressBar.classList.add('achieved');
        else progressBar.classList.remove('achieved');

        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const dailyAvg = thisMonthTotal / currentDate;
        const predictedTotal = dailyAvg * daysInMonth;
        document.getElementById('sm-pace').innerText = `今月の1日平均：約${Math.round(dailyAvg)}分`;

        let predictionText = "分析中...";
        if (thisMonthTotal >= targetMin) predictionText = "目標達成！🎉";
        else if (dailyAvg > 0) predictionText = predictedTotal >= targetMin ? "達成見込み" : "ペースアップが必要";
        document.getElementById('sm-prediction').innerText = predictionText;

        return { dailyAvg, predictedTotal, targetMin, thisMonthTotal };
    }

    function updateAI(list, period, summary) {
        const pLabel = {all:"全期間", week:"1週間", month:"今月"}[period];
        const activeCount = list.filter(i => i.total > 0).length;
        let report = `【${pLabel}の状況】\n対象児童 ${list.length}名のうち、${activeCount}名が学習を記録しました。\n\n`;
        report += `🚀 **AI分析：今月の着地予想**\n現在のペースを維持すると、今月末には合計 **【${formatMin(Math.round(summary.predictedTotal))}】** に達する見込みです。\n`;
        if (summary.thisMonthTotal >= summary.targetMin) report += `🎉 すばらしい！目標突破！`;
        else if (summary.predictedTotal >= summary.targetMin) report += `✅ 順調です。維持しましょう。`;
        else report += `⚠️ ペースアップが必要です。`;
        document.getElementById('ai-report').innerText = report;
        document.getElementById('ai-title').innerText = "✅ AI分析レポート（目標達成予測）";
    }

    // --- 名簿登録関連ロジック ---

    window.toggleInputMode = function() {
        const mode = document.querySelector('input[name="input-mode"]:checked').value;
        document.getElementById('single-input-area').style.display = (mode === 'single' ? 'flex' : 'none');
        document.getElementById('bulk-input-area').style.display = (mode === 'bulk' ? 'flex' : 'none');
    };

    window.addStudent = async () => {
        const c = document.getElementById('st-class').value, n = document.getElementById('st-no').value, nm = document.getElementById('st-name').value;
        if(!c || !n || !nm) return alert("入力不足");
        await setDoc(doc(db, "students", `s_${c}_${n}`), { class:Number(c), no:Number(n), name:nm });
        location.reload();
    };

    window.addStudentsBulk = async () => {
        const classVal = document.getElementById('bulk-class-select').value;
        const rawInput = document.getElementById('bulk-input').value.trim();
        if (!classVal) return alert("登録先の「組」を選択してください");
        if (!rawInput) return alert("名簿データが入力されていません");

        const lines = rawInput.split(/\r?\n/);
        const studentsToSave = [];

        for (let line of lines) {
            // 正規表現：行頭の数字(番号)を取得し、その後の空白以降の全文字列を名前として取得
            const match = line.trim().match(/^(\d+)[\t\s]+(.+)$/);
            
            if (match) {
                const no = Number(match[1]);
                const name = match[2].trim(); // 苗字と名前の間のスペースも維持される
                
                if (!isNaN(no) && name) {
                    studentsToSave.push({ 
                        id: `s_${classVal}_${no}`, 
                        data: { class: Number(classVal), no: no, name: name } 
                    });
                }
            }
        }

        if (studentsToSave.length === 0) {
            return alert("有効な形式が見つかりません。「番号 名前」の順で入力してください。");
        }

        if (!confirm(`${classVal}組に ${studentsToSave.length} 名を登録しますか？`)) return;

        try {
            const promises = studentsToSave.map(s => setDoc(doc(db, "students", s.id), s.data));
            await Promise.all(promises);
            alert("フルネームでの一括登録が完了しました！");
            location.reload();
        } catch (e) { 
            console.error(e);
            alert("エラーが発生しました"); 
        }
    };

    window.saveClassSizes = async () => {
        const d = { "1":Number(document.getElementById('denom-1').value), "2":Number(document.getElementById('denom-2').value), "3":Number(document.getElementById('denom-3').value) };
        await setDoc(doc(db, "settings", "class_sizes"), d); alert("保存しました");
    };

    window.bulkDelete = async (m) => {
        const id = m === 'all' ? 'check-all' : 'check-log';
        if(!document.getElementById(id).checked) return alert("同意チェックが必要");
        if(!confirm("本当に削除しますか？")) return;
        const s1 = await getDocs(collection(db, "learning_logs"));
        for(const d of s1.docs) await deleteDoc(doc(db, "learning_logs", d.id));
        if(m==='all') {
            const s2 = await getDocs(collection(db, "students"));
            for(const d of s2.docs) await deleteDoc(doc(db, "students", d.id));
        }
        alert("削除完了"); location.reload();
    };

    init();
</script>
</body>
</html>
