<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習入力</title>
    <style>
        body { font-family: sans-serif; background-color: #fffbe6; padding: 20px; text-align: center; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tab-btn.active { background: #fff; color: #d35400; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: #fdfaf0; border: 1px solid #f9ebea; border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .card h3 { margin-top: 0; color: #d35400; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
        input[type="number"] { width: 50px; padding: 8px; border: 2px solid #f39c12; border-radius: 8px; text-align: center; font-size: 16px; }
        input[type="date"] { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; width: 100%; }
        .day-label { font-weight: bold; color: #2c3e50; min-width: 80px; display: inline-block; }
        .btn-submit { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="user-info">読み込み中...</h2>
    <div class="tab-menu">
        <button id="btn-day" class="tab-btn active" onclick="switchMode('day')">1日分</button>
        <button id="btn-list" class="tab-btn" onclick="switchMode('list')">1週間(1日ずつ)</button>
        <button id="btn-week" class="tab-btn" onclick="switchMode('week')">1週間(まとめて)</button>
    </div>

    <div id="area-day">
        <div class="card">
            <h3>📅 いつの分？</h3>
            <input type="date" id="date-day">
        </div>
        <div class="card">
            <h3>⏰ 時間</h3>
            <div class="row"><span>🏫 学校</span><div><input type="number" id="ds-h">時<input type="number" id="ds-m">分</div></div>
            <div class="row"><span>🏠 じぶん</span><div><input type="number" id="df-h">時<input type="number" id="df-m">分</div></div>
        </div>
    </div>

    <div id="area-list" style="display:none;">
        <div class="card">
            <h3>📅 金曜日を選択</h3>
            <input type="date" id="date-list-start">
        </div>
        <div id="list-inputs"></div>
    </div>

    <div id="area-week" style="display:none;">
        <div class="card">
            <h3>📅 何週目？(金曜〜)</h3>
            <input type="date" id="date-week">
        </div>
        <div class="card">
            <h3>⏰ 合計時間</h3>
            <div class="row"><span>🏫 学校</span><div><input type="number" id="ws-h">時<input type="number" id="ws-m">分</div></div>
            <div class="row"><span>🏠 じぶん</span><div><input type="number" id="wf-h">時<input type="number" id="wf-m">分</div></div>
        </div>
    </div>

    <button id="send-btn" class="btn-submit">送信する！</button>
    <button style="border:none; background:none; text-decoration:underline; color:#7f8c8d; margin-top:15px; cursor:pointer;" onclick="history.back()">もどる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name'), myClass = params.get('class');
    document.getElementById('user-info').innerText = myName + " さんの入力";

    function getRecentFriday(d) {
        const day = d.getDay();
        let diff = day >= 5 ? day - 5 : day + 2; 
        const result = new Date(d);
        result.setDate(d.getDate() - diff);
        return result;
    }

    const todayStr = new Date().toISOString().split('T')[0];
    const fridayStr = getRecentFriday(new Date()).toISOString().split('T')[0];
    document.getElementById('date-day').value = todayStr;
    document.getElementById('date-week').value = fridayStr;
    document.getElementById('date-list-start').value = fridayStr;

    function renderListInputs() {
        const start = new Date(document.getElementById('date-list-start').value);
        const container = document.getElementById('list-inputs');
        container.innerHTML = '';
        const weekDays = ['日','月','火','水','木','金','土'];
        for(let i=0; i<7; i++) {
            const d = new Date(start); d.setDate(start.getDate() + i);
            const dStr = d.toISOString().split('T')[0];
            container.innerHTML += `
                <div class="card" style="padding:10px" data-date="${dStr}">
                    <span class="day-label">${d.getMonth()+1}/${d.getDate()}(${weekDays[d.getDay()]})</span>
                    <div class="row">
                        🏫 <input type="number" class="ls-h">:<input type="number" class="ls-m">
                        🏠 <input type="number" class="lf-h">:<input type="number" class="lf-m">
                    </div>
                </div>`;
        }
    }
    document.getElementById('date-list-start').onchange = renderListInputs;
    renderListInputs();

    let mode = 'day';
    window.switchMode = (m) => {
        mode = m;
        ['day','list','week'].forEach(v => {
            document.getElementById('btn-'+v).classList.toggle('active', m===v);
            document.getElementById('area-'+v).style.display = m===v?'block':'none';
        });
    };

    document.getElementById('send-btn').onclick = async () => {
        const btn = document.getElementById('send-btn');
        btn.disabled = true;
        try {
            if (mode === 'day') {
                const h = parseInt(document.getElementById('ds-h').value)||0, m = parseInt(document.getElementById('ds-m').value)||0;
                const fh = parseInt(document.getElementById('df-h').value)||0, fm = parseInt(document.getElementById('df-m').value)||0;
                const date = document.getElementById('date-day').value;
                await setDoc(doc(db, "learning_logs", `${myName}_day_${date}`), { name: myName, class: myClass, school: h*60+m, self: fh*60+fm, date: date, mode: 'day', timestamp: serverTimestamp() });
            } else if (mode === 'week') {
                const h = parseInt(document.getElementById('ws-h').value)||0, m = parseInt(document.getElementById('ws-m').value)||0;
                const fh = parseInt(document.getElementById('wf-h').value)||0, fm = parseInt(document.getElementById('wf-m').value)||0;
                const date = document.getElementById('date-week').value;
                await setDoc(doc(db, "learning_logs", `${myName}_week_${date}`), { name: myName, class: myClass, school: h*60+m, self: fh*60+fm, date: date, mode: 'week', timestamp: serverTimestamp() });
            } else if (mode === 'list') {
                const cards = document.querySelectorAll('#list-inputs .card');
                for (let card of cards) {
                    const date = card.getAttribute('data-date');
                    const h = parseInt(card.querySelector('.ls-h').value)||0, m = parseInt(card.querySelector('.ls-m').value)||0;
                    const fh = parseInt(card.querySelector('.lf-h').value)||0, fm = parseInt(card.querySelector('.lf-m').value)||0;
                    if(h+m+fh+fm > 0) {
                        await setDoc(doc(db, "learning_logs", `${myName}_day_${date}`), { name: myName, class: myClass, school: h*60+m, self: fh*60+fm, date: date, mode: 'day', timestamp: serverTimestamp() });
                    }
                }
            }
            alert("送信しました！");
            location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
        } catch (e) { alert("エラー:" + e); btn.disabled = false; }
    };
</script>
</body>
</html>
