<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者総合分析画面</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; color: #333; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section { margin-bottom: 40px; padding: 20px; border: 1px solid #e1e8ed; border-radius: 15px; background: #fff; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        h2 { font-size: 18px; color: #d35400; border-left: 5px solid #d35400; padding-left: 10px; margin-bottom: 20px; }
        
        /* AI分析エリア */
        .ai-analysis-box { background: linear-gradient(135deg, #e3f2fd, #ffffff); border: 2px solid #2196f3; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .ai-title { font-weight: bold; color: #1976d2; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .ai-report { font-size: 14px; line-height: 1.6; color: #34495e; white-space: pre-wrap; }

        /* テーブルスタイル */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #f8f9fa; color: #7f8c8d; }
        .stats-badge { padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 12px; }
        .badge-school { background: #e3f2fd; color: #1976d2; }
        .badge-self { background: #fff3e0; color: #e65100; }

        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .btn-save { background: #27ae60; }
        .btn-add { background: #3498db; }
        .btn-danger { background: #e74c3c; width: 100%; margin-top: 10px; }
        
        .danger-zone { background: #fff5f5; border: 2px solid #feb2b2; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🏫 学級管理者ダッシュボード</h1>

    <div class="section">
        <h2>🤖 AI学級分析レポート</h2>
        <div class="ai-analysis-box" id="ai-box">
            <div class="ai-title"><span>🔍</span> AIがデータを分析中...</div>
            <div class="ai-report" id="ai-report">学習ログを読み込んでいます。少々お待ちください。</div>
        </div>
    </div>

    <div class="section">
        <h2>📊 児童別・学習状況スコア</h2>
        <div style="max-height: 400px; overflow-y: auto;">
            <table id="student-stats-table">
                <thead>
                    <tr>
                        <th>クラス</th>
                        <th>名前</th>
                        <th>合計時間</th>
                        <th>学校内</th>
                        <th>じぶん学習</th>
                        <th>最終記録日</th>
                    </tr>
                </thead>
                <tbody id="student-stats-body"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h2>👥 基本設定（人数・名簿）</h2>
        <div class="form-row">
            1組: <input type="number" id="denom-1" style="width:50px">人 
            2組: <input type="number" id="denom-2" style="width:50px">人 
            3組: <input type="number" id="denom-3" style="width:50px">人
            <button class="btn btn-save" onclick="saveClassSizes()">人数保存</button>
        </div>
        <div class="form-row">
            <input type="number" id="st-class" placeholder="組" style="width:40px">
            <input type="number" id="st-no" placeholder="番" style="width:40px">
            <input type="text" id="st-name" placeholder="名前" style="flex:1">
            <button class="btn btn-add" onclick="addStudent()">児童追加</button>
        </div>
    </div>

    <div class="section danger-zone">
        <h2>⚠️ データの初期化</h2>
        <label><input type="checkbox" id="check-log"> 学習ログのみ削除</label>
        <button class="btn btn-danger" onclick="bulkDelete('learning_logs')" id="del-log" style="padding:5px; font-size:12px;">実行</button>
        <br><br>
        <label><input type="checkbox" id="check-all"> 名簿も含む全データ削除</label>
        <button class="btn btn-danger" onclick="bulkDelete('all')" id="del-all" style="padding:5px; font-size:12px;">実行</button>
    </div>

    <button style="width:100%; background:none; border:none; color:gray; text-decoration:underline; cursor:pointer;" onclick="location.href='index.html'">ログイン画面へ</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function initAdmin() {
        const students = await fetchColl("students");
        const logs = await fetchColl("learning_logs");
        const sizes = await getDoc(doc(db, "settings", "class_sizes"));
        
        if(sizes.exists()){
            const d = sizes.data();
            document.getElementById('denom-1').value = d["1"];
            document.getElementById('denom-2').value = d["2"];
            document.getElementById('denom-3').value = d["3"];
        }

        analyzeData(students, logs);
    }

    async function fetchColl(name) {
        const snap = await getDocs(collection(db, name));
        let arr = [];
        snap.forEach(d => arr.push({id: d.id, ...d.data()}));
        return arr;
    }

    function analyzeData(students, logs) {
        let stats = {};
        students.forEach(s => {
            stats[s.name] = { class: s.class, school: 0, self: 0, lastDate: "-" };
        });

        logs.forEach(l => {
            if(stats[l.name]) {
                stats[l.name].school += l.school;
                stats[l.name].self += l.self;
                if(stats[l.name].lastDate < l.date) stats[l.name].lastDate = l.date;
            }
        });

        // テーブル描画
        const tbody = document.getElementById('student-stats-body');
        tbody.innerHTML = "";
        let totalSelf = 0, totalSchool = 0;
        let activeUsers = 0;

        Object.keys(stats).forEach(name => {
            const s = stats[name];
            totalSelf += s.self; totalSchool += s.school;
            if(s.school + s.self > 0) activeUsers++;

            tbody.innerHTML += `
                <tr>
                    <td>${s.class}組</td>
                    <td><strong>${name}</strong></td>
                    <td>${s.school + s.self}分</td>
                    <td><span class="stats-badge badge-school">${s.school}分</span></td>
                    <td><span class="stats-badge badge-self">${s.self}分</span></td>
                    <td>${s.lastDate}</td>
                </tr>
            `;
        });

        // AI分析レポート生成
        const aiReport = document.getElementById('ai-report');
        const selfRate = Math.round((totalSelf / (totalSelf + totalSchool || 1)) * 100);
        
        let advice = `【学級概況】\n現在、名簿登録者のうち ${activeUsers}名 が学習を記録しています。\n学級全体の「じぶん学習」の割合は ${selfRate}% です。\n\n`;
        
        // 特徴的な児童の抽出
        let masters = Object.keys(stats).filter(n => stats[n].self > 500);
        if(masters.length > 0) advice += `✨【絶好調】じぶん学習が500分を超えている児童が ${masters.length}名 います。称賛の声をかけてあげてください。\n`;
        
        let sleeping = Object.keys(stats).filter(n => stats[n].lastDate === "-" && activeUsers > 0);
        if(sleeping.length > 0) advice += `⚠️【要フォロー】まだ一度も記録していない児童が ${sleeping.length}名 います。入力の仕方を再確認すると良いかもしれません。\n`;

        advice += `\n💡【先生への提言】\n自学率が${selfRate < 30 ? "低めです。家庭での「じぶん学習」のネタを共有する時間を設けてみてはどうでしょうか？" : "順調です！自立した学習者が育っています。"}`;
        
        aiReport.innerText = advice;
        document.querySelector('.ai-title').innerText = "✅ AI分析レポートが完了しました";
    }

    // --- 各種操作関数 ---
    window.saveClassSizes = async () => {
        const d = { "1": Number(document.getElementById('denom-1').value), "2": Number(document.getElementById('denom-2').value), "3": Number(document.getElementById('denom-3').value) };
        await setDoc(doc(db, "settings", "class_sizes"), d); alert("保存完了");
    };

    window.addStudent = async () => {
        const c = document.getElementById('st-class').value, n = document.getElementById('st-no').value, nm = document.getElementById('st-name').value;
        if(!c || !n || !nm) return;
        await setDoc(doc(db, "students", `s_${c}_${n}`), { class:Number(c), no:Number(n), name:nm });
        location.reload();
    };

    window.bulkDelete = async (mode) => {
        const check = mode === 'all' ? 'check-all' : 'check-log';
        if(!document.getElementById(check).checked) { alert("チェックボックスにチェックを入れてください"); return; }
        if(!confirm("本当に削除しますか？")) return;

        if(mode === 'all' || mode === 'learning_logs') {
            const snap = await getDocs(collection(db, "learning_logs"));
            for(const d of snap.docs) await deleteDoc(doc(db, "learning_logs", d.id));
        }
        if(mode === 'all') {
            const snap = await getDocs(collection(db, "students"));
            for(const d of snap.docs) await deleteDoc(doc(db, "students", d.id));
        }
        alert("削除完了"); location.reload();
    };

    initAdmin();
</script>
</body>
</html>
