<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習入力 - 上書き対応</title>
<style>
  body { font-family: sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; padding: 20px; }
  .input-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
  h1 { font-size: 20px; color: #333; }
  .input-group { text-align: left; margin-bottom: 20px; }
  label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
  input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
  .btn-save { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
  .btn-back { width: 100%; padding: 10px; background: #95a5a6; color: white; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="input-card">
  <h1 id="user-display">学習時間を入力</h1>
  <div class="input-group">
    <label>🏫 学校での勉強（分）</label>
    <input type="number" id="school-time" placeholder="0">
  </div>
  <div class="input-group">
    <label>🏠 じぶんの勉強（分）</label>
    <input type="number" id="self-time" placeholder="0">
  </div>
  <button class="btn-save" onclick="saveData()">🚀 ほぞんする</button>
  <button class="btn-back" onclick="history.back()">もどる</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name');
  const myClass = params.get('class');

  window.saveData = async function() {
    const sTime = Number(document.getElementById('school-time').value) || 0;
    const hTime = Number(document.getElementById('self-time').value) || 0;
    const todayStr = new Date().toISOString().split('T')[0];

    // 【重要】名前と日付をIDにすることで「同じ日のデータは上書き」される
    const docId = `${myName}_${todayStr}`;

    try {
      await setDoc(doc(db, "learning_logs", docId), {
        name: myName,
        class: myClass,
        date: todayStr,
        school: sTime,
        self: hTime,
        timestamp: new Date()
      });
      alert("ほぞんしました！");
      history.back(); // 前の画面（ダッシュボード）に戻る
    } catch (e) {
      alert("エラー: " + e);
    }
  };
</script>
</body>
</html>
