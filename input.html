<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習入力</title>
    <style>
        body { font-family: sans-serif; background-color: #fffbe6; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #fff; color: #d35400; }
        .card { background: #fdfaf0; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 10px; text-align: left; }
        .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
        input[type="number"] { width: 50px; padding: 8px; border: 1px solid #f39c12; border-radius: 5px; text-align: center; }
        input[type="date"] { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        .btn-submit { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="user-info">読み込み中...</h2>
    <div class="tab-menu">
        <button id="btn-day" class="tab-btn active" onclick="switchMode('day')">1日分</button>
        <button id="btn-week" class="tab-btn" onclick="switchMode('week')">1週間分</button>
    </div>

    <div id="area-day">
        <div class="card">
            日付: <input type="date" id="date-day">
            <div class="row">🏫 学校: <span><input type="number" id="ds-h">時間 <input type="number" id="ds-m">分</span></div>
            <div class="row">🏠 自分: <span><input type="number" id="df-h">時間 <input type="number" id="df-m">分</span></div>
        </div>
    </div>

    <div id="area-week" style="display:none;">
        月曜日の日付: <input type="date" id="date-week" onchange="updateWeek()">
        <div id="week-list"></div>
    </div>

    <button id="send-btn" class="btn-submit">送信する！</button>
    <button style="margin-top:10px; background:none; border:none; text-decoration:underline; cursor:pointer;" onclick="history.back()">もどる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, writeBatch, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name'), myClass = params.get('class');
    document.getElementById('user-info').innerText = myName + " さんの入力";

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date-day').value = today;
    document.getElementById('date-week').value = today;

    let mode = 'day';
    window.switchMode = (m) => {
        mode = m;
        document.getElementById('btn-day').classList.toggle('active', m==='day');
        document.getElementById('btn-week').classList.toggle('active', m==='week');
        document.getElementById('area-day').style.display = m==='day'?'block':'none';
        document.getElementById('area-week').style.display = m==='week'?'block':'none';
        if(m==='week') updateWeek();
    };

    window.updateWeek = () => {
        const start = new Date(document.getElementById('date-week').value);
        const list = document.getElementById('week-list');
        list.innerHTML = "";
        for(let i=0; i<7; i++){
            const d = new Date(start); d.setDate(start.getDate()+i);
            list.innerHTML += `<div class="card"><b>${d.toLocaleDateString()}</b><div class="row">🏫<input type="number" id="ws-h-${i}">時<input type="number" id="ws-m-${i}">分 / 🏠<input type="number" id="wf-h-${i}">時<input type="number" id="wf-m-${i}">分</div></div>`;
        }
    };

    document.getElementById('send-btn').onclick = async () => {
        const batch = writeBatch(db);
        let count = 0;
        if(mode === 'day'){
            const sh = parseInt(document.getElementById('ds-h').value)||0, sm = parseInt(document.getElementById('ds-m').value)||0;
            const fh = parseInt(document.getElementById('df-h').value)||0, fm = parseInt(document.getElementById('df-m').value)||0;
            if(sh+sm+fh+fm > 0){
                const ref = doc(collection(db, "learning_logs"));
                batch.set(ref, {name:myName, class:myClass, school:sh*60+sm, self:fh*60+fm, date:document.getElementById('date-day').value, timestamp:serverTimestamp()});
                count++;
            }
        } else {
            const start = new Date(document.getElementById('date-week').value);
            for(let i=0; i<7; i++){
                const sh = parseInt(document.getElementById(`ws-h-${i}`).value)||0, sm = parseInt(document.getElementById(`ws-m-${i}`).value)||0;
                const fh = parseInt(document.getElementById(`wf-h-${i}`).value)||0, fm = parseInt(document.getElementById(`wf-m-${i}`).value)||0;
                if(sh+sm+fh+fm > 0){
                    const d = new Date(start); d.setDate(start.getDate()+i);
                    const ref = doc(collection(db, "learning_logs"));
                    batch.set(ref, {name:myName, class:myClass, school:sh*60+sm, self:fh*60+fm, date:d.toISOString().split('T')[0], timestamp:serverTimestamp()});
                    count++;
                }
            }
        }
        if(count > 0) {
            await batch.commit(); alert("送信成功！");
            location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
        }
    };
</script>
</body>
</html>
