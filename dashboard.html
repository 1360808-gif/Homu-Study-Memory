<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習入力ダッシュボード</title>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 500px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 30px; text-align: center; }
  h1 { font-size: 24px; color: #2c3e50; }
  .user-info { font-size: 18px; margin-bottom: 20px; font-weight: bold; color: #3498db; }
  
  .input-group { margin-bottom: 20px; text-align: left; }
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  input[type="number"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; box-sizing: border-box; }
  
  .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
  .btn-submit { background-color: #27ae60; }
  .btn-submit:hover { background-color: #2ecc71; }
  .btn-analysis { background-color: #3498db; }
  
  .status-msg { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; }
  .success { background-color: #d4edda; color: #155724; display: block; }
</style>
</head>
<body>

<div class="app-container">
  <h1>✏️ がんばり入力</h1>
  <div class="user-info" id="user-display">読み込み中...</div>

  <div class="input-group">
    <label>🏫 がっこうで 勉強した時間（分）</label>
    <input type="number" id="school-time" placeholder="0" min="0">
  </div>

  <div class="input-group">
    <label>🏠 じぶんで 勉強した時間（分）</label>
    <input type="number" id="self-time" placeholder="0" min="0">
  </div>

  <button class="btn btn-submit" onclick="saveData()">🚀 データを送る（上書き）</button>
  <div id="status" class="status-msg"></div>

  <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

  <button class="btn btn-analysis" onclick="goToAnalysis()">📊 みんなの分析を見る</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト";
  document.getElementById('user-display').innerText = `こんにちは、${myName} さん`;

  window.saveData = async function() {
    const schoolTime = document.getElementById('school-time').value || 0;
    const selfTime = document.getElementById('self-time').value || 0;
    const status = document.getElementById('status');

    // 今日の日付を取得 (YYYY-MM-DD 形式)
    const now = new Date();
    const dateStr = now.getFullYear() + "-" + 
                    ("0" + (now.getMonth() + 1)).slice(-2) + "-" + 
                    ("0" + now.getDate()).slice(-2);

    // 【重要】ドキュメントIDを「名前_日付」に設定することで同じ日は上書きされる
    const docId = `${myName}_${dateStr}`;

    try {
      await setDoc(doc(db, "learning_logs", docId), {
        name: myName,
        date: dateStr,
        school: Number(schoolTime),
        self: Number(selfTime),
        updatedAt: new Date() // いつ更新したか記録
      });

      status.innerText = "✅ ほぞんしました！(まちがいは上書きされたよ)";
      status.className = "status-msg success";
      
      // 入力欄をクリアしない（今の数字を残して、あとで微調整しやすくする）
    } catch (e) {
      alert("エラーが起きました: " + e);
    }
  };

  window.goToAnalysis = function() {
    location.href = `analysis.html?name=${encodeURIComponent(myName)}`;
  };
</script>
</body>
</html>
