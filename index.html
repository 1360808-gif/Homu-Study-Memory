<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #f0f8ff;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 20px 0;
    margin: 0;
  }
  .app-container {
    background: #fff;
    width: 95%;
    max-width: 600px;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    padding: 20px;
    text-align: center;
  }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  
  .section {
    background-color: #fdfdfd;
    border: 1px solid #ecf0f1;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 25px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }

  /* 学年全体ゲージのデザイン */
  .goal-text { font-size: 16px; font-weight: bold; color: #e67e22; margin-bottom: 10px; }
  .progress-bg {
    background-color: #ecf0f1;
    border-radius: 10px;
    height: 30px;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, #f1c40f, #f39c12);
    height: 100%;
    width: 65%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    color: white;
    font-weight: bold;
    border-radius: 10px 0 0 10px;
  }
  
  .chart-container { position: relative; height: 250px; width: 100%; }

  /* 先生用設定エリアのデザイン */
  .teacher-section {
    background-color: #ffeaa7;
    border: 2px dashed #fdcb6e;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    text-align: left;
  }
  .teacher-section h3 { margin: 0 0 10px 0; font-size: 16px; color: #d35400; }
  .class-setting {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.7);
    padding: 8px;
    border-radius: 5px;
  }
  .class-setting input { width: 60px; padding: 5px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }

  /* グラフのフィルター（ラジオボタン）デザイン */
  .filter-container {
    display: flex;
    justify-content: space-around;
    background-color: #ecf0f1;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
  }
  .filter-container label {
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  button.main-btn {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff;
    background-color: #95a5a6; border: none; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🌟 〇年生 がんばりダッシュボード</h1>

  <div class="teacher-section">
    <h3>👨‍🏫 先生用：平均計算の調整（プロトタイプ機能）</h3>
    <p style="font-size: 12px; color: #555; margin-bottom: 10px;">
      ※長期欠席などで学習に参加できない児童を除外できます。
    </p>
    <div class="class-setting">
      <span>1組 (在籍30名)</span>
      <div>除外: <input type="number" id="exclude-1" min="0" max="30" value="0" onchange="updateChart()"> 名</div>
    </div>
    <div class="class-setting">
      <span>2組 (在籍30名)</span>
      <div>除外: <input type="number" id="exclude-2" min="0" max="30" value="0" onchange="updateChart()"> 名</div>
    </div>
    <div class="class-setting">
      <span>3組 (在籍30名)</span>
      <div>除外: <input type="number" id="exclude-3" min="0" max="30" value="0" onchange="updateChart()"> 名</div>
    </div>
  </div>

  <div class="section">
    <h2>🤝 みんなで達成しよう！（学年合計）</h2>
    <p class="goal-text">目標 10,000時間 まで、あと 3,500時間！</p>
    <div class="progress-bg">
      <div class="progress-bar">6,500時間 (65%)</div>
    </div>
  </div>

  <div class="section">
    <h2>🔥 クラス対抗！ 今週の【1人あたり】平均時間</h2>
    <div class="chart-container">
      <canvas id="classChart"></canvas>
    </div>
  </div>

  <div class="section">
    <h2>👤 あなたのがんばり（青木 太郎 さん）</h2>
    
    <div class="filter-container">
      <label><input type="radio" name="studyType" value="all" checked onchange="filterPersonalChart()"> ぜんぶ（複合）</label>
      <label><input type="radio" name="studyType" value="school" onchange="filterPersonalChart()"> がっこう</label>
      <label><input type="radio" name="studyType" value="self" onchange="filterPersonalChart()"> じぶん</label>
    </div>

    <div class="chart-container">
      <canvas id="personalChart"></canvas>
    </div>
  </div>

  <button class="main-btn" onclick="alert('入力画面にもどります')">最初の画面にもどる</button>

</div>

<script>
  // ＝ ② クラス対抗グラフ（省略せず記載） ＝
  const classData = {
    "1組": { totalTime: 6300, baseStudents: 30 },
    "2組": { totalTime: 7350, baseStudents: 30 },
    "3組": { totalTime: 5700, baseStudents: 30 }
  };

  const classCtx = document.getElementById('classChart').getContext('2d');
  let classChart = new Chart(classCtx, {
    type: 'bar',
    data: {
      labels: ['1組', '2組', '3組'],
      datasets: [{
        label: '1人あたりの平均時間（分）',
        data: [0, 0, 0],
        backgroundColor: ['rgba(52, 152, 219, 0.7)', 'rgba(231, 76, 60, 0.7)', 'rgba(46, 204, 113, 0.7)'],
        borderColor: ['rgba(52, 152, 219, 1)', 'rgba(231, 76, 60, 1)', 'rgba(46, 204, 113, 1)'],
        borderWidth: 1
      }]
    },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  function updateChart() {
    const ex1 = parseInt(document.getElementById('exclude-1').value) || 0;
    const ex2 = parseInt(document.getElementById('exclude-2').value) || 0;
    const ex3 = parseInt(document.getElementById('exclude-3').value) || 0;
    const active1 = Math.max(1, classData["1組"].baseStudents - ex1);
    const active2 = Math.max(1, classData["2組"].baseStudents - ex2);
    const active3 = Math.max(1, classData["3組"].baseStudents - ex3);
    classChart.data.datasets[0].data = [
      Math.round(classData["1組"].totalTime / active1),
      Math.round(classData["2組"].totalTime / active2),
      Math.round(classData["3組"].totalTime / active3)
    ];
    classChart.update();
  }
  updateChart();

  // ＝ ③ 個人の記録グラフ ＝
  const personalCtx = document.getElementById('personalChart').getContext('2d');
  // ※あとで操作できるように 'let personalChart' で定義します
  let personalChart = new Chart(personalCtx, {
    type: 'bar',
    data: {
      labels: ['1週目', '2週目', '3週目', '今週'],
      datasets: [
        { label: 'がっこうの勉強', data: [120, 150, 130, 90], backgroundColor: '#2980b9' }, // datasetIndex: 0
        { label: 'じぶんの学習', data: [60, 40, 80, 120], backgroundColor: '#c0392b' }  // datasetIndex: 1
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: '時間（分）' } } }
    }
  });

  // 追加：フィルター切り替え機能
  function filterPersonalChart() {
    // 選択されているラジオボタンの値を取得
    const selectedType = document.querySelector('input[name="studyType"]:checked').value;

    if (selectedType === 'all') {
      personalChart.setDatasetVisibility(0, true);  // がっこう：表示
      personalChart.setDatasetVisibility(1, true);  // じぶん：表示
    } else if (selectedType === 'school') {
      personalChart.setDatasetVisibility(0, true);  // がっこう：表示
      personalChart.setDatasetVisibility(1, false); // じぶん：隠す
    } else if (selectedType === 'self') {
      personalChart.setDatasetVisibility(0, false); // がっこう：隠す
      personalChart.setDatasetVisibility(1, true);  // じぶん：表示
    }
    
    // 変更をグラフに反映させる
    personalChart.update();
  }
</script>

</body>
</html>
