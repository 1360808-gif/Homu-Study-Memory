<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先生用 管理画面</title>
<style>
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #ecf0f1; /* 落ち着いたグレー */
    color: #333;
    display: flex;
    justify-content: center;
    padding: 40px 0;
    margin: 0;
  }
  .admin-container {
    background: #fff;
    width: 95%;
    max-width: 600px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    padding: 30px;
  }
  h1 { font-size: 22px; color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; margin-top: 0; }
  h2 { font-size: 18px; color: #34495e; margin: 20px 0 10px 0; }
  
  /* パスワード画面用 */
  #login-screen { text-align: center; }
  #login-screen input { width: 80%; padding: 10px; font-size: 18px; margin-bottom: 20px; text-align: center; }
  
  /* 管理画面用 */
  #admin-screen { display: none; }
  
  .setting-card {
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .class-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed #ccc;
    padding: 10px 0;
  }
  .class-row:last-child { border-bottom: none; }
  
  .input-group { display: flex; align-items: center; gap: 10px; }
  .input-group label { font-size: 14px; color: #555; }
  .input-group input { width: 60px; padding: 5px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
  
  .status-text { font-size: 14px; font-weight: bold; color: #2980b9; }

  button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff;
    background-color: #34495e; border: none; border-radius: 5px; cursor: pointer;
    margin-top: 15px; transition: background-color 0.2s;
  }
  button:hover { background-color: #2c3e50; }
  .save-btn { background-color: #27ae60; }
  .save-btn:hover { background-color: #219a52; }
</style>
</head>
<body>

<div class="admin-container">
  
  <div id="login-screen">
    <h1>🔒 先生用 管理画面ログイン</h1>
    <p>管理者パスワードを入力してください</p>
    <input type="password" id="admin-pass" placeholder="パスワード（例: 0000）">
    <button onclick="checkAdminPassword()">ログイン</button>
  </div>

  <div id="admin-screen">
    <h1>👨‍🏫 学年ダッシュボード 管理設定</h1>
    <p style="font-size: 14px; color: #666;">ダッシュボードに反映されるクラスの平均値の計算式を調整します。</p>

    <h2>📊 クラス人数の設定（分母の調整）</h2>
    <div class="setting-card">
      <p style="font-size: 12px; color: #e74c3c; margin-top: 0;">※長期欠席等の児童を除外し、子供たちのグラフの平均値を適正に保ちます。</p>
      
      <div class="class-row">
        <strong>1組</strong>
        <div class="input-group">
          <label>基本在籍:</label>
          <input type="number" id="base-1" value="30" onchange="calcActive(1)">
          <label>除外:</label>
          <input type="number" id="exclude-1" value="0" min="0" onchange="calcActive(1)">
        </div>
        <div class="status-text">計算用: <span id="active-1">30</span>名</div>
      </div>

      <div class="class-row">
        <strong>2組</strong>
        <div class="input-group">
          <label>基本在籍:</label>
          <input type="number" id="base-2" value="30" onchange="calcActive(2)">
          <label>除外:</label>
          <input type="number" id="exclude-2" value="0" min="0" onchange="calcActive(2)">
        </div>
        <div class="status-text">計算用: <span id="active-2">30</span>名</div>
      </div>

      <div class="class-row">
        <strong>3組</strong>
        <div class="input-group">
          <label>基本在籍:</label>
          <input type="number" id="base-3" value="30" onchange="calcActive(3)">
          <label>除外:</label>
          <input type="number" id="exclude-3" value="0" min="0" onchange="calcActive(3)">
        </div>
        <div class="status-text">計算用: <span id="active-3">30</span>名</div>
      </div>
    </div>

    <button class="save-btn" onclick="saveSettings()">設定を保存してダッシュボードに反映</button>
    <button onclick="logout()">ログアウト</button>
  </div>

</div>

<script>
  // 簡易的なパスワードチェック（プロトタイプ用：0000でログイン）
  function checkAdminPassword() {
    const pass = document.getElementById('admin-pass').value;
    if (pass === '0000') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
    } else {
      alert('パスワードが間違っています。');
    }
  }

  // ログアウト処理
  function logout() {
    document.getElementById('admin-pass').value = '';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }

  // 計算用人数（分母）をリアルタイム表示する
  function calcActive(classNum) {
    const base = parseInt(document.getElementById(`base-${classNum}`).value) || 0;
    const exclude = parseInt(document.getElementById(`exclude-${classNum}`).value) || 0;
    
    // 0人以下にならないように最低1人とする
    const active = Math.max(1, base - exclude);
    document.getElementById(`active-${classNum}`).innerText = active;
  }

  // 保存ボタン（本来はここでGASやデータベースに設定値を送信します）
  function saveSettings() {
    alert('設定を保存しました。\n（※本来はここでデータベースに人数情報が送られ、子供のダッシュボードの計算式が書き換わります）');
  }
</script>

</body>
</html>
