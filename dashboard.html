<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 600px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  h1 { font-size: 22px; color: #2c3e50; margin-bottom: 5px; }
  h2 { font-size: 18px; color: #34495e; margin: 0 0 10px 0; text-align: left; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; }
  
  /* 二つ名とAIアドバイス */
  .title-badge { background: #6c5ce7; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; display: inline-block; margin-top: 10px; }
  .ai-message-area { background: linear-gradient(135deg, #e0f7fa, #ffffff); border: 2px solid #4fc3f7; border-radius: 15px; padding: 15px; margin: 15px 0; display: flex; align-items: center; gap: 15px; text-align: left; }
  .ai-icon { font-size: 40px; }
  .ai-text { font-size: 14px; font-weight: bold; color: #0277bd; line-height: 1.4; }
  .ai-stats { font-size: 11px; color: #546e7a; margin-top: 5px; }

  /* 入力ボタン */
  .top-action { margin: 15px 0 25px 0; }
  .btn-record { width: 100%; padding: 20px; font-size: 20px; font-weight: bold; color: #fff; background: linear-gradient(135deg, #f39c12, #e67e22); border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3); transition: transform 0.2s; }

  .section { background-color: #fdfdfd; border: 1px solid #ecf0f1; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  .global-filter { display: flex; justify-content: space-around; background-color: #ffeaa7; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 2px solid #fdcb6e; }
  .period-select-area { margin-bottom: 25px; }
  
  .progress-bg { background-color: #ecf0f1; border-radius: 10px; height: 30px; width: 100%; position: relative; overflow: hidden; }
  .progress-bar { background: linear-gradient(90deg, #f1c40f, #f39c12); height: 100%; width: 0%; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; transition: width 0.5s ease; }
  .chart-container { position: relative; height: 250px; width: 100%; }
  
  .teacher-section { background-color: #eee; border: 2px dashed #bdc3c7; border-radius: 10px; padding: 10px; margin-bottom: 20px; text-align: left; font-size: 12px; }
  button.nav-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background-color: #3498db; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px;}
</style>
</head>
<body>

<div class="app-container">
  <span id="user-title" class="title-badge">かけだしの学習者</span>
  <h1>🏠 <span id="user-name-display">ゲスト</span> のダッシュボード</h1>

  <div class="ai-message-area">
    <div class="ai-icon" id="ai-icon">🤖</div>
    <div class="ai-content">
        <div class="ai-text" id="ai-comment">データを読み込んでいるよ...</div>
        <div class="ai-stats" id="ai-stats"></div>
    </div>
  </div>

  <div class="top-action">
    <button class="btn-record" onclick="goToInput()">✏️ 学習時間をきろくする</button>
  </div>

  <div class="global-filter">
    <label><input type="radio" name="viewType" value="all" checked> ぜんぶ</label>
    <label><input type="radio" name="viewType" value="school"> がっこう</label>
    <label><input type="radio" name="viewType" value="self"> じぶん</label>
  </div>
  
  <div class="period-select-area">
    📅 きかん：
    <select id="period-select" style="padding:5px; border-radius:5px;">
      <option value="total">これまでぜんぶ</option>
      <option value="this-week">こんしゅう</option>
      <option value="this-month">こんげつ</option>
    </select>
  </div>

  <div class="teacher-section">
    👨‍🏫 平均用人数: 1組:<input type="number" id="ex-1" value="30" style="width:35px"> 2組:<input type="number" id="ex-2" value="30" style="width:35px"> 3組:<input type="number" id="ex-3" value="30" style="width:35px">
  </div>

  <div class="section">
    <h2 id="goal-title">🤝 みんなで達成しよう！</h2>
    <p id="goal-text" style="font-weight:bold; color:#e67e22; margin-bottom:10px;">目標読み込み中...</p>
    <div class="progress-bg"><div class="progress-bar" id="progress-bar">0%</div></div>
  </div>

  <div class="section">
    <h2>🔥 クラス平均（1人あたり）</h2>
    <div class="chart-container"><canvas id="classChart"></canvas></div>
  </div>

  <div class="section">
    <h2>👤 あなたの履歴</h2>
    <div class="chart-container"><canvas id="personalChart"></canvas></div>
  </div>

  <button class="nav-btn" onclick="goToInput()">✏️ 学習時間を入力する</button>
  <button class="nav-btn" style="background:#95a5a6" onclick="location.href='index.html'">🚪 ログアウト</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト", myClass = params.get('class') || "1";
  document.getElementById('user-name-display').innerText = myName;

  let cachedLogs = [];
  const classCtx = document.getElementById('classChart').getContext('2d');
  let classChart = new Chart(classCtx, {
    type: 'bar',
    data: { labels: ['1組', '2組', '3組'], datasets: [{ label: 'がっこう', data:[0,0,0], backgroundColor:'#2980b9'}, {label:'じぶん', data:[0,0,0], backgroundColor:'#c0392b'}]},
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
  });

  const personalCtx = document.getElementById('personalChart').getContext('2d');
  let personalChart = new Chart(personalCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'がっこう', data:[], borderColor:'#2980b9', fill:false}, {label:'じぶん', data:[], borderColor:'#c0392b', fill:false}]},
    options: { responsive: true, maintainAspectRatio: false }
  });

  onSnapshot(query(collection(db, "learning_logs"), orderBy("date", "asc")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  function render() {
    const filter = document.querySelector('input[name="viewType"]:checked').value;
    const period = document.getElementById('period-select').value;
    const denoms = { "1": Number(document.getElementById('ex-1').value)||1, "2": Number(document.getElementById('ex-2').value)||1, "3": Number(document.getElementById('ex-3').value)||1 };
    const now = new Date();

    // 期間判定関数
    const isTarget = (dateStr) => {
      const d = new Date(dateStr);
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (period === 'this-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
        return d >= sun;
      }
      return true;
    };

    let classTotals = { "1": {s:0, f:0}, "2": {s:0, f:0}, "3": {s:0, f:0} };
    let myData = { labels: [], s: [], f: [] };
    let grandTotal = 0;

    // AI比較用変数
    let stats = { tw:0, lw:0, tm:0, lm:0 };
    const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
    const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
    const thisM = now.getMonth();
    const lastM = (thisM === 0) ? 11 : thisM - 1;

    cachedLogs.forEach(log => {
      const isMyLog = log.name === myName;
      const d = new Date(log.date);

      // AI比較用（自分のデータのみ）
      if (isMyLog) {
        if (d >= sun) stats.tw += (log.school + log.self);
        else if (d >= lastSun && d < sun) stats.lw += (log.school + log.self);
        if (d.getMonth() === thisM && d.getFullYear() === now.getFullYear()) stats.tm += (log.school + log.self);
        else if (d.getMonth() === lastM) stats.lm += (log.school + log.self);
      }

      // グラフ表示用フィルタ
      if (!isTarget(log.date)) return;
      if (classTotals[log.class]) { classTotals[log.class].s += log.school; classTotals[log.class].f += log.self; }
      if (isMyLog) { myData.labels.push(log.date); myData.s.push(log.school); myData.f.push(log.self); }
      grandTotal += (filter === 'all' ? (log.school + log.self) : (filter === 'school' ? log.school : log.self));
    });

    // 1. AIアドバイスと二つ名
    updateAI(stats, myData);

    // 2. 目標達成度（期間・フィルタ連動）
    const target = (period === 'total') ? 30000 : 5000;
    const percent = Math.min(100, Math.round((grandTotal / target) * 100));
    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('progress-bar').innerText = percent + '%';
    document.getElementById('goal-text').innerText = `目標まで あと ${Math.max(0, target - grandTotal)} 分！ (合計: ${grandTotal}分)`;

    // 3. クラス比較グラフ（平均値）
    classChart.data.datasets[0].data = [classTotals["1"].s/denoms["1"], classTotals["2"].s/denoms["2"], classTotals["3"].s/denoms["3"]];
    classChart.data.datasets[1].data = [classTotals["1"].f/denoms["1"], classTotals["2"].f/denoms["2"], classTotals["3"].f/denoms["3"]];
    classChart.update();

    // 4. 個人履歴
    personalChart.data.labels = myData.labels.slice(-10);
    personalChart.data.datasets[0].data = myData.s.slice(-10);
    personalChart.data.datasets[1].data = myData.f.slice(-10);
    personalChart.update();
  }

  function updateAI(stats, myData) {
    const aiText = document.getElementById('ai-comment');
    const aiStats = document.getElementById('ai-stats');
    const aiIcon = document.getElementById('ai-icon');
    const userTitle = document.getElementById('user-title');

    // 二つ名判定
    let title = "かけだしの学習者";
    if (myData.s.length > 10) title = "きろくの達人";
    const totalS = myData.s.reduce((a,b)=>a+b,0), totalF = myData.f.reduce((a,b)=>a+b,0);
    if (totalF > totalS * 1.5) title = "じしゅうの鬼";
    userTitle.innerText = title;

    // アドバイス
    if (stats.tw > stats.lw && stats.lw > 0) {
      aiText.innerText = "すごい！先週よりペースが上がっているよ！"; aiIcon.innerText = "🔥";
    } else if (stats.tm < stats.lm && stats.tm > 0) {
      aiText.innerText = "先月よりのんびりペースかな？ここから取り返そう！"; aiIcon.innerText = "🐢";
    } else {
      aiText.innerText = "きみの頑張りをしっかり見守っているよ！"; aiIcon.innerText = "🤖";
    }
    aiStats.innerHTML = `今週:${stats.tw}分 (先週:${stats.lw}分) | 今月:${stats.tm}分 (先月:${stats.lm}分)`;
  }

  document.getElementById('period-select').addEventListener('change', render);
  document.querySelectorAll('input').forEach(el => el.addEventListener('change', render));
  window.goToInput = () => location.href = `input.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
</script>
</body>
</html>
