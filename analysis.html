<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>がんばり分析 - 学習アプリ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f8ff; color: #333; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .app-container { background: #fff; width: 95%; max-width: 800px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
  
  .filter-area { background-color: #ffeaa7; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #fdcb6e; }
  .section { background: white; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 25px; }
  h2 { font-size: 18px; color: #2c3e50; border-left: 5px solid #3498db; padding-left: 10px; text-align: left; margin-bottom: 15px; }

  /* グラフエリア（横スクロール対応） */
  .chart-wrapper { width: 100%; overflow-x: auto; margin-bottom: 10px; border-radius: 8px; background: #fdfdfd; }
  .chart-container { position: relative; height: 350px; min-width: 600px; padding: 10px; }

  .note { font-size: 12px; color: #666; background: #e8f4f8; padding: 10px; border-radius: 8px; text-align: left; line-height: 1.5; }
  button.nav-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background-color: #3498db; border: none; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>

<div class="app-container">
  <h1>📊 みんなのがんばり分析</h1>

  <div class="filter-area">
    <div style="margin-bottom: 10px;">
        <label><input type="radio" name="viewType" value="all" checked> ぜんぶ</label>
        <label><input type="radio" name="viewType" value="school"> がっこう</label>
        <label><input type="radio" name="viewType" value="self"> じぶん</label>
    </div>
    📅 きかん：
    <select id="period-select" style="padding:8px; border-radius:5px; font-size:16px;">
        <option value="total">これまでぜんぶ</option>
        <option value="this-week">こんしゅう</option>
        <option value="last-week">せんしゅう</option>
        <option value="this-month">こんげつ</option>
    </select>
  </div>

  <div class="section">
    <h2>🤝 じぶんのまわりの様子</h2>
    <div class="chart-wrapper">
      <div class="chart-container">
        <canvas id="analysisChart"></canvas>
      </div>
    </div>
    <div class="note">
        💡 <strong>⭐️があなたです。</strong><br>
        自分に近い順位の友達が表示されています。グラフの濃い色が「学校」、薄い色が「家」での学習時間です。
    </div>
  </div>

  <div class="section">
    <h2>🏆 総合トップ10</h2>
    <div id="ranking-list" style="text-align: left; font-size: 14px;">
        </div>
  </div>

  <button class="nav-btn" onclick="history.back()">🏠 ダッシュボードにもどる</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name') || "ゲスト";

  let cachedLogs = [];
  const ctx = document.getElementById('analysisChart').getContext('2d');
  let analysisChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: [], datasets: [
      { label: '学校', data: [], backgroundColor: [], borderRadius: 5 },
      { label: '家', data: [], backgroundColor: [], borderRadius: 5 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, title: { display: true, text: '分' } } },
      plugins: { legend: { display: false } }
    }
  });

  onSnapshot(query(collection(db, "learning_logs")), (snapshot) => {
    cachedLogs = [];
    snapshot.forEach(doc => cachedLogs.push(doc.data()));
    render();
  });

  function render() {
    const viewType = document.querySelector('input[name="viewType"]:checked').value;
    const period = document.getElementById('period-select').value;
    const now = new Date();

    const isTarget = (dateStr) => {
      const d = new Date(dateStr);
      if (period === 'total') return true;
      if (period === 'this-month') return d.getMonth() === now.getMonth();
      if (period === 'this-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay()); sun.setHours(0,0,0,0);
        return d >= sun;
      }
      if (period === 'last-week') {
        const sun = new Date(now); sun.setDate(now.getDate() - now.getDay());
        const lastSun = new Date(sun); lastSun.setDate(sun.getDate() - 7);
        return d >= lastSun && d < sun;
      }
      return true;
    };

    // 集計
    let userAgg = {};
    cachedLogs.forEach(log => {
      if (!isTarget(log.date)) return;
      if (!userAgg[log.name]) userAgg[log.name] = { name: log.name, school: 0, self: 0, total: 0 };
      userAgg[log.name].school += log.school;
      userAgg[log.name].self += log.self;
      userAgg[log.name].total = (viewType === 'all' ? (userAgg[log.name].school + userAgg[log.name].self) : (viewType === 'school' ? userAgg[log.name].school : userAgg[log.name].self));
    });

    const sorted = Object.values(userAgg).sort((a, b) => b.total - a.total);
    sorted.forEach((u, i) => u.rank = i + 1);

    // 1. 棒グラフ用データ（自分の前後3名）抽出
    const myIndex = sorted.findIndex(u => u.name === myName);
    let displayData = [];
    if (myIndex !== -1) {
        const start = Math.max(0, myIndex - 3);
        const end = Math.min(sorted.length, myIndex + 4);
        displayData = sorted.slice(start, end);
    } else {
        displayData = sorted.slice(0, 7);
    }

    // グラフ描画更新
    analysisChart.data.labels = displayData.map(u => (u.name === myName ? "⭐️あなた" : `${u.rank}位`));
    analysisChart.data.datasets[0].data = displayData.map(u => u.school);
    analysisChart.data.datasets[1].data = displayData.map(u => u.self);
    analysisChart.data.datasets[0].backgroundColor = displayData.map(u => u.name === myName ? '#e67e22' : '#2980b9');
    analysisChart.data.datasets[1].backgroundColor = displayData.map(u => u.name === myName ? '#f1c40f' : '#3498db');
    analysisChart.update();

    // 2. ランキングリスト（トップ10）更新
    const rankList = document.getElementById('ranking-list');
    rankList.innerHTML = sorted.slice(0, 10).map(u => 
      `<div style="padding:8px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; ${u.name === myName ? 'background:#fff9c4; font-weight:bold;' : ''}">
        <span>${u.rank}位: ${u.name === myName || u.rank <= 3 ? u.name : '（匿名）'}</span>
        <span>${u.total} 分</span>
      </div>`
    ).join('');
  }

  document.getElementById('period-select').addEventListener('change', render);
  document.querySelectorAll('input[name="viewType"]').forEach(el => el.addEventListener('change', render));
</script>
</body>
</html>
