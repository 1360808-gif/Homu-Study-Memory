<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習入力（金〜木サイクル）</title>
    <style>
        /* スタイルは以前の使いやすいものをそのまま維持 */
        body { font-family: sans-serif; background-color: #fffbe6; padding: 20px; text-align: center; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 20px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .tab-btn.active { background: #fff; color: #d35400; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { background: #fdfaf0; border: 1px solid #f9ebea; border-radius: 15px; padding: 20px; margin-bottom: 15px; text-align: left; position: relative; }
        .card h3 { margin-top: 0; color: #d35400; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .fri-badge { display: none; background: #e74c3c; color: white; font-size: 11px; padding: 3px 8px; border-radius: 5px; position: absolute; top: -10px; right: 10px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .row { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .input-group { display: flex; align-items: center; gap: 5px; }
        input[type="number"] { width: 60px; padding: 10px; border: 2px solid #f39c12; border-radius: 8px; text-align: center; font-size: 18px; }
        input[type="date"] { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; width: 100%; box-sizing: border-box; }
        .help-text { font-size: 12px; color: #7f8c8d; margin-top: 5px; line-height: 1.4; }
        .btn-submit { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .btn-back { margin-top: 15px; background: none; border: none; text-decoration: underline; cursor: pointer; color: #7f8c8d; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="user-info">読み込み中...</h2>
    
    <div class="tab-menu">
        <button id="btn-day" class="tab-btn active" onclick="switchMode('day')">1日分</button>
        <button id="btn-week" class="tab-btn" onclick="switchMode('week')">1週間分まとめ</button>
    </div>

    <div id="area-day">
        <div class="card">
            <h3>📅 いつの分？</h3>
            <input type="date" id="date-day">
        </div>
        <div class="card">
            <h3>⏰ 時間</h3>
            <div class="row"><span>🏫 学校</span><div class="input-group"><input type="number" id="ds-h" min="0">時<input type="number" id="ds-m" min="0">分</div></div>
            <div class="row"><span>🏠 じぶん</span><div class="input-group"><input type="number" id="df-h" min="0">時<input type="number" id="df-m" min="0">分</div></div>
        </div>
    </div>

    <div id="area-week" style="display:none;">
        <div class="card">
            <div id="fri-msg" class="fri-badge">金曜日だね！新しい計画の始まり✨</div>
            <h3>📅 何週目？（金曜始まり）</h3>
            <input type="date" id="date-week">
            <p id="week-guide" class="help-text" style="color:#d35400; font-weight:bold;"></p>
        </div>
        <div class="card">
            <h3>⏰ 1週間の「合計」</h3>
            <div class="row"><span>🏫 学校</span><div class="input-group"><input type="number" id="ws-h" min="0">時<input type="number" id="ws-m" min="0">分</div></div>
            <div class="row"><span>🏠 じぶん</span><div class="input-group"><input type="number" id="wf-h" min="0">時<input type="number" id="wf-m" min="0">分</div></div>
        </div>
    </div>

    <button id="send-btn" class="btn-submit">送信する！</button>
    <button class="btn-back" onclick="history.back()">もどる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
        authDomain: "study-app-4215b.firebaseapp.com",
        projectId: "study-app-4215b",
        storageBucket: "study-app-4215b.firebasestorage.app",
        messagingSenderId: "896254140020",
        appId: "1:896254140020:web:cbfa61dbc4345362807b21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);
    const myName = params.get('name'), myClass = params.get('class');
    document.getElementById('user-info').innerText = myName + " さんの入力";

    const now = new Date();
    document.getElementById('date-day').value = now.toISOString().split('T')[0];

    // 【修正】直近の金曜日を計算する関数
    function getRecentFriday(d) {
        const day = d.getDay(); // 0:日, 1:月, 2:火, 3:水, 4:木, 5:金, 6:土
        // 今日の曜日から見て、一番近い過去（または今日）の金曜日(5)を出す
        let diff = day >= 5 ? day - 5 : day + 2; 
        const result = new Date(d);
        result.setDate(d.getDate() - diff);
        return result;
    }
    
    const friday = getRecentFriday(new Date());
    document.getElementById('date-week').value = friday.toISOString().split('T')[0];

    if(now.getDay() === 5) {
        document.getElementById('fri-msg').style.display = 'block';
    }

    // 【修正】1週間ガイドを 金〜木 に変更
    function updateWeekGuide() {
        const d = new Date(document.getElementById('date-week').value);
        const end = new Date(d); end.setDate(d.getDate() + 6); // 金曜から数えて6日後は木曜
        document.getElementById('week-guide').innerText = `金曜 ${d.getMonth()+1}/${d.getDate()} 〜 木曜 ${end.getMonth()+1}/${end.getDate()} の分`;
    }
    document.getElementById('date-week').onchange = updateWeekGuide;
    updateWeekGuide();

    let mode = 'day';
    window.switchMode = (m) => {
        mode = m;
        document.getElementById('btn-day').classList.toggle('active', m==='day');
        document.getElementById('btn-week').classList.toggle('active', m==='week');
        document.getElementById('area-day').style.display = m==='day'?'block':'none';
        document.getElementById('area-week').style.display = m==='week'?'block':'none';
    };

    document.getElementById('send-btn').onclick = async () => {
        const btn = document.getElementById('send-btn');
        let h, m, fh, fm, date;
        
        if(mode === 'day'){
            h = parseInt(document.getElementById('ds-h').value)||0; m = parseInt(document.getElementById('ds-m').value)||0;
            fh = parseInt(document.getElementById('df-h').value)||0; fm = parseInt(document.getElementById('df-m').value)||0;
            date = document.getElementById('date-day').value;
        } else {
            h = parseInt(document.getElementById('ws-h').value)||0; m = parseInt(document.getElementById('ws-m').value)||0;
            fh = parseInt(document.getElementById('wf-h').value)||0; fm = parseInt(document.getElementById('wf-m').value)||0;
            date = document.getElementById('date-week').value;
        }
        
        if(h+m+fh+fm === 0) { alert("時間をいれてね！"); return; }
        btn.disabled = true;
        
        // IDに「モード（day/week）」と「日付」を入れることで、金〜木のまとめも上書き可能に
        const docId = `${myName}_${mode}_${date}`;

        try {
            await setDoc(doc(db, "learning_logs", docId), {
                name: myName, 
                class: myClass, 
                school: h*60+m, 
                self: fh*60+fm, 
                date: date, 
                mode: mode, 
                timestamp: serverTimestamp()
            });
            alert("送信しました！");
            location.href = `dashboard.html?class=${myClass}&name=${encodeURIComponent(myName)}`;
        } catch (e) { 
            alert("エラーです: " + e); 
            btn.disabled = false; 
        }
    };
</script>
</body>
</html>
