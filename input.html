<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習きろく - 入力</title>
<style>
  body { font-family: sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; padding: 20px; margin: 0; }
  .input-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
  h1 { font-size: 20px; color: #333; margin-bottom: 25px; }
  .input-group { text-align: left; margin-bottom: 20px; }
  label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 8px; color: #555; }
  input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
  .btn-save { width: 100%; padding: 15px; background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-back { width: 100%; padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 10px; margin-top: 15px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>

<div class="input-card">
  <h1 id="greeting">学習時間をきろくしよう</h1>
  
  <div class="input-group">
    <label>🏫 がっこうでの勉強（分）</label>
    <input type="number" id="school-time" placeholder="0" min="0">
  </div>
  
  <div class="input-group">
    <label>🏠 じぶんの勉強（分）</label>
    <input type="number" id="self-time" placeholder="0" min="0">
  </div>
  
  <button class="btn-save" onclick="saveData()">🚀 送信する</button>
  <button class="btn-back" onclick="history.back()">もどる</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const params = new URLSearchParams(window.location.search);
  const myName = params.get('name');
  const myClass = params.get('class');

  window.saveData = async function() {
    const sTime = Number(document.getElementById('school-time').value) || 0;
    const hTime = Number(document.getElementById('self-time').value) || 0;
    
    // 今日の日付を取得 (例: 2026-04-13)
    const now = new Date();
    const dateStr = now.getFullYear() + "-" + 
                    ("0" + (now.getMonth() + 1)).slice(-2) + "-" + 
                    ("0" + now.getDate()).slice(-2);

    // 【重要】ドキュメントIDを「名前_日付」に固定。これで同じ日は上書きになる。
    const docId = `${myName}_${dateStr}`;

    try {
      await setDoc(doc(db, "learning_logs", docId), {
        name: myName,
        class: myClass,
        date: dateStr,
        school: sTime,
        self: hTime,
        timestamp: new Date()
      });
      alert("ほぞんしました！");
      history.back(); // ダッシュボードへ戻る
    } catch (e) {
      alert("エラー: " + e);
    }
  };
</script>
</body>
</html>
