<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - 学習アプリ</title>
<style>
  body { font-family: sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-container { background: #fff; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 40px 30px; text-align: center; }
  h1 { font-size: 24px; color: #2c3e50; margin-bottom: 10px; }
  .loading-msg { color: #3498db; font-weight: bold; margin: 20px 0; }
  .input-group { margin-bottom: 20px; text-align: left; display: none; } /* 名簿読み込みまで隠す */
  .input-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
  .input-group select { width: 100%; padding: 12px; border: 2px solid #ecf0f1; border-radius: 10px; font-size: 16px; background-color: #fafafa; }
  button.login-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: #fff; background-color: #f39c12; border: none; border-radius: 10px; cursor: pointer; display: none; }
</style>
</head>
<body>

<div class="login-container">
  <h1>🌟 学習アプリ</h1>
  <div id="loading" class="loading-msg">名簿をよみこんでいます...</div>

  <div class="input-group" id="group-class">
    <label>🏫 クラス</label>
    <select id="class-select">
      <option value="">クラスをえらんでね</option>
      </select>
  </div>

  <div class="input-group" id="group-name">
    <label>👤 なまえ</label>
    <select id="name-select">
      <option value="">まずクラスをえらんでね</option>
    </select>
  </div>

  <button id="login-btn" class="login-btn" onclick="login()">はじめる！</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyAdChPr0HpgiWjqInzOemVhad82h7bnI",
    authDomain: "study-app-4215b.firebaseapp.com",
    projectId: "study-app-4215b",
    storageBucket: "study-app-4215b.firebasestorage.app",
    messagingSenderId: "896254140020",
    appId: "1:896254140020:web:cbfa61dbc4345362807b21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allStudents = [];

  // Firestoreから児童名簿を取得
  async function fetchStudents() {
    try {
      const q = query(collection(db, "students"), orderBy("class"), orderBy("no"));
      const querySnapshot = await getDocs(q);
      querySnapshot.forEach((doc) => {
        allStudents.push(doc.data());
      });

      setupClassSelect();
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('group-class').style.display = 'block';
      document.getElementById('group-name').style.display = 'block';
      document.getElementById('login-btn').style.display = 'block';
    } catch (e) {
      document.getElementById('loading').innerText = "エラー: めいぼがとれませんでした。";
      console.error(e);
    }
  }

  // クラスの選択肢を作る
  function setupClassSelect() {
    const classSelect = document.getElementById('class-select');
    const classes = [...new Set(allStudents.map(s => s.class))]; // 重複削除
    classes.forEach(cls => {
      const opt = document.createElement('option');
      opt.value = cls;
      opt.textContent = cls + "組";
      classSelect.appendChild(opt);
    });
  }

  // クラスが選ばれたら、そのクラスの子供だけを表示する
  document.getElementById('class-select').addEventListener('change', (e) => {
    const selectedClass = e.target.value;
    const nameSelect = document.getElementById('name-select');
    nameSelect.innerHTML = '<option value="">なまえをえらんでね</option>';

    const filtered = allStudents.filter(s => s.class == selectedClass);
    filtered.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.name;
      nameSelect.appendChild(opt);
    });
  });

  // ログイン処理をグローバルに公開
  window.login = function() {
    const classVal = document.getElementById('class-select').value;
    const nameVal = document.getElementById('name-select').value;
    if (!classVal || !nameVal) {
      alert("クラスとなまえをえらんでね！");
      return;
    }
    location.href = `dashboard.html?class=${classVal}&name=${encodeURIComponent(nameVal)}`;
  };

  fetchStudents();
</script>
</body>
</html>
